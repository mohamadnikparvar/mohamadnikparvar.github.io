          }) };
        if (doc.assignAt) doc.lines.forEach((l) => {
          if (rnd() < .035) { l.cancelQty = rnd() < .6 ? l.qty : ri(1, l.qty); l.cancelReason = pick(DEL_CANCEL); }
          else if (!MANUAL_DEL.includes(src) && rnd() < .02) { l.expert = l.qty; l.expertNote = pick(EXPERT_NOTES); }
        });
        dels.push(doc);
      }
    }
  });

  /* 2. min-stock rules from the last 90 days of demand */
  const cons = {};
  dels.forEach((d) => { if (d.createdAt < END - 90 * DAY) return; d.lines.forEach((l) => { if (l.unit !== baseUnit(l.sku)) return; const k = d.whId + "|" + l.sku; cons[k] = (cons[k] || 0) + l.qty - l.cancelQty; }); });
  st.rules = [];
  st.warehouses.forEach((w) => Object.keys(WH_ITEMS[w.id] || {}).forEach((sku) => {
    const dd = (cons[w.id + "|" + sku] || 0) / 90, prod = sku.startsWith("FG"), lead = prod ? ri(2, 5) : ri(7, 21);
    const min = Math.max(2, Math.round(dd * 7)), rop = min + Math.max(1, Math.round(dd * lead)), max = rop + Math.max(4, Math.round(dd * 30));
    st.rules.push({ whId: w.id, sku, min, rop, max, lead, route: prod ? "تولید" : "خرید", at: iso(born(w)) });
  }));

  /* 3. opening balances sized so every item lands on its planned state */
  const flows = {};
  const add = (k, t, q) => (flows[k] = flows[k] || []).push({ t, q });
  st.receipts.forEach((r) => r.lines.forEach((ln) => ln.out.put.forEach((o) => add(r.whId + "|" + ln.sku, tm(o.at), o.qty))));
  dels.forEach((d) => { if (d.pickedAt) d.lines.forEach((l) => add(d.whId + "|" + l.sku + (l.unit === baseUnit(l.sku) ? "" : "|" + l.unit), d.pickedAt, -(l.qty - l.cancelQty - l.expert))); });
  st.openings = [];
  const target = {};
  st.rules.forEach((ru) => {
    const k = ru.whId + "|" + ru.sku, w = st.warehouses.find((x) => x.id === ru.whId);
    let run = 0, low = 0;
    (flows[k] || []).sort((a, b) => a.t - b.t).forEach((e) => { run += e.q; low = Math.min(low, run); });
    const plan = STOCK_PLAN[k];
    target[k] = plan === "out" ? 0 : plan === "low" ? ri(Math.max(1, Math.ceil(ru.rop * .35)), ru.rop)
      : plan === "over" ? Math.round(ru.max * (1.15 + rnd() * .25)) : ri(ru.rop + 1, ru.max);
    const q0 = Math.max(0, target[k] - run, -low);
    const at = iso(born(w)), locs = pickLocs(ru.whId);
    if (q0 > 0) {
      /* about two pallets per cell */
      const n = Math.min(5, Math.max(1, Math.ceil(q0 / (itemOf(ru.sku).pp * 2)))), cells = shuffle(locs).slice(0, n);
      cells.forEach((loc, j) => { const q = j < n - 1 ? Math.floor(q0 / n) : q0 - Math.floor(q0 / n) * (n - 1); if (q > 0) st.openings.push({ whId: ru.whId, loc, sku: ru.sku, unit: baseUnit(ru.sku), qty: q, at }); });
    }
    if (QUARANTINE[k]) st.openings.push({ whId: ru.whId, loc: pick(["Q/01/1", "Q/01/2"]), sku: ru.sku, unit: baseUnit(ru.sku), qty: QUARANTINE[k], at });
    /* opened (split) units of the same item sit in their own cell as a separate stock row */
    const alt = itemOf(ru.sku).alt;
    if (alt) {
      let r2 = 0, low2 = 0;
      (flows[k + "|" + alt.unit] || []).sort((a, b) => a.t - b.t).forEach((e) => { r2 += e.q; low2 = Math.min(low2, r2); });
      st.openings.push({ whId: ru.whId, loc: pick(locs), sku: ru.sku, unit: alt.unit, qty: -low2 + ri(alt.per, alt.per * 3), at });
    }
  });

  /* 4. stocktaking sessions: a location count and an item count per month, plus one still in progress */
  const sessions = [];
  st.warehouses.forEach((w) => {
    const locs = pickLocs(w.id), skus = Object.keys(WH_ITEMS[w.id] || {});
    [6, 7, 8, 9].forEach((m) => {
      if (!w.active && m > 8) return;
      const base = new Date(2026, m, 1, 8).getTime();
      const a = base + ri(17, 23) * DAY, b = base + ri(6, 11) * DAY;
      if (a > born(w)) sessions.push({ whId: w.id, kind: "loc", start: a, targets: shuffle(locs).slice(0, ri(8, 12)) });
      if (skus.length && b > born(w)) sessions.push({ whId: w.id, kind: "item", start: b, targets: shuffle(skus).slice(0, ri(2, 4)) });
    });
    if (w.active) sessions.push({ whId: w.id, kind: "loc", start: END - ri(3, 5) * DAY, targets: shuffle(locs).slice(0, ri(6, 9)) });
  });
  sessions.forEach((s) => {
    s.entries = s.targets.map((tg) => {
      const c = s.start + ri(1, 30) * H, m = c + ri(2, 40) * H, ret = rnd() < .1, f = m + ri(4, 96) * H + (ret ? ri(24, 72) * H : 0);
      return { target: tg, counter: pick(PDA_USERS), countedAt: later(c), managerAt: later(c) && later(m), financeAt: later(c) && later(m) && later(f),
        returned: ret && m <= END, rows: [] };
    });
  });

  /* 5. replay every movement in time order */
  /* balances are kept per warehouse, cell, item and unit */
  const bal = {}, bk = (wh, loc, sku, unit) => wh + "|" + loc + "|" + sku + "|" + unit;
  const put = (wh, loc, sku, unit, q) => { const k = bk(wh, loc, sku, unit); bal[k] = (bal[k] || 0) + q; };
  const take = (d, l, need, at) => {
    const b = (c) => bal[bk(d.whId, c, l.sku, l.unit)] || 0;
    const cands = pickLocs(d.whId).filter((c) => b(c) > 0).sort((x, y) => b(y) - b(x));
    for (const c of cands) { if (!need) break; const q = Math.min(need, b(c)); put(d.whId, c, l.sku, l.unit, -q); need -= q; l.picks.push({ loc: c, qty: q, at: iso(at) }); l.picked += q; }
    return need;
  };
  const ev = [];
  st.openings.forEach((o) => ev.push({ t: tm(o.at), o: 0, fn: () => put(o.whId, o.loc, o.sku, o.unit, o.qty) }));
  st.receipts.forEach((r) => r.lines.forEach((ln) => ln.out.put.forEach((o) => ev.push({ t: tm(o.at), o: 1, fn: () => put(r.whId, o.loc, ln.sku, ln.unit, o.qty) }))));
  dels.forEach((d) => { if (d.pickedAt) ev.push({ t: d.pickedAt, o: 2, fn: () => d.lines.forEach((l) => {
    const short = take(d, l, l.qty - l.cancelQty - l.expert, d.pickedAt);
    if (short > 0) l.purchase = short;
    if (d.deliveredAt) l.delivered = l.picked;
  }) }); });
  sessions.forEach((s) => s.entries.forEach((e) => { if (e.countedAt) ev.push({ t: e.countedAt, o: 3, fn: () => {
    const cells = Object.keys(bal).filter((k) => bal[k] > 0).map((k) => k.split("|")).filter(([wh, loc, sku]) => +wh === s.whId && !isQ(loc) && (s.kind === "loc" ? loc === e.target : sku === e.target))
      .map(([, loc, sku, unit]) => ({ loc, sku, unit }));
    e.rows = cells.map((x) => {
      const sys = bal[bk(s.whId, x.loc, x.sku, x.unit)];
      let diff = rnd() < .12 ? (rnd() < .65 ? -1 : 1) * ri(1, Math.max(1, Math.round(sys * .05))) : 0;
      if (sys + diff < 0) diff = -sys;
      const row = { loc: x.loc, sku: x.sku, unit: x.unit, sys, counted: sys + diff };
      /* stock picked between the count and finance approval caps how much a shortage can write off */
      if (diff && e.financeAt) adj.push({ t: e.financeAt, fn: () => { const q = Math.max(diff, -(bal[bk(s.whId, x.loc, x.sku, x.unit)] || 0)); row.counted = sys + q; put(s.whId, x.loc, x.sku, x.unit, q); } });
      return row;
    });
  } }); }));
  /* count adjustments only become known while replaying, so they wait in their own queue */
  const adj = [];
  ev.sort((a, b) => a.t - b.t || a.o - b.o);
  for (let i = 0; i < ev.length || adj.length;) {
    adj.sort((a, b) => a.t - b.t);
    const next = adj.length && (i >= ev.length || adj[0].t <= ev[i].t) ? adj.shift() : ev[i++];
    next.fn();
  }

  /* 6. bring planned "out" / "low" items down to their target, then record the requests that could not be served */
  const nonQ = (wh, sku) => sum(pickLocs(wh).map((c) => bal[bk(wh, c, sku, baseUnit(sku))] || 0));
  st.rules.forEach((ru) => {
    const k = ru.whId + "|" + ru.sku, plan = STOCK_PLAN[k];
    if (plan !== "out" && plan !== "low") return;
    const extra = nonQ(ru.whId, ru.sku) - target[k], src = DEL_SOURCES[ru.whId][0];
    if (extra > 0) {
      const c = END - ri(30, 70) * H;
      const d = { whId: ru.whId, source: src, useLoc: pick(USE_LOCS[src]), requester: pick(REQUESTERS), createdAt: c, assignAt: c + H, pickedAt: c + 2 * H, deliveredAt: c + 3 * H,
        picker: pick(PDA_USERS), receiver: pick(REQUESTERS), lines: [{ sku: ru.sku, unit: baseUnit(ru.sku), qty: extra, picks: [], picked: 0, delivered: 0, cancelQty: 0, cancelReason: "", purchase: 0, expert: 0, expertNote: "", closedAt: null }] };
      take(d, d.lines[0], extra, d.pickedAt); d.lines[0].delivered = d.lines[0].picked;
      dels.push(d);
    }
    if (plan === "out") {
      const c2 = END - ri(6, 18) * H, q = Math.max(2, Math.round((WH_ITEMS[ru.whId][ru.sku] || 1) * ri(3, 6)));
      dels.push({ whId: ru.whId, source: src, useLoc: pick(USE_LOCS[src]), requester: pick(REQUESTERS), createdAt: c2, assignAt: c2 + H, pickedAt: c2 + 2 * H, deliveredAt: null,
        picker: pick(PDA_USERS), receiver: "", lines: [{ sku: ru.sku, unit: baseUnit(ru.sku), qty: q, picks: [], picked: 0, delivered: 0, cancelQty: 0, cancelReason: "", purchase: q, expert: 0, expertNote: "", closedAt: null }] });
    }
  });
  /* purchase / expert hand-offs older than a week have been settled */
  dels.forEach((d) => d.lines.forEach((l) => { if ((l.purchase || l.expert) && d.createdAt < END - 7 * DAY) l.closedAt = d.createdAt + ri(2, 6) * DAY; }));

  dels.sort((a, b) => a.createdAt - b.createdAt).forEach((d, i) => { d.id = i + 1; d.no = "GI-1405-" + String(1201 + i).padStart(5, "0"); });
  st.deliveries = dels;
  sessions.sort((a, b) => a.start - b.start).forEach((s, i) => {
    const w = st.warehouses.find((x) => x.id === s.whId);
    s.id = i + 1; s.no = "ST-1405-" + String(31 + i).padStart(4, "0"); s.createdAt = s.start - ri(2, 30) * H;
    s.title = (s.kind === "loc" ? "انبارگردانی مکان " : "انبارگردانی آیتم ") + w.code + " · " + new Date(s.start).toLocaleDateString("fa-IR", { month: "long" });
    delete s.targets;
  });
  st.counts = sessions;
  return st;
}

/* ================= state ================= */
let state;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { state = JSON.parse(raw); return; } } catch (e) {}
  seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
load();

let ui = {
  view: "dashboard",
  w: { q: "", site: "all", flow: "all", openId: null, tab: "info", draft: null, errors: {}, confirm: null },
  r: { q: "", wh: "all", tab: "active", openId: null, mode: (() => { try { return localStorage.getItem("wms-r-mode") === "cards" ? "cards" : "table"; } catch (e) { return "table"; } })() },
  d: { site: "all", wh: "all", period: "30", cat: "all", tab: "overview", tbl: {} },
  modal: null
};
const whById = (id) => state.warehouses.find((w) => w.id === id);
const recsOf = (whId) => state.receipts.filter((r) => r.whId === whId);
const activeCount = (whId) => recsOf(whId).filter(isActive).length;

function miniFlow(flow) {
  return '<div class="mini-flow">' + flowStages(flow).map((s, i) =>
    (i ? '<span class="ar">←</span>' : "") + '<span class="st">' + s + "</span>").join("") + "</div>";
}
function pipeline(flow) {
  const nodes = FLOWS[flow].keys.map((k) => ({ n: STAGE[k].name, h: STAGE[k].hint }))
    .concat([{ n: "تعیین وضعیت‌شده", h: "ثابت", fixed: true }]);
  return '<div class="pipe" aria-label="پیش‌نمایش مسیر رسید">' + nodes.map((x, i) =>
    (i ? '<div class="link" aria-hidden="true"></div>' : "") +
    '<div class="node' + (x.fixed ? " fixed" : "") + '"><b>' + x.n + "</b><small>" + x.h + "</small></div>").join("") + "</div>";
}
const statusPill = (r) => { const s = STATUS[rStatus(r)]; return '<span class="pill ' + s.cls + '">' + s.name + "</span>"; };

/* ================= render: shell ================= */
function render() {
  document.querySelectorAll("[data-view]").forEach((b) => {
    const on = b.dataset.view === ui.view;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const n = state.receipts.filter(isActive).length;
  $("#nav-count").textContent = n ? fa(n) : "";
  $("#tab-count").textContent = n ? fa(n) : "";
  if (ui.view === "warehouses") renderWarehouses();
  else if (ui.view === "dashboard") renderDashboard();
  else if (ui.view === "system") renderSystem();
  else if (ui.r.openId) renderReceipt();
  else renderReceipts();
  renderSheet();
  renderModal();
}
function go(view, opts) {
  ui.view = view;
  if (opts && "wh" in opts) ui.r.wh = opts.wh;
  if (opts && "tab" in opts) ui.r.tab = opts.tab;
  ui.r.openId = opts && opts.rid ? opts.rid : null;
  try { history.replaceState(null, "", "#" + view); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}

function stageColumn(r, s, live) {

      const rows = Object.keys(OUT_NAME).map((k) => {
        const q = sum(ln.out[k].map((o) => o.qty));
        if (!q) return "";
        const det = k === "put" ? [...new Set(ln.out.put.map((o) => o.loc))].join("، ") : [...new Set(ln.out[k].map((o) => o.reason))].join("، ");
        return '<div class="o-' + k + '"><span>' + OUT_NAME[k] + ' <span class="muted">(' + esc(det) + ")</span></span><b>" + fa(q) + "</b></div>";
      }).join("");
      const left = lineInProcess(ln);
      return '<div class="card"><div class="card-t"><b>' + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>" +

        (left ? '<div class="qrow muted"><span>هنوز در مسیر</span><b>' + fa(left) + "</b></div>" : '<div class="qrow"><span class="pill ok">کامل</span><b>' + fa(ln.qty) + "</b></div>") +
        "</div>";
    }).join("");
    const tot = sum(r.lines.map(lineOutTotal));

  const lines = r.lines.filter((ln) => stageQty(ln.st[s]) > 0);
  const total = sum(lines.map((ln) => stageQty(ln.st[s])));
  const dispose = (ln, from) => '<div class="mini-acts">' + ["ret", "scrap", "cancel"].map((k) =>
    '<button class="linkbtn" type="button" data-act="m-dispose" data-f="' + from + '" data-k="' + k + '" data-l="' + ln.id + '" data-s="' + s + '">' + OUT_NAME[k] + "</button>").join("") + "</div>";
  const cards = lines.map((ln) => {
    const x = ln.st[s];
    const canDrag = live && (x.pending > 0 || x.held > 0);
    let h = '<div class="card' + (canDrag ? " drag" : "") + '"' + (canDrag ? ' draggable="true" data-drag="' + ln.id + "|" + s + '" title="برای جابجایی بین مراحل بکشید"' : "") + ">" +
      '<div class="card-t">' + (canDrag ? '<span class="grip" aria-hidden="true">' + ico("grip", "sm") + "</span>" : "") +
      "<b>" + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>";
    if (x.held > 0) {
      h += '<div class="task held"><div class="task-top"><span>مغایرت PDA · ' + fa(x.held) + '</span><span class="pill warn">نیاز به تعیین تکلیف</span></div>' +
        '<div class="muted">' + x.why.map(esc).join("<br>") + "</div>";
      if (live) h += '<div class="btns"><button class="btn sm" type="button" data-act="requeue" data-l="' + ln.id + '" data-s="' + s + '">ارسال مجدد به PDA</button></div>' + dispose(ln, "held");
      h += "</div>";
    }
    if (x.pending > 0) h += '<div class="qrow"><span>در انتظار ارسال به PDA</span><b>' + fa(x.pending) + "</b></div>";
    openTasks(x).forEach((t) => {
      h += '<div class="task"><div class="task-top"><span>' + esc(t.person) + " · " + fa(t.qty) + '</span><span class="pill info">در PDA انباردار</span></div>';
      if (live) {
        h += '<div class="btns"><button class="btn sm demo" type="button" data-act="m-pda" data-l="' + ln.id + '" data-s="' + s + '" data-t="' + t.id + '">' + ico("pda", "sm") + "ثبت پاسخ PDA</button>" +
          '<button class="btn sm ghost" type="button" data-act="m-cancel-task" data-l="' + ln.id + '" data-s="' + s + '" data-t="' + t.id + '">لغو تسک</button></div>';
      }
      h += "</div>";
    });
    if (live && x.pending > 0) {
      h += '<div class="btns"><button class="btn sm primary" type="button" data-act="m-assign" data-l="' + ln.id + '" data-s="' + s + '">ارسال به PDA</button></div>' + dispose(ln, "pending");

    return h + "</div>";

  return '<div class="col" data-col="' + s + '"><div class="col-head"><div><b>' + S.name + "</b><small>" + S.hint + "</small></div>" +
    '<span class="cnt">' + fa(total) + "</span></div>" +
    (cards || '<div class="col-empty">آیتمی در این مرحله نیست.</div>') + "</div>";

/* Each tab is a spec builder: (ctx) -> { kpis, blocks }. The page, the Excel workbook and the
   printable report are all rendered from the same specs, so they never disagree. */
const HOUR = 36e5, DAYMS = 864e5;
const ms = (v) => (typeof v === "number" ? v : new Date(v).getTime());
const avg = (a) => (a.length ? sum(a) / a.length : null);
const nf = (n, d) => (n == null || isNaN(n) ? "—" : Number(n).toLocaleString("fa-IR", { maximumFractionDigits: d == null ? 0 : d }));
const pctTxt = (x, d) => (x == null || isNaN(x) ? "—" : nf(x * 100, d == null ? 0 : d) + "٪");
const jd = (t, o) => new Date(t).toLocaleDateString("fa-IR", o || { month: "short", day: "numeric" });
function durTxt(h) {
  if (h == null || isNaN(h)) return "—";
  if (h < 1) return nf(Math.max(1, Math.round(h * 60))) + " دقیقه";
  return h < 24 ? nf(h, 1) + " ساعت" : nf(h / 24, 1) + " روز";
}
const FONT = "Vazirmatn, Tahoma, 'Segoe UI', sans-serif";
const PERIODS = [["7", "۷ روز"], ["30", "۳۰ روز"], ["90", "۹۰ روز"], ["365", "یک سال"], ["all", "همه"]];
const TABS = [
  { id: "overview", name: "نمای کلی" }, { id: "stock", name: "موجودی" }, { id: "minstock", name: "حداقل موجودی" },
  { id: "counting", name: "انبارگردانی" }, { id: "receipts", name: "رسید کالا" }, { id: "deliveries", name: "تحویل کالا" }
];
const ITEM_STATUS = { ok: { name: "موجود", cls: "ok" }, low: { name: "در حال اتمام", cls: "warn" }, out: { name: "بدون موجودی", cls: "bad" } };
const MOVE_CLASS = { fast: "پرمصرف", slow: "کم‌مصرف", none: "بدون گردش" };

/* ---------- live stock from movements ---------- */
function movementList() {
  const mv = [];
  state.openings.forEach((o) => mv.push({ t: ms(o.at), wh: o.whId, loc: o.loc, sku: o.sku, unit: unitOf(o), q: o.qty, kind: "open", ref: "موجودی اول دوره" }));
  state.receipts.forEach((r) => r.lines.forEach((ln) => ln.out.put.forEach((o) => mv.push({ t: ms(o.at), wh: r.whId, loc: o.loc, sku: ln.sku, unit: ln.unit, q: o.qty, kind: "rec", ref: r.no }))));
  state.deliveries.forEach((d) => d.lines.forEach((l) => l.picks.forEach((p) => mv.push({ t: ms(p.at), wh: d.whId, loc: p.loc, sku: l.sku, unit: unitOf(l), q: -p.qty, kind: "del", ref: d.no }))));
  state.counts.forEach((s) => s.entries.forEach((e) => { if (e.financeAt) e.rows.forEach((r) => { if (r.counted !== r.sys) mv.push({ t: e.financeAt, wh: s.whId, loc: r.loc, sku: r.sku, unit: unitOf(r), q: r.counted - r.sys, kind: "adj", ref: s.no }); }); }));
  return mv.sort((a, b) => a.t - b.t);
}
const MV_KIND = { open: "موجودی اول دوره", rec: "رسید", del: "تحویل", adj: "تعدیل انبارگردانی" };
/* one stock row per warehouse × item × unit: the same item in two units is never added together */
function stockItems(mv, NOW) {
  const loc = {}, items = {};
  const get = (wh, sku, unit) => { const k = wh + "|" + sku + "|" + unit; return items[k] || (items[k] = { whId: +wh, sku, unit, sys: 0, quar: 0, reserved: 0, incoming: 0, locs: [], rule: null, out90: 0, in90: 0, lastMove: null }); };
  mv.forEach((m) => {
    const k = m.wh + "|" + m.loc + "|" + m.sku + "|" + m.unit; loc[k] = (loc[k] || 0) + m.q;
    const it = get(m.wh, m.sku, m.unit);
    if (m.kind !== "open" && m.kind !== "adj") it.lastMove = Math.max(it.lastMove || 0, m.t);
    if (m.t > NOW - 90 * DAYMS) { if (m.kind === "del") it.out90 -= m.q; if (m.kind === "rec") it.in90 += m.q; }
  });
  Object.entries(loc).forEach(([k, q]) => {
    if (!q) return;
    const [wh, l, sku, unit] = k.split("|"), it = get(wh, sku, unit);
    it.sys += q; if (isQ(l)) it.quar += q; it.locs.push({ loc: l, qty: q });
  });
  /* a min-stock rule is set on one unit of the item, its base unit here */
  state.rules.forEach((ru) => { get(ru.whId, ru.sku, baseUnit(ru.sku)).rule = ru; });
  state.deliveries.forEach((d) => {
    if (!dActive(d) || d.pickedAt) return;
    d.lines.forEach((l) => { const rest = l.qty - l.cancelQty - l.expert - l.purchase - l.picked; if (rest > 0) get(d.whId, l.sku, unitOf(l)).reserved += rest; });
  });
  state.receipts.forEach((r) => { if (isActive(r)) r.lines.forEach((ln) => { get(r.whId, ln.sku, ln.unit).incoming += lineInProcess(ln); }); });
  const multi = {};
  Object.values(items).forEach((it) => { const k = it.whId + "|" + it.sku; multi[k] = (multi[k] || 0) + 1; });
  return Object.values(items).map((it) => {
    const c = itemOf(it.sku);
    it.item = c.name; it.cat = catOf(it.sku); it.ppu = palletPer(it.sku, it.unit); it.multi = multi[it.whId + "|" + it.sku] > 1;
    it.key = [it.whId, it.sku, it.unit];
    it.avail = Math.max(0, it.sys - it.quar - it.reserved);
    it.forecast = it.avail + it.incoming;
    const ru = it.rule;
    it.status = it.avail <= 0 ? "out" : ru && it.avail <= ru.rop ? "low" : "ok";
    it.over = !!(ru && it.avail > ru.max);
    it.monthly = it.out90 / 3;
    it.move = it.monthly > 1 ? "fast" : it.monthly > 0 ? "slow" : "none";
    it.cover = it.out90 > 0 ? it.avail / (it.out90 / 90) : null;
    return it;
  });
}

/* ---------- context shared by all tabs ---------- */
function dashCtx() {
  const f = ui.d, NOW = Date.now();
  const whs = state.warehouses.filter((w) => (f.site === "all" || w.site === f.site) && (f.wh === "all" || String(w.id) === f.wh));
  const whIds = new Set(whs.map((w) => w.id));
  const first = Math.min(NOW - 30 * DAYMS, ...state.openings.map((o) => ms(o.at)));
  const len = f.period === "all" ? NOW - first : +f.period * DAYMS;
  const since = NOW - len, prev = since - len;
  const catOk = (sku) => f.cat === "all" || catOf(sku) === f.cat;
  const docOk = (lines) => f.cat === "all" || lines.some((l) => catOk(l.sku));
  const mv = movementList();
  const allStock = stockItems(mv, NOW);
  const c = {
    f, NOW, whs, whIds, len, since, prev, catOk, mv,
    inP: (t) => t > since && t <= NOW, inPrev: (t) => t > prev && t <= since,
    stock: allStock.filter((it) => whIds.has(it.whId) && catOk(it.sku)),
    receipts: state.receipts.filter((r) => whIds.has(r.whId) && docOk(r.lines)),
    dels: state.deliveries.filter((d) => whIds.has(d.whId) && docOk(d.lines)),
    counts: state.counts.filter((s) => whIds.has(s.whId)),

/* ---------- tab: stocktaking ---------- */
function tabCounting(c) {
  const eIn = c.entries.filter((x) => c.inP(x.t)), ePrev = c.entries.filter((x) => c.inPrev(x.t));
  const rows = c.rowsOf(eIn), rowsPrev = c.rowsOf(ePrev);
  const diffRows = rows.filter((r) => r.counted !== r.sys);
  const misLocs = new Set(diffRows.map((r) => r.x.whId + "|" + r.loc)), countedLocs = new Set(rows.map((r) => r.x.whId + "|" + r.loc));
  eIn.filter((x) => x.s.kind === "loc").forEach((x) => countedLocs.add(x.whId + "|" + x.e.target));
  const misItems = new Set(diffRows.map((r) => r.x.whId + "|" + r.sku)), countedItems = new Set(rows.map((r) => r.x.whId + "|" + r.sku));
  const mgr = eIn.filter((x) => x.e.managerAt).map((x) => (x.e.managerAt - x.e.countedAt) / HOUR);
  const fin = eIn.filter((x) => x.e.financeAt).map((x) => (x.e.financeAt - x.e.managerAt) / HOUR);
  /* accuracy per warehouse per month */
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(c.NOW); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d.getTime()); }
  const mEnd = (j) => (j + 1 < months.length ? months[j + 1] : c.NOW + 1);
  const accSeries = c.whs.map((w, k) => ({ name: w.name, c: k, data: months.map((m, j) => { const a = accuracy(c.rowsOf(c.entries.filter((x) => x.whId === w.id && x.t >= m && x.t < mEnd(j)))); return a == null ? null : +(a * 100).toFixed(1); }) }))
    .filter((s) => s.data.some((v) => v != null));
  const last = lastCountByLoc(c), lastDiff = {};
  c.entries.slice().sort((a, b) => a.t - b.t).forEach((x) => {
    const locs = x.s.kind === "loc" ? [x.e.target] : [...new Set(x.e.rows.map((r) => r.loc))];
    locs.forEach((l) => { lastDiff[x.whId + "|" + l] = x.e.rows.some((r) => r.loc === l && r.counted !== r.sys); });
  });
  const pLocs = c.locs.filter((l) => !isQ(l.code));
  const locState = pLocs.map((l) => { const k = l.whId + "|" + l.code, t = last[k]; return { l, t, st: !t ? "never" : t < c.NOW - 90 * DAYMS ? "stale" : lastDiff[k] ? "diff" : "ok" }; });
  const LS = { ok: "بدون مغایرت", diff: "دارای مغایرت", stale: "معوق (بیش از ۹۰ روز)", never: "شمارش‌نشده" };
  const whMis = c.whs.map((w) => {
    const r = rows.filter((x) => x.x.whId === w.id), cl = [...countedLocs].filter((k) => k.startsWith(w.id + "|")), ci = [...countedItems].filter((k) => k.startsWith(w.id + "|"));
    return { w, l: cl.length ? cl.filter((k) => misLocs.has(k)).length / cl.length * 100 : null, i: ci.length ? ci.filter((k) => misItems.has(k)).length / ci.length * 100 : null, has: r.length };
  }).filter((x) => x.has);
  const vol = months.map((m, j) => { const e = c.entries.filter((x) => x.t >= m && x.t < mEnd(j)); return { loc: e.filter((x) => x.s.kind === "loc").length, item: e.filter((x) => x.s.kind === "item").length }; });
  const heat = { rows: c.whs.map((w) => w.name), cols: months.map((m) => jd(m, { month: "short" })),
    v: c.whs.map((w) => months.map((m, j) => c.entries.filter((x) => x.whId === w.id && x.t >= m && x.t < mEnd(j)).length)) };
  const stageWh = c.whs.map((w) => { const e = eIn.filter((x) => x.whId === w.id); return { w, m: avg(e.filter((x) => x.e.managerAt).map((x) => (x.e.managerAt - x.e.countedAt) / HOUR)), f: avg(e.filter((x) => x.e.financeAt).map((x) => (x.e.financeAt - x.e.managerAt) / HOUR)) }; }).filter((x) => x.m != null);
  const staleItems = c.stock.filter((i) => i.sys > 0).map((i) => {
    const t = Math.max(0, ...c.entries.filter((x) => x.whId === i.whId && x.e.rows.some((r) => r.sku === i.sku && unitOf(r) === i.unit)).map((x) => x.t));
    return { ...i, wh: whName(i.whId), t: t || null, _item: i.key };
  }).filter((i) => !i.t || i.t < c.NOW - 60 * DAYMS);
  const open = c.counts.filter((s) => countStatus(s) !== "done");
  return {
    kpis: [
      { l: "دقت آیتمی", v: pctTxt(accuracy(rows), 1), note: nf(rows.length) + " ردیف شمارش", d: accuracy(rows) != null && accuracy(rowsPrev) != null ? accuracy(rows) - accuracy(rowsPrev) : null, dAbs: true, good: "up" },
      { l: "دقت مکانی", v: pctTxt(locAccuracy(eIn), 1), note: nf(eIn.filter((x) => x.s.kind === "loc").length) + " مکان شمارش‌شده", d: locAccuracy(eIn) != null && locAccuracy(ePrev) != null ? locAccuracy(eIn) - locAccuracy(ePrev) : null, dAbs: true, good: "up" },
      { l: "مکان‌های دارای مغایرت", v: nf(misLocs.size), u: "از " + nf(countedLocs.size), note: pctTxt(countedLocs.size ? misLocs.size / countedLocs.size : null) + " مکان‌های شمارش‌شده", tone: misLocs.size ? "warn" : "" },
      { l: "آیتم‌های دارای مغایرت", v: nf(misItems.size), u: "از " + nf(countedItems.size), note: "کسری " + nf(diffRows.filter((r) => r.counted < r.sys).length) + " · مازاد " + nf(diffRows.filter((r) => r.counted > r.sys).length) },
      { l: "شمارش‌های انجام‌شده", v: nf(eIn.length), u: "شمارش", note: "مکان " + nf(eIn.filter((x) => x.s.kind === "loc").length) + " · آیتم " + nf(eIn.filter((x) => x.s.kind === "item").length), d: delta(eIn.length, ePrev.length), good: "up" },
      { l: "میانگین زمان تأیید", v: durTxt((avg(mgr) || 0) + (avg(fin) || 0)), note: "مدیر انبار " + durTxt(avg(mgr)) + " · مالی " + durTxt(avg(fin)) }
    ],
    blocks: [
      { kind: "chart", span: 8, title: "دقت هر انبار در طول زمان", sub: "درصد ردیف‌های بدون مغایرت در هر ماه · خط‌چین هدف ۹۸٪",
        chart: { kind: "line", labels: months.map((m) => jd(m, { month: "short" })), series: accSeries, suffix: "٪", min: 80, max: 100, target: 98, dec: 1 } },
      { kind: "chart", span: 4, title: "وضعیت مکان‌ها", sub: "بر اساس آخرین شمارش هر مکان",
        chart: { kind: "donut", labels: Object.values(LS), series: [{ data: Object.keys(LS).map((k) => locState.filter((x) => x.st === k).length) }], colors: ["ok", "bad", "warn", "neutral"], unit: "مکان", center: "مکان" } },
      { kind: "chart", span: 6, title: "درصد مغایرت هر انبار", sub: "سهم مکان‌ها و آیتم‌های شمارش‌شده که مغایرت داشته‌اند",
        chart: { kind: "bar", labels: whMis.map((x) => x.w.name), series: [{ name: "مکان", data: whMis.map((x) => x.l == null ? 0 : +x.l.toFixed(1)), c: 0 }, { name: "آیتم", data: whMis.map((x) => x.i == null ? 0 : +x.i.toFixed(1)), c: 1 }], suffix: "٪", dec: 1 } },
      { kind: "chart", span: 6, title: "حجم انبارگردانی", sub: "تعداد شمارش مکان و آیتم در هر ماه",
        chart: { kind: "stack", labels: months.map((m) => jd(m, { month: "short" })), series: [{ name: "مکان", data: vol.map((v) => v.loc), c: 0 }, { name: "آیتم", data: vol.map((v) => v.item), c: 1 }], unit: "شمارش" } },
      { kind: "heat", span: 6, title: "پوشش انبارگردانی", sub: "تعداد شمارش هر انبار در هر ماه", heat },
      { kind: "chart", span: 6, title: "میانگین زمان مراحل تأیید", sub: "مدت ماندن شمارش در هر مرحله (ساعت)",
        chart: { kind: "hstack", labels: stageWh.map((x) => x.w.name), series: [{ name: "تأیید مدیر انبار", data: stageWh.map((x) => +(x.m || 0).toFixed(1)), c: 0 }, { name: "تأیید مالی", data: stageWh.map((x) => +(x.f || 0).toFixed(1)), c: 6 }], unit: "ساعت", dec: 1 } },

        rows: diffRows.map((r) => { const it = itemOf(r.sku); return { item: it.name, unit: unitOf(r), wh: whName(r.x.whId), loc: r.loc, sys: r.sys, counted: r.counted, diff: r.counted - r.sys, pct: r.sys ? Math.abs(r.counted - r.sys) / r.sys : 1, type: r.counted < r.sys ? "کسری" : "مازاد", t: r.x.t, no: r.x.s.no, _item: [r.x.whId, r.sku, unitOf(r)] }; }),

/* ---------- tab: receipts ---------- */
function tabReceipts(c) {
  const per = c.receipts.filter((r) => c.inP(ms(r.createdAt))), prev = c.receipts.filter((r) => c.inPrev(ms(r.createdAt)));
  const done = per.filter((r) => rStatus(r) === "done"), active = c.receipts.filter(isActive);
  const answers = per.flatMap(pdaAnswers), clean = answers.filter((a) => !a.miss).length;
  const disp = per.flatMap(disposals);
  const cyc = avg(done.map(cycleH)), cycPrev = avg(prev.filter((r) => rStatus(r) === "done").map(cycleH));
  const held = [];
  active.forEach((r) => r.lines.forEach((ln) => Object.entries(ln.st).forEach(([s, x]) => { if (x.held) held.push({ r, ln, s, x }); })));
  const stCount = ["wait", "review", "done", "cancel"].map((k) => per.filter((r) => rStatus(r) === k).length);
  const srcs = [...AUTO_SOURCES, ...MANUAL_SOURCES].map((s) => ({ s, n: per.filter((r) => r.source === s).length })).filter((x) => x.n);
  const byFlow = [1, 2, 3].map((fl) => { const rs = done.filter((r) => r.flow === fl); return { fl, n: rs.length, h: avg(rs.map(cycleH)) }; });
  const byStage = ["qty", "qc", "put"].map((s) => { const a = answers.filter((x) => x.s === s); return { s, n: a.length, h: avg(a.map((x) => x.h)), miss: a.filter((x) => x.miss).length }; });
  const whRows = c.whs.map((w) => { const p = per.filter((r) => r.whId === w.id), dn = p.filter((r) => rStatus(r) === "done"), an = p.flatMap(pdaAnswers);
    return { wh: w.name, flow: FLOWS[w.flow].name, n: p.length, done: dn.length, act: c.receipts.filter((r) => r.whId === w.id && isActive(r)).length, held: held.filter((x) => x.r.whId === w.id).length, cyc: avg(dn.map(cycleH)), fp: an.length ? an.filter((a) => !a.miss).length / an.length : null, _wh: w.id }; });
  const ops = PDA_USERS.map((u) => { const a = answers.filter((x) => x.t.person === u); return { u, n: a.length, h: avg(a.map((x) => x.h)), miss: a.length ? a.filter((x) => x.miss).length / a.length : null, open: active.reduce((n, r) => n + r.lines.reduce((m, ln) => m + Object.values(ln.st).reduce((k, x) => k + openTasks(x).filter((t) => t.person === u).length, 0), 0), 0) }; });
  const itemCount = {};
  per.forEach((r) => r.lines.forEach((ln) => { if (!c.catOk(ln.sku)) return; const k = r.whId + "|" + ln.sku; const o = itemCount[k] || (itemCount[k] = { item: ln.item, unit: ln.unit, wh: whName(r.whId), n: 0, qty: 0, put: 0 }); o.n++; o.qty += ln.qty; o.put += sum(ln.out.put.map((x) => x.qty)); }));
  return {
    kpis: [
      { l: "رسیدهای بازه", v: nf(per.length), u: "رسید", d: delta(per.length, prev.length), good: "up", spark: c.B.count(c.receipts.map((r) => ms(r.createdAt))), note: nf(per.filter((r) => !isManual(r)).length) + " خودکار · " + nf(per.filter(isManual).length) + " دستی" },
      { l: "در جریان", v: nf(active.length), u: "رسید", note: nf(active.filter((r) => rStatus(r) === "wait").length) + " در انتظار بررسی · " + nf(active.filter((r) => rStatus(r) === "review").length) + " در حال بررسی" },
      { l: "تکمیل‌شده", v: nf(done.length), u: "رسید", note: pctTxt(per.length ? done.length / per.length : null) + " رسیدهای بازه" },
      { l: "میانگین زمان چرخه", v: durTxt(cyc), note: "از ایجاد تا تعیین وضعیت همهٔ ردیف‌ها", d: delta(cyc, cycPrev), good: "down" },
      { l: "پاسخ PDA بدون مغایرت", v: pctTxt(answers.length ? clean / answers.length : null), note: nf(clean) + " از " + nf(answers.length) + " پاسخ" },
      { l: "مغایرت منتظر تصمیم", v: nf(held.length), u: "ردیف", note: "تنها جایی که کارشناس لازم است", tone: held.length ? "warn" : "" }
    ],
    blocks: [
      { kind: "chart", span: 8, title: "روند رسیدها", sub: "ایجادشده در برابر تکمیل‌شده · " + c.B.unit,
        chart: { kind: "bar", labels: c.B.labels, series: [{ name: "ایجادشده", data: c.B.count(c.receipts.map((r) => ms(r.createdAt))), c: 0 }, { name: "تکمیل‌شده", data: c.B.count(c.receipts.filter((r) => rStatus(r) === "done").map(finishedAt)), c: 1 }], unit: "رسید" } },
      { kind: "chart", span: 4, title: "وضعیت رسیدهای بازه", sub: "",
        chart: { kind: "donut", labels: ["در انتظار بررسی", "در حال بررسی", "تکمیل", "لغو رسید"], series: [{ data: stCount }], colors: ["warn", 0, "ok", "neutral"], unit: "رسید", center: "رسید" } },
      { kind: "chart", span: 4, title: "رسید بر اساس منبع", sub: "خودکار از سیستم‌ها یا حوالهٔ دستی",
        chart: { kind: "pie", labels: srcs.map((x) => x.s), series: [{ data: srcs.map((x) => x.n) }], colors: srcs.map((_, i) => i), unit: "رسید" } },

async function saveFile(filename, data, mime) {

    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data }); toast("فایل " + filename + " آماده شد."); return; }
  } catch (e) {
    if (e && e.code === "declined") return;
    if (e && !["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(e.code)) { toast("ذخیرهٔ فایل انجام نشد.", true); return; }
  }

  a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function runReport() {
  const m = ui.modal;
  m.tabs = [...document.querySelectorAll('input[name="r-tab"]:checked')].map((x) => x.value);
  m.fmt = (document.querySelector('input[name="r-fmt"]:checked') || {}).value || "xlsx";
  if (!m.tabs.length) { m.err = "حداقل یک بخش انتخاب کنید."; return renderModal(); }
  m.err = ""; m.busy = true; renderModal();
  try {
    if (m.fmt === "xlsx") {
      if (!window.XLSX) throw new Error("xlsx");
      await saveFile("wms-report-" + stamp() + ".xlsx", new Blob([buildXlsx(m.tabs)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    } else {
      await saveFile("wms-report-" + stamp() + ".html", new Blob([await buildHtmlReport(m.tabs)], { type: "text/html" }));
    }
    ui.modal = null; renderModal();
  } catch (e) {
    m.busy = false; m.err = e && e.message === "xlsx" ? "کتابخانهٔ Excel بارگذاری نشد؛ اتصال اینترنت را بررسی کنید." : "ساخت گزارش انجام نشد.";
    renderModal();
  }
}

      if (m.s === "qc") body += '<div class="result-grid">' +

/* manual move dialog, opened by dropping a card on a column or from the card's move button */
function moveModal(r, ln, m, sub) {
  const x = ln.st[m.s], i = r.stages.indexOf(m.s);
  const srcs = [["pending", "در انتظار ارسال به PDA", x.pending], ["held", "مغایرت", x.held]].filter((v) => v[2] > 0);
  if (!srcs.some((v) => v[0] === m.src)) m.src = srcs[0][0];
  const max = x[m.src];
  const targets = r.stages.filter((t) => canMoveTo(r, m.s, t));
  if (!targets.includes(m.to)) m.to = targets.find((t) => r.stages.indexOf(t) === i + 1) || targets[0];
  const toDone = m.to === "done", back = r.stages.indexOf(m.to) < i;
  const kinds = (m.s === "put" ? [["put", "جایگذاری دستی"]] : []).concat([["ret", "برگشت"], ["scrap", "ضایعات"], ["cancel", "لغو"]]);
  if (toDone && !kinds.some((k) => k[0] === m.k)) m.k = kinds[0][0];
  const reasons = toDone ? (m.k === "put" ? MOVE_REASONS.fwd : REASONS[m.k]) : back ? MOVE_REASONS.back : MOVE_REASONS.fwd;
  const tName = (t) => t === "done" ? "تعیین وضعیت (پایان مسیر)" : (r.stages.indexOf(t) < i ? "برگشت به «" : "انتقال به «") + STAGE[t].name + "»";
  const pipe = '<div class="move-path"><span class="from">' + STAGE[m.s].name + "</span>" + ico("left", "sm") + '<span class="to' + (back ? " back" : toDone ? " done" : "") + '">' + STAGE[m.to].name + "</span></div>";
  const body = pipe +
    '<div class="form-grid">' +
      '<div class="f"><label for="m-to">مقصد</label><select class="select" id="m-to">' + targets.map((t) => '<option value="' + t + '"' + (t === m.to ? " selected" : "") + ">" + tName(t) + "</option>").join("") + "</select></div>" +
      (srcs.length > 1 ? '<div class="f"><label for="m-src">از کدام مقدار</label><select class="select" id="m-src">' + srcs.map(([v, t, q]) => '<option value="' + v + '"' + (v === m.src ? " selected" : "") + ">" + t + " (" + fa(q) + ")</option>").join("") + "</select></div>"
        : '<div class="f"><span class="lbl">از کدام مقدار</span><span class="hint" style="font-size:var(--fs-sm)">' + srcs[0][1] + " (" + fa(srcs[0][2]) + ")</span></div>") +
      '<div class="f"><label for="m-q">مقدار <span class="req">*</span></label><input class="input" id="m-q" inputmode="numeric" value="' + esc(m.qv != null ? m.qv : fa(max)) + '"><span class="hint">حداکثر ' + fa(max) + " " + esc(ln.unit) + "</span></div>" +
      (toDone ? '<div class="f"><label for="m-kind">نوع تعیین وضعیت</label><select class="select" id="m-kind">' + kinds.map(([v, t]) => '<option value="' + v + '"' + (v === m.k ? " selected" : "") + ">" + t + "</option>").join("") + "</select></div>" : "") +
      (toDone && m.k === "put" ? '<div class="f"><label for="m-loc">مکان جایگذاری</label><select class="select" id="m-loc">' + (state.locs[r.whId] || []).filter((l) => !isQ(l.code)).map((l) => '<option dir="ltr">' + l.code + "</option>").join("") + "</select></div>" : "") +
      '<div class="f' + (toDone && m.k === "put" ? "" : " wide") + '"><label for="m-reason">دلیل <span class="req">*</span></label><select class="select" id="m-reason">' + reasons.map((v) => "<option>" + v + "</option>").join("") + "</select></div>" +
    "</div>" +
    '<span class="hint muted" style="font-size:var(--fs-xs)">' + (toDone ? (m.k === "put" ? "مقدار بدون PDA به‌عنوان جایگذاری‌شده ثبت می‌شود." : "مقدار مستقیم به ستون «تعیین وضعیت‌شده» می‌رود.")
      : back ? "مقدار در «" + STAGE[m.to].name + "» منتظر ارسال دوباره به PDA می‌ماند." : "مقدار بدون پاسخ PDA تأیید و در «" + STAGE[m.to].name + "» منتظر ارسال به PDA می‌شود.") +
    " این جابجایی با نام شما در رویدادهای رسید ثبت می‌شود.</span>";
  return dlg("جابجایی دستی " + esc(ln.item), sub, body, '<button class="btn primary" type="button" data-act="m-ok">' + ico("move", "sm") + "ثبت جابجایی</button>");
}

function modalOk() {
  const m = ui.modal;
  const bad = (msg) => { m.err = msg; renderModal(); };
  const num = (id) => toNum(document.getElementById(id).value);

  if (m.kind === "report") return runReport();
  if (m.kind === "new") {
    readNewForm();
    const d = m.form, errs = {};
    if (!d.site) errs.site = 1;
    if (!d.whId) errs.wh = 1;
    if (!d.owners.length) errs.owners = "حداقل یک مسئول حواله انتخاب کنید.";
    const items = d.items.filter((it) => it.sku && toNum(it.qty) > 0);
    if (!items.length || d.items.some((it) => (it.sku && !(toNum(it.qty) > 0)) || (!it.sku && String(it.qty).trim()))) errs.items = "وارد کردن اطلاعات حداقل یک آیتمِ رسیدشده با تعداد معتبر الزامی است.";
    m.errs = errs;
    if (Object.keys(errs).length) return bad("وارد کردن سایت / انبار / مسئول حواله / منبع ایجاد حواله الزامی است.");
    const r = makeReceipt({ id: Math.max(0, ...state.receipts.map((x) => x.id)) + 1, no: nextReceiptNo(), whId: +d.whId, source: d.source,
      ref: d.ref, supplier: d.supplier, lead: d.lead, desc: d.desc, owners: d.owners, by: ME,
      lines: items.map((it) => ({ sku: it.sku, qty: toNum(it.qty) })) });
    state.receipts.push(r); save();
    ui.modal = null; ui.r.openId = r.id; ui.view = "receipts";
    render(); toast("حوالهٔ رسید " + r.no + " با موفقیت ایجاد شد.");
    return;
  }

  const r = curReceipt(), ln = m.l ? curLine(m) : null;
  if (m.kind === "assign" || m.kind === "dispose") {
    const q = num("m-q"), max = ln.st[m.s][m.kind === "dispose" ? m.f : "pending"];
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    if (m.kind === "assign") { const p = $("#m-p").value; ops.assign(r, ln, m.s, q, p, $("#m-n").value.trim()); toast("تسک به PDA " + p + " ارسال شد."); }
    if (m.kind === "dispose") { ops.dispose(r, ln, m.s, m.f, m.k, q, $("#m-reason").value); toast(fa(q) + " " + ln.unit + " " + OUT_NAME[m.k] + " ثبت شد."); }
  }
  if (m.kind === "move") {
    readMoveForm();
    const q = num("m-q"), max = ln.st[m.s][m.src], reason = $("#m-reason").value;
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    if (m.to !== "done") { ops.move(r, ln, m.s, m.src, m.to, q, reason); toast(fa(q) + " " + ln.unit + " به «" + STAGE[m.to].name + "» منتقل شد."); }
    else if (m.k === "put") { const loc = $("#m-loc").value; ops.manualPut(r, ln, m.src, q, loc, reason); toast(fa(q) + " " + ln.unit + " دستی در " + loc + " جایگذاری شد."); }
    else { ops.dispose(r, ln, m.s, m.src, m.k, q, reason); toast(fa(q) + " " + ln.unit + " " + OUT_NAME[m.k] + " ثبت شد."); }
  }
  if (m.kind === "cancel-task") { ops.cancelTask(r, ln, m.s, m.t); toast("تسک لغو شد."); }
  if (m.kind === "pda") {
    const t = curTask(m);
    let res;
    if (m.s === "qty") { const c = num("m-c"); if (!(c >= 0) || !Number.isInteger(c)) return bad("تعداد معتبر وارد کنید."); if (c > t.qty) return bad("تعداد شمارش‌شده نمی‌تواند بیشتر از مقدار منتسب‌شده باشد."); res = { count: c }; }
    if (m.s === "qc") { const a = num("m-ok"), b = num("m-pa"), c = num("m-rj");
      if ([a, b, c].some((x) => !(x >= 0) || !Number.isInteger(x))) return bad("هر سه مقدار باید عدد صحیح باشند.");
      if (a + b + c === 0) return bad("حداقل یک مقدار وارد کنید.");
      if (a + b + c > t.qty) return bad("مجموع نتایج نمی‌تواند بیشتر از " + fa(t.qty) + " باشد.");
      res = { ok: a, partial: b, rej: c }; }
    if (m.s === "put") { const c = num("m-c"); if (!(c >= 0) || !Number.isInteger(c)) return bad("تعداد معتبر وارد کنید."); if (c > t.qty) return bad("تعداد کالای جایگذاری‌شده بیشتر است."); res = { placed: c, loc: $("#m-loc").value }; }
    const o = ops.pda(r, ln, m.s, m.t, res);
    toast("پاسخ PDA ثبت شد؛ " + fa(o.ok) + " " + ln.unit + " به «" + STAGE[o.n].name + "» رفت" + (o.rest ? " و " + fa(o.rest) + " مغایرت منتظر تعیین تکلیف است." : "."));
  }
  if (m.kind === "cancel-receipt") { ops.cancelReceipt(r, $("#m-reason").value); toast("رسید " + r.no + " لغو شد."); }
  save(); ui.modal = null; render();
}

function validate(d) {

    if (["code", "name", "type", "site", "address", "desc"].some((k) => old[k] !== d[k])) entries.push("اطلاعات انبار ویرایش شد");

const THEME_KEY = "wms-theme";
function applyTheme(t, persist) {
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  if (persist) try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  const cur = document.documentElement.getAttribute("data-theme");
  applyTheme(t || cur || "auto", false);
})();

function toast(msg, bad) {
  const t = $("#toast");
  t.innerHTML = ico(bad ? "alert" : "check") + "<span>" + esc(msg) + "</span>"; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const th = e.target.closest("[data-theme-set]");
  if (th) { applyTheme(th.dataset.themeSet, true); render(); return; }
  const ci = e.target.closest("[data-cmd]");
  if (ci) { const x = cmdList[+ci.dataset.cmd]; if (x) x.run(); return; }
  const nav = e.target.closest("[data-view]");
  if (nav) { go(nav.dataset.view, { rid: null }); return; }
  const wf = e.target.closest("[data-wflow]");
  if (wf) { ui.w.flow = wf.dataset.wflow; renderWarehouses(); return; }
  const rm = e.target.closest("[data-rmode]");
  if (rm) { ui.r.mode = rm.dataset.rmode; try { localStorage.setItem("wms-r-mode", ui.r.mode); } catch (err) {} renderReceipts(); return; }
  const rt = e.target.closest("[data-rtab]");
  if (rt) { ui.r.tab = rt.dataset.rtab; renderReceipts(); return; }
  const dp = e.target.closest("[data-dper]");
  if (dp) { ui.d.period = dp.dataset.dper; renderDashboard(); return; }
  const dt = e.target.closest("[data-dtab]");
  if (dt) { ui.d.tab = dt.dataset.dtab; renderDashboard(); window.scrollTo(0, 0); return; }
  const so = e.target.closest("[data-sort]");
  if (so) {
    const [id, k] = so.dataset.sort.split("|"), t = ui.d.tbl[id] = ui.d.tbl[id] || {};
    t.dir = t.k === k ? -(t.dir || 1) : (lastSpec.spec.blocks.find((x) => x.id === id).cols.find((x) => x.k === k).num ? -1 : 1); t.k = k;
    return refreshTable(id);
  }
  const mo = e.target.closest("[data-more]");
  if (mo) { const t = ui.d.tbl[mo.dataset.more] = ui.d.tbl[mo.dataset.more] || {}; t.all = !t.all; return refreshTable(mo.dataset.more); }
  const cv = e.target.closest("[data-csv]");
  if (cv) { const blk = lastSpec.spec.blocks.find((x) => x.id === cv.dataset.csv); return saveFile("wms-" + cv.dataset.csv + "-" + stamp() + ".csv", tableCsv(blk), "text/csv;charset=utf-8"); }
  const im = e.target.closest("tr[data-item]");
  if (im) { const [wh, sku, unit] = im.dataset.item.split("|"); return openModal({ kind: "item", wh: +wh, sku, unit: unit || baseUnit(sku) }); }
  const iu = e.target.closest("[data-item-unit]");
  if (iu) { ui.modal.unit = iu.dataset.itemUnit; return renderModal(); }
  const dw = e.target.closest("tr[data-dwh]");
  if (dw) { const wid = +dw.dataset.dwh; go("receipts", { wh: String(wid), tab: activeCount(wid) ? "active" : "all" }); return; }

  const b = e.target.closest("[data-act]");
  if (b && !b.closest("#sheet")) {
    const a = b.dataset.act, m = { l: b.dataset.l, s: b.dataset.s, t: b.dataset.t, k: b.dataset.k, f: b.dataset.f };
    if (a === "cmd") return openCmd();
    if (a === "w-new") return openSheet(null);
    if (a === "w-receipts") { e.stopPropagation(); const wid = +b.dataset.wid; return go("receipts", { wh: String(wid), tab: activeCount(wid) ? "active" : "all" }); }
    if (a === "reset") { seed(); save(); ui.r.openId = null; toast("داده‌های نمونه بازنشانی شد."); return render(); }
    if (a === "d-report") return openModal({ kind: "report", tabs: [ui.d.tab], fmt: "xlsx" });
    if (a === "d-print") {
      /* the artifact viewer blocks the print dialog, so hand over a print-ready report instead */
      if (window.claude) return openModal({ kind: "report", tabs: [ui.d.tab], fmt: "html", note: "در این نما پنجرهٔ چاپ مرورگر در دسترس نیست. گزارش چاپی را دریافت کنید، در مرورگر باز کنید و دکمهٔ «چاپ یا ذخیره به PDF» را بزنید." });
      return window.print();
    }
    if (a === "r-all") { document.querySelectorAll('input[name="r-tab"]').forEach((x) => { x.checked = true; }); return; }
    if (a === "r-new") return openNewReceipt();
    if (a === "r-back") { ui.r.openId = null; return render(); }
    if (a === "r-clear-wh") { ui.r.wh = "all"; return renderReceipts(); }
    if (a === "r-cancel") return openModal({ kind: "cancel-receipt" });
    if (a === "requeue") {
      const r = curReceipt(), ln = curLine(m), q = ln.st[m.s].held;
      ops.requeue(r, ln, m.s); save(); render();
      return toast(fa(q) + " " + ln.unit + " برای ارسال مجدد به PDA آماده شد.");
    }
    if (a === "m-assign") return openModal(Object.assign({ kind: "assign" }, m));
    if (a === "m-pda") return openModal(Object.assign({ kind: "pda" }, m));
    if (a === "m-cancel-task") return openModal(Object.assign({ kind: "cancel-task" }, m));
    if (a === "m-dispose") return openModal(Object.assign({ kind: "dispose" }, m));
    if (a === "m-move") return openModal({ kind: "move", l: m.l, s: m.s });
    if (a === "m-close") return closeModal();
    if (a === "m-ok") return modalOk();
    if (a === "n-add") { readNewForm(); ui.modal.form.items.push({ sku: "", qty: "" }); return renderModal(); }
    if (a === "n-del") { readNewForm(); ui.modal.form.items.splice(+b.dataset.i, 1); return renderModal(); }
    return;
  }
  if (e.target.closest("#dlg") && e.target.id === "dlg") return closeModal();

  const tr = e.target.closest("tr[data-id]");
  if (tr) return openSheet(+tr.dataset.id);
  const rr = e.target.closest("tr[data-rid], .rcard[data-rid]");
  if (rr) { ui.view = "receipts"; ui.r.openId = +rr.dataset.rid; render(); window.scrollTo(0, 0); }
});
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.key === "k" || e.key === "K" || e.code === "KeyK") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return ui.modal && ui.modal.kind === "cmd" ? closeModal() : openCmd(); }
  if (e.key === "/" && !typing && !ui.modal) { e.preventDefault(); return openCmd(); }
  if (ui.modal && ui.modal.kind === "cmd" && e.target.id === "cmd-q") {
    const m = ui.modal;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (cmdList.length) { m.sel = (m.sel + (e.key === "ArrowDown" ? 1 : -1) + cmdList.length) % cmdList.length; cmdRefresh(); } return; }
    if (e.key === "Enter") { e.preventDefault(); const x = cmdList[m.sel]; if (x) x.run(); return; }
  }
  if (e.key === "Escape") { if (ui.modal) return closeModal(); if (!$("#sheet").hidden) return closeSheet(); }
  if (e.key === "Enter") {
    const tr = e.target.closest && e.target.closest("tr[data-id]");
    if (tr) return openSheet(+tr.dataset.id);
    const rr = e.target.closest && e.target.closest("tr[data-rid], .rcard[data-rid]");
    if (rr) { ui.view = "receipts"; ui.r.openId = +rr.dataset.rid; render(); }
    const dw = e.target.closest && e.target.closest("tr[data-dwh]");
    if (dw) go("receipts", { wh: dw.dataset.dwh, tab: "all" });
    const im = e.target.closest && e.target.closest("tr[data-item]");
    if (im) { const [wh, sku, unit] = im.dataset.item.split("|"); openModal({ kind: "item", wh: +wh, sku, unit: unit || baseUnit(sku) }); }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "cmd-q" && ui.modal) { ui.modal.q = e.target.value; ui.modal.sel = 0; return cmdRefresh(); }
  if (e.target.id === "w-q") { ui.w.q = e.target.value; renderWarehouses(); const el = $("#w-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  if (e.target.id === "r-q") { ui.r.q = e.target.value; renderReceipts(); const el = $("#r-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  if (e.target.dataset && e.target.dataset.tq) { const id = e.target.dataset.tq; (ui.d.tbl[id] = ui.d.tbl[id] || {}).q = e.target.value; refreshTable(id); }
});
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (ui.view === "dashboard" || ui.view === "system") render(); });
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "w-site") { ui.w.site = e.target.value; renderWarehouses(); }
  if (id === "r-wh") { ui.r.wh = e.target.value; renderReceipts(); }
  if (id === "d-site") { ui.d.site = e.target.value; renderDashboard(); }
  if (id === "d-wh") { ui.d.wh = e.target.value; renderDashboard(); }
  if (id === "d-cat") { ui.d.cat = e.target.value; renderDashboard(); }
  if (ui.modal && ui.modal.kind === "report" && e.target.name === "r-fmt") { ui.modal.fmt = e.target.value; ui.modal.tabs = [...document.querySelectorAll('input[name="r-tab"]:checked')].map((x) => x.value); renderModal(); }
  if (ui.modal && ui.modal.kind === "move" && ["m-to", "m-src", "m-kind"].includes(id)) { readMoveForm(); if (id === "m-src") ui.modal.qv = null; renderModal(); }
  if (ui.modal && ui.modal.kind === "new" && (id === "n-site" || id === "n-wh" || id.startsWith("n-it-"))) { readNewForm(); renderModal(); }
});

/* drag and drop on the receipt board: drop targets light up by the same rule the move dialog enforces */
let dragInfo = null;
function endDrag() {
  dragInfo = null;
  document.querySelectorAll(".dragging, .is-dragging, .drop-ok, .drop-no, .over").forEach((el) => el.classList.remove("dragging", "is-dragging", "drop-ok", "drop-no", "over"));
}
document.addEventListener("dragstart", (e) => {
  const c = e.target.closest && e.target.closest("[data-drag]");
  if (!c) return;
  const [l, s] = c.dataset.drag.split("|"), r = curReceipt();
  dragInfo = { l, s };
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", c.dataset.drag); } catch (err) {}
  c.classList.add("dragging");
  $(".board").classList.add("is-dragging");
  document.querySelectorAll(".board .col[data-col]").forEach((col) => {
    const to = col.dataset.col;
    if (to === s) return;
    if (!canMoveTo(r, s, to)) { col.classList.add("drop-no"); return; }
    col.classList.add("drop-ok");
    col.dataset.hint = to === "done" ? "رها کنید: تعیین وضعیت" : r.stages.indexOf(to) < r.stages.indexOf(s) ? "رها کنید: برگشت به این مرحله" : "رها کنید: انتقال به این مرحله";
  });
});
document.addEventListener("dragover", (e) => {
  if (!dragInfo) return;
  const col = e.target.closest && e.target.closest(".col.drop-ok");
  document.querySelectorAll(".col.over").forEach((x) => { if (x !== col) x.classList.remove("over"); });
  if (!col) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over");
});
document.addEventListener("drop", (e) => {
  if (!dragInfo) return;
  const col = e.target.closest && e.target.closest(".col.drop-ok"), d = dragInfo;
  endDrag();
  if (!col) return;
  e.preventDefault();
  openModal({ kind: "move", l: d.l, s: d.s, to: col.dataset.col });
});
document.addEventListener("dragend", endDrag);

$("#scrim").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", (e) => {
  const f = ui.w;
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { readForm(); f.tab = tabBtn.dataset.tab; f.confirm = null; renderSheet(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close") closeSheet();
  else if (act === "save") saveDraft();
  else if (act === "gen-code") { readForm(); f.draft.code = nextCode(); renderSheet(); }
  else if (act === "ask-delete") { readForm(); f.confirm = "delete"; renderSheet(); }
  else if (act === "cancel-confirm") { f.confirm = null; renderSheet(); }
  else if (act === "do-delete") {
    const name = f.draft.name;
    state.warehouses = state.warehouses.filter((w) => w.id !== f.draft.id); save(); closeSheet();
    toast("انبار «" + name + "» با موفقیت حذف شد.");
  }
});
$("#sheet").addEventListener("change", (e) => {
  if (e.target.name === "flow") { ui.w.draft.flow = +e.target.value; renderSheet(); }
});

if (["#receipts", "#dashboard", "#warehouses", "#system"].includes(location.hash)) ui.view = location.hash.slice(1);
$("#me-name").textContent = ME;
$("#me-av").textContent = ME.trim().charAt(0);
render();
</script>
