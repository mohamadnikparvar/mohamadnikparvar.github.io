<script>
/* ================= reference data ================= */
const STAGE = {
  qty:   { name: "کنترل کمی", hint: "شمارش با PDA" },
  qc:    { name: "کنترل کیفی", hint: "تأیید / رد" },
  put:   { name: "جایگذاری", hint: "اسکن مکان" },
  done:  { name: "تعیین وضعیت‌شده", hint: "پایان مسیر" }
};
const FLOWS = {
  1: { name: "تک‌مرحله‌ای", keys: ["put"], desc: "کالای رسیده مستقیم برای جایگذاری به PDA ارسال می‌شود. مناسب انبارهایی با اقلام کم‌ریسک و تأمین‌کنندهٔ مطمئن." },
  2: { name: "دومرحله‌ای", keys: ["qty", "put"], desc: "ابتدا تعداد کالا شمارش و با سند تطبیق داده می‌شود، سپس جایگذاری انجام می‌شود." },
  3: { name: "سه‌مرحله‌ای", keys: ["qty", "qc", "put"], desc: "شمارش، بازرسی کیفی و سپس جایگذاری. برای مواد اولیه، اقلام حساس و کالاهای دارای تاریخ انقضا." }
};
const flowStages = (f) => FLOWS[f].keys.map((k) => STAGE[k].name);
/* QC is an option of the two-step flow only */
const whQc = (w) => w.flow === 2 && !!w.qc;
const flowName = (f, qc) => FLOWS[f].name + (qc ? " با کنترل کیفی" : "");
const SITES = ["سعیدآباد ۱", "تهران مرکزی", "اصفهان"];
const TYPES = ["مواد اولیه", "مصرفی", "محصول"];
const ME = "ادمین سیستم";
const EXPERTS = ["مریم صادقی", "حسین جعفری", "زهرا کاظمی"];
const PDA_USERS = ["سجاد کریمی", "محمد رضایی", "نرگس احمدی", "علی موسوی"];
/* pp = units per pallet (catalogue conversion rate), used only for location capacity.
   alt = a smaller unit the item can be split into (1 unit = per alt units); stock in each unit stays a separate row.
   units = more smaller units, f = how many of them make one base unit (used by "تقسیم واحد" in receipts) */
const CATALOG = [
  { sku: "RM-1001", name: "آرد ستاره", unit: "کیسه ۴۰ کیلویی", pp: 40 },
  { sku: "RM-1002", name: "شکر سفید", unit: "کیسه ۵۰ کیلویی", pp: 40 },
  { sku: "RM-1003", name: "روغن نباتی", unit: "حلب ۱۶ کیلویی", pp: 60 },
  { sku: "RM-1004", name: "پودر کاکائو", unit: "کارتن", pp: 50, units: [{ unit: "بسته ۱ کیلویی", f: 10 }] },
  /* one item, two units: barrels in the warehouses, kilograms in the tank warehouse (f = kg per barrel, set in «تعریف مخازن») */
  { sku: "RM-1005", name: "گلوکز مایع", unit: "بشکه", pp: 4, units: [{ unit: "کیلوگرم", f: 290 }] },
  { sku: "RM-1006", name: "نشاستهٔ ذرت", unit: "کیسه ۲۵ کیلویی", pp: 50 },
  { sku: "RM-1007", name: "شیرخشک", unit: "کیسه ۲۵ کیلویی", pp: 50 },
  { sku: "PK-2001", name: "فیلم بسته‌بندی چاپی", unit: "رول", pp: 24 },
  { sku: "PK-2002", name: "کارتن مادر", unit: "بسته ۵۰ عددی", pp: 30, alt: { unit: "عدد", per: 50 } },
  { sku: "PK-2003", name: "سینی پلاستیکی", unit: "بسته ۱۰۰ عددی", pp: 40 },
  { sku: "PK-2004", name: "چسب نواری", unit: "کارتن", pp: 60 },
  { sku: "SP-3001", name: "بلبرینگ 6205", unit: "عدد", pp: 400 },
  { sku: "SP-3002", name: "تسمهٔ V شکل B-52", unit: "عدد", pp: 300 },
  { sku: "SP-3003", name: "روغن هیدرولیک ۶۸", unit: "گالن ۲۰ لیتری", pp: 32, alt: { unit: "لیتر", per: 20 } },
  { sku: "SP-3004", name: "فیلتر هوای کمپرسور", unit: "عدد", pp: 120 },
  { sku: "SP-3005", name: "گیربکس ۱٫۵ کیلووات", unit: "عدد", pp: 6 },
  { sku: "SP-3006", name: "سنسور القایی", unit: "عدد", pp: 500 },
  { sku: "FG-4001", name: "بایکیت", unit: "کارتن", pp: 120, alt: { unit: "عدد", per: 24 } },
  { sku: "FG-4002", name: "شونیز طلایی", unit: "کارتن", pp: 120 },
  { sku: "FG-4003", name: "ویفر کاکائویی", unit: "کارتن", pp: 120 },
  { sku: "FG-4004", name: "کراکر نمکی", unit: "کارتن", pp: 120 },
  { sku: "FG-4005", name: "کیک صبحانه", unit: "کارتن", pp: 100 },
  { sku: "CH-5001", name: "اسید سیتریک", unit: "کیسه ۲۵ کیلویی", pp: 40 },
  { sku: "CH-5002", name: "سود سوزآور", unit: "کیسه ۲۵ کیلویی", pp: 40 },
  { sku: "CH-5003", name: "هیپوکلریت سدیم", unit: "گالن ۲۰ لیتری", pp: 32 },
  { sku: "CH-5004", name: "اسید فسفریک", unit: "گالن ۲۰ لیتری", pp: 32 },
  /* bulk liquids held only in tanks */
  { sku: "RM-1101", name: "شربت اینورت", unit: "کیلوگرم", pp: 1000 },
  { sku: "RM-1102", name: "روغن مایع", unit: "کیلوگرم", pp: 1000 }
];
const LOCATIONS = genLocs().filter((l) => !l.code.startsWith("Q/")).map((l) => l.code);
const AUTO_SOURCES = ["خرید", "تولید", "برگشت از فروش"];
const MANUAL_SOURCES = ["حوالهٔ دستی خرید", "حوالهٔ دستی تولید", "حوالهٔ دستی عودت"];
const REASONS = {
  ret: ["مغایرت با سفارش خرید", "کالای اشتباه ارسال شده", "آسیب در حمل"],
  scrap: ["شکستگی بسته‌بندی", "تاریخ انقضای گذشته", "آلودگی محصول"],
  cancel: ["ثبت اشتباه در سند", "انصراف تأمین‌کننده", "تکرار ثبت"]
};
const OUT_NAME = { put: "جایگذاری‌شده", ret: "برگشت", scrap: "ضایعات", cancel: "لغو" };
/* reasons the receipt owner gives when moving quantity by hand (drag and drop) instead of via a PDA answer */
const MOVE_REASONS = {
  fwd: ["تأیید دستی کارشناس", "PDA در دسترس نیست", "تطبیق با سند تحویل"],
  back: ["نیاز به شمارش مجدد", "نیاز به بازرسی مجدد کیفی", "ثبت اشتباه در PDA"]
};
const STATUS = {
  wait:   { name: "در انتظار بررسی", cls: "warn" },
  review: { name: "در حال بررسی", cls: "info" },
  done:   { name: "تکمیل", cls: "ok" },
  cancel: { name: "لغو رسید", cls: "off" }
};
/* v3 trial file: its own storage, so the tank warehouse it adds never shows up in the main prototype */
const KEY = "wms-proto-v13-tanks3";

/* ================= helpers ================= */
const $ = (s) => document.querySelector(s);
const ico = (n, cls) => '<svg class="i' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const faDate = (iso) => { try { return new Date(iso).toLocaleDateString("fa-IR"); } catch (e) { return iso.slice(0, 10); } };
const faTime = (iso) => { try { return new Date(iso).toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const sum = (a) => a.reduce((x, y) => x + y, 0);
let clockOverride = null;
const now = () => clockOverride || new Date().toISOString();
let uidN = 1;
const uid = () => "t" + (uidN++) + Math.random().toString(36).slice(2, 6);
const toNum = (v) => { const s = String(v ?? "").replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim(); return s === "" ? NaN : Number(s); };

/* ================= receipt engine ================= */
function isManual(r) { return MANUAL_SOURCES.includes(r.source); }
function nextOf(r, s) { return r.stages[r.stages.indexOf(s) + 1]; }
function lineOutTotal(ln) { return sum(Object.values(ln.out).map((arr) => sum(arr.map((o) => o.qty)))); }
const openTasks = (x) => x.tasks.filter((t) => t.status === "open");
/* rej = quantity stopped by a QC rejection before put-away; it waits for return or scrap */
const stageQty = (x) => x.pending + x.held + (x.rej || 0) + sum(openTasks(x).map((t) => t.qty));
function lineInProcess(ln) { return sum(Object.values(ln.st).map(stageQty)); }
function rStatus(r) {
  if (r.cancelled) return "cancel";
  /* rejected QC stock still in a cell keeps the receipt open until it is returned or scrapped */
  if (r.lines.every((ln) => lineOutTotal(ln) === ln.qty) && !(r.qc && state.qc.some((q) => q.rId === r.id && qcRejOpen(q)))) return "done";
  return r.touched ? "review" : "wait";
}
const isActive = (r) => ["wait", "review"].includes(rStatus(r));
/* progress is counted in the document's unit, so a unit split never changes it */
function rProgress(r) {
  const eq = (ln, q) => q / unitF(ln.sku, ln.unit);
  const total = Math.round(sum(r.lines.map((l) => eq(l, l.qty)))), done = sum(r.lines.map((l) => eq(l, lineOutTotal(l))));
  return { total, done: Math.min(total, Math.floor(done + 1e-9)) };
}
/* unit split: lines of one document line share a group; the first one carries the document unit */
const grpOf = (ln) => ln.grp || ln.id;
const grpLines = (r, g) => r.lines.filter((l) => grpOf(l) === g);
function log(r, text, who) { r.log.unshift({ at: now(), text, who: who || ME }); }
function qtyTxt(q, ln) { return fa(q) + " " + ln.unit; }

function makeReceipt(o) {
  const w = state.warehouses.find((x) => x.id === o.whId);
  const flow = o.flow || w.flow;
  const stages = FLOWS[flow].keys.concat(["done"]);
  /* the QC option of a two-step warehouse applies to receipts created after it was turned on */
  const qc = o.qc != null ? o.qc : flow === 2 && whQc(w) && (!w.qcSince || now() >= w.qcSince);
  const r = {
    id: o.id, no: o.no, whId: o.whId, flow, qc, stages, source: o.source, ref: o.ref || "", supplier: o.supplier || "",
    lead: o.lead || "", desc: o.desc || "", owners: o.owners, createdAt: now(), createdBy: o.by || ME,
    touched: false, cancelled: false, cancelReason: "", log: [], splits: [],
    lines: o.lines.map((l, i) => {
      const c = CATALOG.find((x) => x.sku === l.sku);
      const st = {};
      stages.filter((s) => s !== "done").forEach((s, j) => { st[s] = { pending: j === 0 ? l.qty : 0, held: 0, rej: 0, why: [], tasks: [] }; });
      return { id: "L" + (i + 1), sku: c.sku, item: c.name, unit: c.unit, qty: l.qty, doc: l.qty, note: l.note || "", st, out: { put: [], ret: [], scrap: [], cancel: [] } };
    })
  };
  log(r, "رسید از منبع «" + r.source + "» با مسیر " + flowName(flow, qc) + " (" + flowStages(flow).join("، ") + ") ایجاد شد", o.by || ME);
  if (qc) qcOps.raise(r);
  return r;
}

const ops = {
  assign(r, ln, s, q, person, note, who) {
    ln.st[s].pending -= q;
    ln.st[s].tasks.push({ id: uid(), person, qty: q, note: note || "", status: "open", at: now(), result: null });
    r.touched = true;
    log(r, "تسک " + STAGE[s].name + " برای " + qtyTxt(q, ln) + " " + ln.item + " به PDA " + person + " ارسال شد", who);
  },
  cancelTask(r, ln, s, tid, who) {
    const t = ln.st[s].tasks.find((x) => x.id === tid);
    ln.st[s].pending += t.qty; ln.st[s].tasks = ln.st[s].tasks.filter((x) => x !== t);
    log(r, "تسک " + STAGE[s].name + " " + t.person + " برای " + ln.item + " لغو شد", who);
  },
  /* A PDA answer needs no expert review: the confirmed quantity moves on at once
     (to the next stage of this receipt's flow, or to "done" after putaway);
     only the discrepancy stays in the stage for the receipt owner to decide on. */
  pda(r, ln, s, tid, result) {
    const x = ln.st[s], t = x.tasks.find((y) => y.id === tid);
    t.status = "closed"; t.result = result; t.doneAt = now();
    const ok = s === "qty" ? result.count : s === "qc" ? result.ok + result.partial : result.placed;
    const n = nextOf(r, s);
    if (ok > 0) {
      if (s === "put") ln.out.put.push({ qty: ok, loc: result.loc, by: t.person, at: now() });
      else ln.st[n].pending += ok;
    }
    let txt = "";
    if (s === "qty") txt = "شمارش " + qtyTxt(result.count, ln);
    if (s === "qc") txt = "تأیید " + fa(result.ok) + "، تأیید جزئی " + fa(result.partial) + "، رد " + fa(result.rej);
    if (s === "put") txt = "جایگذاری " + qtyTxt(result.placed, ln) + " در مکان " + result.loc;
    txt = "پاسخ PDA برای " + ln.item + ": " + txt;
    if (ok > 0) txt += "؛ " + fa(ok) + " خودکار به «" + STAGE[n].name + "» رفت";

  },
  pickCancel(q, pid, who) {

    const txt = "تسک برداشت مردودی " + p.person + " از " + p.loc + " لغو شد؛ " + fa(p.qty) + " دوباره منتظر تصمیم است";

  /* PDA confirms the pick: the quantity leaves the cell and is dispositioned on the receipt */
  pickDone(q, pid, picked) {
    const x = qcLine(q), p = q.picks.find((y) => y.id === pid);
    p.status = "done"; p.picked = picked; p.doneAt = now();

    log(x.r, txt, p.person); qlog(q, txt, p.person);

  attach(q, f, who) {
    q.files = q.files || [];
    q.files.push({ id: f.id, name: f.name, size: f.size, type: f.type, kind: f.kind, at: now(), by: who || ME });
    qlog(q, "فایل «" + f.name + "» (" + f.kind + ") پیوست شد", who);

  dispose(q, kind, n, reason, who) {

    } else q.disp.push({ kind, qty: n, reason, at: now(), by: who || ME });
    qlog(q, fa(n) + " " + q.unit + " مردود " + OUT_NAME[kind] + " شد (" + reason + ")", who);
  }
};

/* ================= delivery engine (حوالهٔ تحویل) =================

   purchasing (در انتظار خرید) or go back to the requesting expert (برگشت به کارشناس); both wait beside

const DSTAGE = {

  pick:    { name: "برداشت", hint: "برداشت با PDA و بررسی" },
  deliver: { name: "تحویل", hint: "تطبیق تحویل‌گیرنده" },
  done:    { name: "تعیین وضعیت‌شده", hint: "پایان مسیر" }

const D_FLOW = ["draft", "pick", "deliver", "done"], D_KEYS = ["draft", "pick", "deliver"];
const D_SIDE = { purchase: { name: "در انتظار خرید", act: "ارسال به خرید" }, expert: { name: "در انتظار کارشناس", act: "برگشت به کارشناس" } };
const HR_PEOPLE = REQUESTERS.concat(["سعید محمدی", "نگار شریفی", "بهروز کیانی"]);
const D_CANCEL = DEL_CANCEL.concat(["کالا قابل تأمین نیست"]);
const D_REF = { "درخواست مواد تولید": "MR", "درخواست کالا": "IR", "سفارش فروش": "SO" };

const dLots = (ln) => sum(ln.st.deliver.lots.map((x) => x.qty));
const dTasks = (ln, st) => ln.st.pick.tasks.filter((t) => t.status === st);
function dStageQty(ln, s) {
  if (s === "draft") return ln.st.draft.pending;
  if (s === "pick") return ln.st.pick.pending + sum(ln.st.pick.tasks.filter((t) => t.status !== "closed").map((t) => t.qty));

const dLineIn = (ln) => sum(D_KEYS.map((s) => dStageQty(ln, s)));
const dSideOpen = (ln, k) => sum(ln.side.filter((x) => !x.closedAt && (!k || x.kind === k)).map((x) => x.qty));
const dOutQ = (ln, k) => sum(ln.out[k].map((o) => o.qty));
/* hand-offs of older history that were settled outside the document count as determined */
const dSettled = (ln, k) => sum(ln.side.filter((x) => x.res === "settled" && (!k || x.kind === k)).map((x) => x.qty));
/* a line handed back to the expert is frozen until the expert answers */
const dFrozen = (ln) => ln.side.some((x) => x.kind === "expert" && !x.closedAt);
function dStatus(d) {
  const L = d.lines.filter((l) => l.qty > 0);
  if (d.cancelled || L.every((l) => dOutQ(l, "cancel") === l.qty)) return "cancel";
  if (L.every((l) => !dLineIn(l) && !dSideOpen(l))) return "done";
  return d.touched ? "review" : "wait";
}
const dActive = (d) => ["wait", "review"].includes(dStatus(d));
const D_STATUS = { wait: { name: "منتظر اقدام", cls: "warn" }, review: { name: "در حال بررسی", cls: "info" }, done: { name: "انجام‌شده", cls: "ok" }, cancel: { name: "لغو شده", cls: "off" } };
/* progress in the document's unit, like receipts, so a unit split never changes it */
function dProgress(d) {
  const eq = (ln, q) => q / unitF(ln.sku, ln.unit);
  const total = Math.round(sum(d.lines.map((l) => eq(l, l.qty))));
  const done = sum(d.lines.map((l) => eq(l, dOutQ(l, "delivered") + dOutQ(l, "cancel") + dSettled(l))));

}
function dlog(d, text, who) { d.log.unshift({ at: now(), text, who: who || ME }); }

function dMake(o) {

/* take q from a line's picked lots, oldest first; returns the cells it came from */
function dTakeLots(ln, q) {
  const out = [];
  for (const x of ln.st.deliver.lots) {
    if (!q) break;
    const n = Math.min(q, x.qty); x.qty -= n; q -= n;
    out.push({ loc: x.loc, qty: n, by: x.by, at: x.at, ded: !!x.ded });
  }
  ln.st.deliver.lots = ln.st.deliver.lots.filter((x) => x.qty > 0);

/* summary fields read by the dashboard and the stock model.

function dSync(d) {

    l.delivered = dOutQ(l, "delivered"); l.cancelQty = dOutQ(l, "cancel");
    const c = l.out.cancel[l.out.cancel.length - 1]; l.cancelReason = c ? c.reason : "";
    const P = l.side.filter((x) => x.kind === "purchase"), E = l.side.filter((x) => x.kind === "expert");
    l.purchase = sum(P.map((x) => x.qty)); l.expert = sum(E.map((x) => x.qty)); l.expertNote = E.length ? E[E.length - 1].note : "";
    l.closedAt = l.side.length && l.side.every((x) => x.closedAt) ? Math.max(...l.side.map((x) => new Date(x.closedAt).getTime())) : null;
    l.picks = l.out.delivered.flatMap((o) => o.locs.map((p) => ({ loc: p.loc, qty: p.qty, at: p.at })))
      .concat(l.st.deliver.lots.filter((x) => x.ded).map((x) => ({ loc: x.loc, qty: x.qty, at: x.at })));
    l.picked = l.delivered + dLots(l);

  d.deliveredAt = dStatus(d) === "done" ? (all.length ? Math.max(...all.map((o) => new Date(o.at).getTime())) : d.deliveredAt || null) : null;
  if (all.length) d.receiver = all[all.length - 1].to;
}
function dRoute(d, ln, s, kind, q, note, who) {
  if (kind === "pending") ln.st.pick.pending += q;
  else if (kind === "cancel") ln.out.cancel.push({ qty: q, reason: note, stage: s, at: now(), by: who || ME });

  sessions.forEach((s) => s.entries.forEach((e) => { if (e.countedAt) ev.push({ t: e.countedAt, o: 3, fn: () => {
    const cells = Object.keys(bal).filter((k) => bal[k] > 0).map((k) => k.split("|")).filter(([wh, loc, sku]) => +wh === s.whId && !isQ(loc) && (s.kind === "loc" ? loc === e.target : sku === e.target))
      .map(([, loc, sku, unit]) => ({ loc, sku, unit }));
    e.rows = cells.map((x) => {
      const sys = bal[bk(s.whId, x.loc, x.sku, x.unit)];
      let diff = rnd() < .12 ? (rnd() < .65 ? -1 : 1) * ri(1, Math.max(1, Math.round(sys * .05))) : 0;
      if (sys + diff < 0) diff = -sys;
      const row = { loc: x.loc, sku: x.sku, unit: x.unit, sys, counted: sys + diff };
      /* stock picked between the count and finance approval caps how much a shortage can write off */
      if (diff && e.financeAt) adj.push({ t: e.financeAt, fn: () => { const q = Math.max(diff, -(bal[bk(s.whId, x.loc, x.sku, x.unit)] || 0)); row.counted = sys + q; put(s.whId, x.loc, x.sku, x.unit, q); } });

    const next = adj.length && (i >= ev.length || adj[0].t <= ev[i].t) ? adj.shift() : ev[i++];
    next.fn();

  const nonQ = (wh, sku) => sum(pickLocs(wh).map((c) => bal[bk(wh, c, sku, baseUnit(sku))] || 0));
  st.rules.forEach((ru) => {
    const k = ru.whId + "|" + ru.sku, plan = STOCK_PLAN[k];
    if (plan !== "out" && plan !== "low") return;
    const extra = nonQ(ru.whId, ru.sku) - target[k], src = DEL_SOURCES[ru.whId][0];
    if (extra > 0) {
      const c = END - ri(30, 70) * H;
      const d = { whId: ru.whId, source: src, useLoc: pick(USE_LOCS[src]), requester: pick(REQUESTERS), createdAt: c, assignAt: c + H, pickedAt: c + 2 * H, deliveredAt: c + 3 * H,
        picker: pick(PDA_USERS), receiver: pick(REQUESTERS), lines: [{ sku: ru.sku, unit: baseUnit(ru.sku), qty: extra, picks: [], picked: 0, delivered: 0, cancelQty: 0, cancelReason: "", purchase: 0, expert: 0, expertNote: "", closedAt: null }] };
      take(d, d.lines[0], extra, d.pickedAt); d.lines[0].delivered = d.lines[0].picked;

      const c2 = END - ri(6, 18) * H, q = Math.max(2, Math.round((WH_ITEMS[ru.whId][ru.sku] || 1) * ri(3, 6)));
      dels.push({ whId: ru.whId, source: src, useLoc: pick(USE_LOCS[src]), requester: pick(REQUESTERS), createdAt: c2, assignAt: c2 + H, pickedAt: c2 + 2 * H, deliveredAt: null,
        picker: pick(PDA_USERS), receiver: "", lines: [{ sku: ru.sku, unit: baseUnit(ru.sku), qty: q, picks: [], picked: 0, delivered: 0, cancelQty: 0, cancelReason: "", purchase: q, expert: 0, expertNote: "", closedAt: null }] });
    }

  /* purchase / expert hand-offs older than a week have been settled */
  dels.forEach((d) => d.lines.forEach((l) => { if ((l.purchase || l.expert) && d.createdAt < END - 7 * DAY) l.closedAt = d.createdAt + ri(2, 6) * DAY; }));

  dels.sort((a, b) => a.createdAt - b.createdAt).forEach((d, i) => { d.id = i + 1; d.no = "GI-1405-" + String(1201 + i).padStart(5, "0"); });
  st.deliveries = dels;
  sessions.sort((a, b) => a.start - b.start).forEach((s, i) => {
    const w = st.warehouses.find((x) => x.id === s.whId);
    s.id = i + 1; s.no = "ST-1405-" + String(31 + i).padStart(4, "0"); s.createdAt = s.start - ri(2, 30) * H;
    s.title = (s.kind === "loc" ? "انبارگردانی مکان " : "انبارگردانی آیتم ") + w.code + " · " + new Date(s.start).toLocaleDateString("fa-IR", { month: "long" });
    delete s.targets;
  });

}

  r.stages.forEach((s) => { if (s === "done") return; r.lines.forEach((ln) => { const x = ln.st[s]; o.held += x.held + (x.rej || 0); o.pend += x.pending; o.tasks += openTasks(x).length; }); });

/* card view: same rows as the table, laid out for scanning stage-by-stage */

/* ================= view: receipt detail ================= */
/* the owner's open moves on this receipt, most urgent first; every button runs the same action as on the board */
function rTodoRows(r) {
  const rows = [], K = r.stages.filter((s) => s !== "done");
  const a = (act, ln, s, extra) => ' data-act="' + act + '" data-l="' + ln.id + '" data-s="' + s + '"' + (extra || "");
  K.forEach((s) => r.lines.forEach((ln) => {
    const x = ln.st[s];
    if (x.held > 0) rows.push({ k: "decide", ic: "alert", t: qtyTxt(x.held, ln) + " " + esc(ln.item) + " در «" + STAGE[s].name + "» مغایرت دارد", sub: x.why.map(esc).join(" · "),
      btn: '<button class="btn sm primary" type="button"' + a("requeue", ln, s) + '>ارسال مجدد به PDA</button><button class="btn sm" type="button" data-rxgo="' + s + '">برگشت، ضایعات یا لغو در بورد</button>' });
    if (x.rej > 0) rows.push({ k: "decide", ic: "alert", t: qtyTxt(x.rej, ln) + " " + esc(ln.item) + " مردود کنترل کیفی است و نباید جایگذاری شود", sub: "برگشت به تدارکات یا ضایعات آن را ثبت کنید.",
      btn: '<button class="btn sm" type="button"' + a("m-dispose", ln, s, ' data-f="rej" data-k="ret"') + '>برگشت به تدارکات</button><button class="btn sm danger" type="button"' + a("m-dispose", ln, s, ' data-f="rej" data-k="scrap"') + ">ضایعات</button>" });
  }));
  if (r.qc) state.qc.forEach((q) => {
    const n = q.rId === r.id ? qcUndecided(q) : 0, ln = n && r.lines.find((l) => l.id === q.lId);
    if (ln) rows.push({ k: "decide", ic: "shield", t: qtyTxt(n, ln) + " " + esc(ln.item) + " مردود جایگذاری‌شده منتظر تصمیم است", sub: "در بخش «کنترل کیفی این رسید» برگشت به تدارکات یا ضایعات را انتخاب کنید.",
      btn: '<button class="btn sm" type="button" data-rxgo="qcbox">رفتن به کنترل کیفی این رسید</button>' });
  });
  K.forEach((s) => {
    const P = r.lines.filter((ln) => ln.st[s].pending > 0);
    if (P.length > 1) rows.push({ k: "send", ic: "pda", t: fa(P.length) + " قلم در «" + STAGE[s].name + "» آمادهٔ ارسال به PDA است", sub: P.map((ln) => qtyTxt(ln.st[s].pending, ln) + " " + esc(ln.item)).join(" · "),
      btn: '<button class="btn sm primary" type="button" data-act="m-assign-all" data-s="' + s + '">ارسال همه به PDA</button><button class="btn sm" type="button" data-rxgo="' + s + '">ارسال جداگانه در بورد</button>' });
    else P.forEach((ln) => rows.push({ k: "send", ic: "pda", t: qtyTxt(ln.st[s].pending, ln) + " " + esc(ln.item) + " آمادهٔ ارسال به PDA برای «" + STAGE[s].name + "» است", sub: "",
      btn: '<button class="btn sm primary" type="button"' + a("m-assign", ln, s) + ">ارسال به PDA</button>" }));
  });
  return rows;
}
function rTodoBox(r) {
  const rows = rTodoRows(r), o = rTodo(r);
  if (!rows.length && !o.tasks && !o.qcw) return "";
  const wait = [o.tasks ? fa(o.tasks) + " تسک در PDA انباردار منتظر پاسخ است" : "", o.qcw ? fa(o.qcw) + " تسک کنترل کیفی منتظر نتیجه است" : ""].filter(Boolean).join(" · ");
  return '<div class="box"><div class="box-head"><p class="section-title">' + ico(rows.length ? "alert" : "clock", "sm") + (rows.length ? " اقدام بعدی شما (" + fa(rows.length) + ")" : " منتظر دیگران") + "</p>" +
      (rows.length && wait ? '<span class="sub">' + wait + "</span>" : "") + "</div>" +
    (rows.length ? '<ul class="rx-todo">' + rows.slice(0, 6).map((x) => '<li class="' + x.k + '">' + ico(x.ic) + "<span>" + x.t + (x.sub ? "<small>" + x.sub + "</small>" : "") + '</span><div class="btns">' + x.btn + "</div></li>").join("") + "</ul>" +
        (rows.length > 6 ? '<span class="sub">و ' + fa(rows.length - 6) + " مورد دیگر در بورد مراحل</span>" : "")
      : '<ul class="rx-todo"><li>' + ico("clock") + "<span>" + wait + "<small>الان کاری از شما لازم نیست. با رسیدن پاسخ، مقدار تأییدشده خودکار به مرحلهٔ بعد می‌رود.</small></span></li></ul>") + "</div>";
}
/* one bar per document line: placed, still on its way, discrepancy, and returned / scrapped / cancelled */
function rItemsBox(r) {
  const eq = (ln, q) => q / unitF(ln.sku, ln.unit), K = r.stages.filter((s) => s !== "done");
  const G = [...new Set(r.lines.map(grpOf))];
  const rows = G.map((g) => {
    const fam = grpLines(r, g), root = fam[0], tot = sum(fam.map((ln) => eq(ln, ln.qty))) || 1;
    const part = (f) => sum(fam.map((ln) => eq(ln, f(ln))));
    const put = part((ln) => sum(ln.out.put.map((o) => o.qty))), out = part((ln) => lineOutTotal(ln)) - put;
    const held = part((ln) => sum(K.map((s) => ln.st[s].held + (ln.st[s].rej || 0)))), inp = part(lineInProcess) - held;
    const seg = (cls, v, t) => (v > 1e-9 ? '<i class="' + cls + '" style="width:' + (v * 100 / tot).toFixed(2) + '%" title="' + t + '"></i>' : "");
    return '<div class="rx-item"><b>' + esc(root.item) + (fam.length > 1 ? ' <span class="tag">' + fa(fam.length) + " واحد</span>" : "") + "</b><span>" + fa(root.doc) + " " + esc(root.unit) + "</span>" +
      '<div class="rx-bar" role="img" aria-label="' + Math.round(put * 100 / tot) + "٪ جایگذاری‌شده، " + Math.round(inp * 100 / tot) + "٪ در مسیر، " + Math.round(held * 100 / tot) + "٪ مغایرت، " + Math.round(out * 100 / tot) + '٪ برگشت، ضایعات یا لغو">' +
        seg("b-put", put, "جایگذاری‌شده") + seg("b-in", inp, "در مسیر") + seg("b-held", held, "مغایرت") + seg("b-out", out, "برگشت، ضایعات یا لغو") + "</div></div>";
  }).join("");
  return '<div class="rx-items"><div class="rx-items-h"><b>اقلام رسید</b><span>' + fa(G.length) + " قلم</span></div>" + rows +
    '<div class="rx-legend"><span><i class="b-put"></i>جایگذاری‌شده</span><span><i class="b-in"></i>در مسیر</span><span><i class="b-held"></i>مغایرت</span><span><i class="b-out"></i>برگشت، ضایعات یا لغو</span></div></div>';
}
function renderReceipt() {
  const r = state.receipts.find((x) => x.id === ui.r.openId);
  if (!r) { ui.r.openId = null; renderReceipts(); return; }
  const w = whById(r.whId), st = rStatus(r), live = st === "wait" || st === "review";
  const p = rProgress(r), pct = p.total ? Math.round(p.done * 100 / p.total) : 0;

  let flowNote = "";
  if (r.flow !== w.flow || !!r.qc !== whQc(w)) {
    flowNote = '<div class="notice warn"><strong>این رسید با مسیر ' + flowName(r.flow, r.qc) + " ایجاد شده است.</strong>" +
      "تنظیم فعلی انبار «" + esc(w.name) + "» " + flowName(w.flow, whQc(w)) + " است. تغییر تنظیمات فقط روی رسیدهایی اعمال می‌شود که بعد از تغییر ایجاد شده‌اند.</div>";
  }

  const kv = (k, v) => '<div class="kv"><span>' + k + "</span><b>" + (v || "—") + "</b></div>";
  const cols = r.stages.map((s) => stageColumn(r, s, live)).join("");
  /* stepper: where the quantity sits right now; a step scrolls to its column */
  const steps = r.stages.map((s, i) => {
    if (s === "done") {
      const out = p.done, all = p.total;
      return '<li class="rx-step' + (out === all ? " clear" : "") + '" data-rxgo="done"><span class="dot">' + (out === all ? ico("check", "sm") : fa(i + 1)) + "</span><b>" + STAGE[s].name + "</b><small>" + fa(out) + " از " + fa(all) + "</small></li>";
    }
    const inStage = (x) => sum(r.lines.map((ln) => stageQty(ln.st[x])));
    const q = inStage(s), held = sum(r.lines.map((ln) => ln.st[s].held + (ln.st[s].rej || 0)));
    const waiting = r.stages.slice(0, i).some((x) => x !== "done" && inStage(x) > 0);
    const cls = held ? "held" : q ? "cur" : waiting || r.cancelled ? "" : "clear";
    return '<li class="rx-step ' + cls + '" data-rxgo="' + s + '"><span class="dot">' + (cls === "clear" ? ico("check", "sm") : held ? "!" : fa(i + 1)) + "</span><b>" + STAGE[s].name + "</b><small>" +
      (q ? fa(q) + " در این مرحله" + (held ? " · " + fa(held) + " نیاز به تعیین تکلیف" : "") : "خالی") + "</small></li>";
  }).join("");
  const all = ui.r.logAll === r.id, L = all ? r.log : r.log.slice(0, 5);

  $("#view").innerHTML =
    '<div class="view-stack">' +
    '<div class="head"><div><div class="crumbs"><button class="linkbtn" type="button" data-act="r-back">' + ico("right", "sm") + "رسید کالا</button> " + ico("left", "sm") + ' <span class="code">' + r.no + "</span></div>" +
      '<h1>رسید <span class="code">' + r.no + "</span> " + statusPill(r) + "</h1>" +
      "<p>" + esc(r.supplier || r.source) + " · " + esc(w.name) + " · " + esc(w.site) + "</p></div>" +
      '<div class="head-actions">' +
        (canCancelReceipt(r) ? '<button class="btn danger" type="button" data-act="r-cancel">لغو کل رسید</button>' : "") +
        (live && !isManual(r) ? '<span class="tag">ایجاد خودکار از سیستم ' + esc(r.source) + "؛ قابل لغو نیست</span>" : "") +
      "</div></div>" +
    flowNote +
    (r.cancelled ? '<div class="notice bad"><strong>این رسید لغو شده است.</strong>دلیل: ' + esc(r.cancelReason) + "</div>" : "") +
    '<div class="box"><div class="rx-top">' +
      '<div class="rx-facts">' +
        kv("مرجع ورود کالا", esc(r.supplier)) + kv("سند مرجع", r.ref ? '<span class="code">' + esc(r.ref) + "</span>" : "") +
        kv("انبار", esc(w.name) + " · " + esc(w.site)) + kv("مسئول حواله", r.owners.map(esc).join("، ")) +
        kv("تاریخ ایجاد", faDate(r.createdAt) + " · " + faTime(r.createdAt) + " (" + rAge(r.createdAt) + ")") + kv("مسیر این رسید", flowName(r.flow, r.qc)) +
        '<div class="prog rx-total"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + fa(p.done) + " از " + fa(p.total) + " واحد تعیین وضعیت شده · " + fa(pct) + "٪</span></div>" +
      "</div>" + rItemsBox(r) +
      '<details class="rx-more"><summary>' + ico("left", "sm") + 'جزئیات بیشتر رسید</summary><div class="info-grid">' +
        kv("منبع ایجاد حواله", esc(r.source)) + kv("مدت زمان دریافت", esc(r.lead)) + kv("ایجادشده توسط", esc(r.createdBy)) + kv("مراحل مسیر", flowStages(r.flow).join(" ← ")) +
        (r.desc ? '<div class="kv" style="grid-column:1/-1"><span>توضیحات</span><b>' + esc(r.desc) + "</b></div>" : "") +
      "</div></details>" +
    "</div></div>" +
    (live ? rTodoBox(r) : "") +
    '<ol class="stepper" aria-label="پیشرفت مراحل رسید">' + steps + "</ol>" +
    (r.qc ? receiptQcBox(r) : "") +
    (live ? '<div class="notice demo"><strong>حالت نمایشی</strong>دکمه‌های بنفش نقش اپلیکیشن PDA انباردار را بازی می‌کنند. کارت کالا را می‌توانید بین ستون‌ها بکشید (یا از «سایر اقدام‌ها»، «جابجایی بین مراحل» را بزنید): جلو فقط به مرحلهٔ بعد و عقب به هر مرحلهٔ قبلی.</div>' : "") +
    '<div class="board" aria-label="مراحل رسید">' + cols + "</div>" +
    '<div class="box"><div class="box-head"><p class="section-title">رویدادهای رسید</p><span class="sub">' + fa(r.log.length) + ' رویداد · جدیدترین بالا</span></div><ul class="log">' +
      L.map((l) => '<li><time datetime="' + l.at + '">' + faDate(l.at) + "<br>" + faTime(l.at) + "</time><div>" + esc(l.text) + '<div class="who">' + esc(l.who) + "</div></div></li>").join("") +
    "</ul>" + (r.log.length > 5 ? '<button class="btn sm rx-logmore" type="button" data-act="r-log">' + (all ? "نمایش ۵ رویداد آخر" : "نمایش همهٔ " + fa(r.log.length) + " رویداد") + "</button>" : "") + "</div></div>";
}

/* QC results come back to the receipt: one row per line, and the receipt owner decides on rejected stock */
function receiptQcBox(r) {
  const rows = r.lines.map((ln) => {
    const q = state.qc.find((x) => x.rId === r.id && x.lId === ln.id);
    if (!q) return "";
    const held = qcHeld(q), rej = qcRejOpen(q);
    return "<tr>" +
      "<td>" + esc(ln.item) + '<span class="sub">' + esc(ln.unit) + "</span></td>" +
      '<td><button class="linkbtn code" type="button" data-act="q-open" data-qid="' + q.id + '">' + q.no + "</button>" + ((q.files || []).length ? '<span class="sub att">' + ico("attach", "sm") + fa(q.files.length) + " پیوست</span>" : "") + "</td>" +
      "<td>" + (q.type ? QC_TYPE[q.type] : '<span class="sub">هنوز تعیین نشده</span>') + "</td>" +
      "<td>" + qcPill(q) + "</td>" +
      "<td>" + verdictPill(q) + (q.result ? '<span class="sub">' + esc(qcResultTxt(q)) + "</span>" : "") + "</td>" +
      '<td class="num">' + (held ? '<span class="pill warn">' + fa(held) + "</span>" : '<span class="sub">۰</span>') + "</td>" +
      "<td>" + qcActCell(q, r) + "</td></tr>";
  }).join("");
  const anyRej = state.qc.some((q) => q.rId === r.id && qcUndecided(q) > 0);
  return '<div class="box" id="rx-qcbox"><div class="box-head"><p class="section-title">' + ico("shield", "sm") + " کنترل کیفی این رسید</p>" +
      '<span class="sub">تسک‌ها در منوی «کنترل کیفی» انجام می‌شوند، نه در PDA</span></div>' +
    '<div class="notice info"><strong>موجودی جایگذاری‌شدهٔ این رسید تا ثبت نتیجهٔ کنترل کیفی قرنطینه است.</strong>با پذیرش یا مجوز ارفاقی، موجودی «در دسترس» می‌شود. با رد، مقدار جایگذاری‌نشده از جایگذاری متوقف می‌شود و مقدار جایگذاری‌شده در قرنطینه می‌ماند تا برگشت به تدارکات یا ضایعات شود. رسید تا تعیین تکلیف همهٔ مقدار مردود تکمیل نمی‌شود.</div>' +
    (anyRej ? '<div class="notice warn"><strong>مقدار مردود جایگذاری‌شده منتظر تصمیم است.</strong>از ستون «اقدام» برگشت به تدارکات یا ضایعات را انتخاب کنید. برای برداشت از هر مکان یک تسک PDA ساخته می‌شود و موجودی بعد از پاسخ PDA کم می‌شود.</div>' : "") +
    '<div class="dt-wrap"><table class="dt"><thead><tr><th>کالا</th><th>شمارهٔ کنترل کیفی</th><th>نوع بازرسی</th><th>وضعیت</th><th>نتیجه</th><th class="num">در قرنطینه</th><th>اقدام</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>";
}

/* action cell of the receipt QC table: decide on rejected put-away stock, then follow its PDA pick tasks */
function qcActCell(q, r) {
  if (r.cancelled) return '<span class="sub">—</span>';
  const und = qcUndecided(q), open = (q.picks || []).filter((p) => p.status === "open");
  let h = "";
  if (und > 0) h += '<div class="qc-und"><span class="pill warn">' + fa(und) + ' منتظر تصمیم</span><div class="mini-acts">' +
    [["ret", "برگشت به تدارکات"], ["scrap", "ضایعات"]].map(([k, t]) => '<button class="linkbtn" type="button" data-act="q-decide" data-qid="' + q.id + '" data-k="' + k + '">' + t + "</button>").join("") + "</div></div>";
  open.forEach((p) => {
    h += '<div class="qc-pick"><span>' + (p.kind === "ret" ? "برگشت به تدارکات" : "ضایعات") + " · " + fa(p.qty) + ' از <span class="code" dir="ltr">' + esc(p.loc) + "</span> · " + esc(p.person) + '</span><span class="pill info">در PDA انباردار</span>' +
      '<div class="btns"><button class="btn sm demo" type="button" data-act="q-pick" data-qid="' + q.id + '" data-p="' + p.id + '">' + ico("pda", "sm") + "ثبت پاسخ PDA</button>" +
      '<button class="btn sm ghost" type="button" data-act="q-pick-cancel" data-qid="' + q.id + '" data-p="' + p.id + '">لغو تسک</button></div></div>';
  });
  return h || '<span class="sub">—</span>';
}

/* QC part of an item card in the "done" column: quarantined quantity, the return/scrap decision for rejected
   put-away stock, its open PDA pick tasks, and the PDA pick results */
function qcDoneBlock(q, r) {
  const qh = qcHeld(q), picks = q.picks || [];
  let h = "";
  if (qh && !q.result) h += '<div class="qrow"><span class="pill warn">قرنطینهٔ کیفی · منتظر نتیجه</span><b>' + fa(qh) + "</b></div>";
  if (qh && q.result) {
    h += '<div class="task rej"><div class="task-top"><span>مردود جایگذاری‌شده · ' + fa(qh) + '</span><span class="pill bad">قرنطینهٔ کیفی</span></div>';
    const und = qcUndecided(q);
    if (und > 0 && !r.cancelled) h += '<div class="muted">' + fa(und) + " منتظر تصمیم: برای برداشت از مکان، نوع تعیین تکلیف را انتخاب کنید.</div>" +
      '<div class="btns">' + [["ret", "برگشت به تدارکات"], ["scrap", "ضایعات"]].map(([k, t]) =>
        '<button class="btn sm' + (k === "scrap" ? " danger" : "") + '" type="button" data-act="q-decide" data-qid="' + q.id + '" data-k="' + k + '">' + t + "</button>").join("") + "</div>";
    h += "</div>";
  }
  picks.filter((p) => p.status === "open").forEach((p) => {
    h += '<div class="task"><div class="task-top"><span>برداشت مردودی · ' + esc(p.person) + " · " + fa(p.qty) + ' از <span class="code" dir="ltr">' + esc(p.loc) + '</span></span><span class="pill info">در PDA انباردار</span></div>' +
      '<div class="muted">برای ' + (p.kind === "ret" ? "برگشت به تدارکات" : "ضایعات") + " · " + esc(p.reason) + "</div>" +
      '<div class="btns"><button class="btn sm demo" type="button" data-act="q-pick" data-qid="' + q.id + '" data-p="' + p.id + '">' + ico("pda", "sm") + "ثبت پاسخ PDA</button>" +
      '<button class="btn sm ghost" type="button" data-act="q-pick-cancel" data-qid="' + q.id + '" data-p="' + p.id + '">لغو تسک</button></div></div>';
  });
  const done = picks.filter((p) => p.status === "done");
  if (done.length) h += '<div class="qc-picked"><span class="lbl">نتیجهٔ برداشت PDA</span>' + done.map((p) =>
    "<div>" + ico("check", "sm") + "<span>" + esc(p.person) + " " + fa(p.picked) + " از " + '<span class="code" dir="ltr">' + esc(p.loc) + "</span> برداشت کرد · " +
      (p.kind === "ret" ? "برگشت به تدارکات" : "ضایعات") + (p.qty - p.picked ? " · " + fa(p.qty - p.picked) + " برداشت‌نشده" : "") +
      '<small>' + faDate(p.doneAt) + " · " + faTime(p.doneAt) + "</small></span></div>").join("") + "</div>";
  return h;
}

/* "done" card of an item split into several units: rows are outcomes, columns are units,
   so the placed / scrap / return / cancel quantity of every unit can be read side by side */
function doneUnitsCard(r, g) {
  const all = grpLines(r, g), root = all[0], K = ["put", "scrap", "ret", "cancel"];
  const fam = all.filter((ln) => ln.qty > 0 || lineOutTotal(ln) > 0);
  const qOf = (ln, k) => sum(ln.out[k].map((o) => o.qty));
  const det = (ln, k) => [...new Set(ln.out[k].map((o) => (k === "put" ? o.loc : o.reason)))].join("، ");
  const left = fam.map(lineInProcess), anyLeft = left.some(Boolean);
  const cell = (ln, k) => { const q = qOf(ln, k); return q ? '<td class="o-' + k + '" title="' + esc(det(ln, k)) + '">' + fa(q) + "</td>" : '<td class="z" aria-label="صفر">—</td>'; };
  const sp = (r.splits || []).filter((x) => x.g === g);
  const notes = [];
  fam.forEach((ln) => K.forEach((k) => { if (qOf(ln, k)) notes.push("<li><b>" + OUT_NAME[k] + " · " + esc(ln.unit) + ":</b> " + (k === "put" ? '<span class="code" dir="ltr">' + esc(det(ln, k)) + "</span>" : esc(det(ln, k))) + "</li>"); }));
  return '<div class="card"><div class="card-t"><b>' + esc(root.item) + '</b><span class="code">' + root.sku + "</span> · <span>" + fa(fam.length) + " واحد</span></div>" +
    (sp.length ? '<div class="u-split">' + ico("split", "sm") + "<div><b>تقسیم واحد</b>" + sp.map((x) =>
      "<span>" + fa(x.q) + " " + esc(x.from) + " ← " + fa(x.n) + " " + esc(x.to) + "<small> · " + STAGE[x.s].name + " · " + esc(x.by) + "</small></span>").join("") + "</div></div>" : "") +
    '<div class="umx-wrap"><table class="umx"><thead><tr><th scope="col"><span class="sr-only">وضعیت</span></th>' + fam.map((ln) => '<th scope="col">' + esc(ln.unit) + "</th>").join("") + "</tr></thead><tbody>" +
      K.map((k) => '<tr><th scope="row">' + OUT_NAME[k] + "</th>" + fam.map((ln) => cell(ln, k)).join("") + "</tr>").join("") +
      (anyLeft ? '<tr class="route"><th scope="row">هنوز در مسیر</th>' + fam.map((ln, i) => (left[i] ? "<td>" + fa(left[i]) + "</td>" : '<td class="z">—</td>')).join("") + "</tr>" : "") +
    '</tbody><tfoot><tr><th scope="row">جمع</th>' + fam.map((ln) => "<td>" + fa(ln.qty) + "</td>").join("") + "</tr></tfoot></table></div>" +
    (notes.length ? '<ul class="umx-det">' + notes.join("") + "</ul>" : "") +
    (anyLeft ? '<div class="qrow"><span class="pill info">در جریان</span><span class="muted">سند: ' + fa(root.doc) + " " + esc(root.unit) + "</span></div>"
      : '<div class="qrow"><span class="pill ok">کامل</span><b>سند: ' + fa(root.doc) + " " + esc(root.unit) + "</b></div>") +
    "</div>";
}

function stageColumn(r, s, live) {
  const S = r.qc && s === "put" ? Object.assign({}, STAGE.put, { hint: "اسکن مکان · ورود به قرنطینه" }) : STAGE[s];
  if (s === "done") {
    const groups = [...new Set(r.lines.map(grpOf))].filter((g) => grpLines(r, g).some((ln) => lineOutTotal(ln) > 0));
    const cards = groups.map((g) => {
      if (grpLines(r, g).length > 1) return doneUnitsCard(r, g);
      const ln = grpLines(r, g)[0];
      const rows = Object.keys(OUT_NAME).map((k) => {
        const q = sum(ln.out[k].map((o) => o.qty));
        if (!q) return "";
        const det = k === "put" ? [...new Set(ln.out.put.map((o) => o.loc))].join("، ") : [...new Set(ln.out[k].map((o) => o.reason))].join("، ");
        return '<div class="o-' + k + '"><span>' + OUT_NAME[k] + ' <span class="muted">(' + esc(det) + ")</span></span><b>" + fa(q) + "</b></div>";
      }).join("");
      const left = lineInProcess(ln);
      const qq = r.qc && state.qc.find((x) => x.rId === r.id && x.lId === ln.id), qh = qq ? qcHeld(qq) : 0;
      return '<div class="card"><div class="card-t"><b>' + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>" +
        '<div class="outs">' + rows + "</div>" +
        (qq ? qcDoneBlock(qq, r) : "") +
        (left ? '<div class="qrow muted"><span>هنوز در مسیر</span><b>' + fa(left) + "</b></div>"
          : qq && qcRejOpen(qq) ? '<div class="qrow"><span class="pill warn">منتظر تعیین تکلیف مردودی</span><b>' + fa(qh) + "</b></div>"
          : '<div class="qrow"><span class="pill ok">کامل</span><b>' + fa(ln.qty) + "</b></div>") +
        "</div>";
    }).join("");
    const tot = sum(r.lines.map(lineOutTotal));
    return '<div class="col fixed" data-col="done"><div class="col-head"><div><b>' + S.name + "</b><small>" + S.hint + '</small></div><span class="cnt">' + fa(tot) + "</span></div>" +
      (cards || '<div class="col-empty">هنوز آیتمی تعیین وضعیت نشده است.</div>') + "</div>";
  }

  const lines = r.lines.filter((ln) => stageQty(ln.st[s]) > 0);
  const total = sum(lines.map((ln) => stageQty(ln.st[s])));
  /* return / scrap / cancel are real buttons, grouped under a label, so they read as choices and not as footnotes */
  const dBtn = (ln, from, k, t) => '<button class="btn sm ghost" type="button" data-act="m-dispose" data-f="' + from + '" data-k="' + k + '" data-l="' + ln.id + '" data-s="' + s + '">' + (t || OUT_NAME[k]) + "</button>";
  const dispose = (ln, from, lbl) => '<div class="rx-acts">' + (lbl ? "<span>" + lbl + "</span>" : "") + ["ret", "scrap", "cancel"].map((k) => dBtn(ln, from, k)).join("") + "</div>";
  const moveBtn = (ln) => '<button class="btn sm ghost" type="button" data-act="m-move" data-l="' + ln.id + '" data-s="' + s + '">' + ico("move", "sm") + "جابجایی بین مراحل</button>";
  const dragAttr = (ln) => ' draggable="true" data-drag="' + ln.id + "|" + s + '" title="برای جابجایی بین مراحل بکشید"';
  const grip = '<span class="grip" aria-hidden="true">' + ico("grip", "sm") + "</span>";
  /* an item split into several units: one card, one draggable block per unit */
  const cards = [...new Set(lines.map(grpOf))].map((g) => {
    const fam = grpLines(r, g);
    if (fam.length === 1) return unitCard(fam[0]);
    const here = lines.filter((ln) => grpOf(ln) === g);
    return '<div class="card ucard"><div class="card-t"><b>' + esc(fam[0].item) + '</b><span class="code">' + fam[0].sku + "</span> · <span>" + fa(fam.length) + " واحد</span></div>" +
      here.map((ln) => unitCard(ln, true)).join("") + "</div>";
  }).join("");
  function unitCard(ln, sub) {
    const x = ln.st[s];
    const canDrag = live && (x.pending > 0 || x.held > 0 || x.rej > 0);
    let h = sub
      ? '<div class="ublock' + (canDrag ? " drag" : "") + '"' + (canDrag ? dragAttr(ln) : "") + '><div class="ub-h"><span class="uchip">' + esc(ln.unit) + "</span><b>" + fa(stageQty(x)) + "</b>" + (canDrag ? grip : "") + "</div>"
      : '<div class="card' + (canDrag ? " drag" : "") + '"' + (canDrag ? dragAttr(ln) : "") + ">" +
        '<div class="card-t">' + (canDrag ? grip : "") + "<b>" + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>";
    if (x.held > 0) {
      h += '<div class="task held"><div class="task-top"><span>مغایرت PDA · ' + fa(x.held) + '</span><span class="pill warn">نیاز به تعیین تکلیف</span></div>' +
        '<div class="muted">' + x.why.map(esc).join("<br>") + "</div>";
      if (live) h += '<div class="btns"><button class="btn sm primary" type="button" data-act="requeue" data-l="' + ln.id + '" data-s="' + s + '">ارسال مجدد به PDA</button></div>' + dispose(ln, "held", "یا تعیین تکلیف:");
      h += "</div>";
    }
    if (x.rej > 0) {
      h += '<div class="task rej"><div class="task-top"><span>مردود کنترل کیفی · ' + fa(x.rej) + '</span><span class="pill bad">جایگذاری متوقف شد</span></div>' +
        '<div class="muted">این مقدار نباید جایگذاری شود. برگشت به تدارکات یا ضایعات آن را ثبت کنید.</div>';
      if (live || r.qc) h += '<div class="rx-acts">' + dBtn(ln, "rej", "ret", "برگشت به تدارکات") + dBtn(ln, "rej", "scrap") + "</div>";
      h += "</div>";
    }
    if (x.pending > 0) h += '<div class="qrow"><span>در انتظار ارسال به PDA</span><b>' + fa(x.pending) + "</b></div>";
    openTasks(x).forEach((t) => {
      h += '<div class="task"><div class="task-top"><span>' + esc(t.person) + " · " + fa(t.qty) + '</span><span class="pill info">در PDA انباردار</span></div>';
      if (live) {
        h += '<div class="btns"><button class="btn sm demo" type="button" data-act="m-pda" data-l="' + ln.id + '" data-s="' + s + '" data-t="' + t.id + '">' + ico("pda", "sm") + "ثبت پاسخ PDA</button>" +
          '<button class="btn sm ghost" type="button" data-act="m-cancel-task" data-l="' + ln.id + '" data-s="' + s + '" data-t="' + t.id + '">لغو تسک</button></div>';
      }
      h += "</div>";
    });
    if (live && x.pending > 0) {
      /* one clear next step; everything else is one tap away under «سایر اقدام‌ها» */
      h += '<div class="btns"><button class="btn sm primary" type="button" data-act="m-assign" data-l="' + ln.id + '" data-s="' + s + '">' + ico("pda", "sm") + "ارسال به PDA</button></div>" +
        '<details class="rx-menu"><summary>' + ico("left", "sm") + 'سایر اقدام‌ها</summary><div class="rx-acts">' +
          (canSplit(r, ln, s) ? '<button class="btn sm ghost" type="button" data-act="m-split" data-l="' + ln.id + '" data-s="' + s + '">' + ico("split", "sm") + "تقسیم واحد</button>" : "") +
          ["ret", "scrap", "cancel"].map((k) => dBtn(ln, "pending", k)).join("") + moveBtn(ln) + "</div></details>";
    } else if (canDrag) h += '<div class="rx-acts">' + moveBtn(ln) + "</div>";
    return h + "</div>";
  }
  const pend = live ? r.lines.filter((ln) => ln.st[s].pending > 0).length : 0;

  return '<div class="col" data-col="' + s + '"><div class="col-head"><div><b>' + S.name + "</b><small>" + S.hint + "</small></div>" +
    '<span class="cnt">' + fa(total) + "</span></div>" +
    (pend > 1 ? '<button class="btn sm rx-colbtn" type="button" data-act="m-assign-all" data-s="' + s + '">' + ico("pda", "sm") + "ارسال همهٔ " + fa(pend) + " قلم به PDA</button>" : "") +
    (cards || '<div class="col-empty">آیتمی در این مرحله نیست.</div>') + "</div>";
}

/* ================= view: deliveries (تحویل کالا) ================= */
let gStockCache = null;
const gStock = () => gStockCache || (gStockCache = stockItems(movementList(), Date.now()));
/* free stock of an item in each cell: on hand minus QC hold, minus quantity already picked for an open
   delivery but not handed over yet (it still sits in the cell) */
function gLocFree(whId, sku, unit, exceptTid) {
  const it = gStock().find((x) => x.whId === whId && x.sku === sku && x.unit === unit), busy = {};
  state.deliveries.forEach((d) => {
    if (d.whId !== whId || d.cancelled) return;
    d.lines.forEach((l) => {
      if (l.sku !== sku || l.unit !== unit) return;
      l.st.deliver.lots.forEach((x) => { if (!x.ded) busy[x.loc] = (busy[x.loc] || 0) + x.qty; });
      l.st.pick.tasks.forEach((t) => { if (t.status === "ready" && t.id !== exceptTid) t.picks.forEach((p) => { busy[p.loc] = (busy[p.loc] || 0) + p.qty; }); });
    });
  });
  return (it ? it.locs : []).filter((x) => !isQ(x.loc)).map((x) => ({ loc: x.loc, qty: Math.max(0, x.qty - (x.qc || 0) - (x.cnt || 0) - (busy[x.loc] || 0)) }))
    .filter((x) => x.qty > 0).sort((a, b) => b.qty - a.qty);
}
const gFree = (whId, sku, unit) => sum(gLocFree(whId, sku, unit).map((x) => x.qty));
const gCur = () => state.deliveries.find((x) => x.id === ui.g.openId);
const gPill = (d) => { const s = D_STATUS[dStatus(d)]; return '<span class="pill ' + s.cls + '">' + s.name + "</span>"; };
const G_STOCK = { ok: ["موجود", "ok"], low: ["کمتر از میزان درخواست", "warn"], out: ["ناموجود", "bad"] };
function gStockState(d, ln, need) {
  need = need != null ? need : ln.st.draft.pending + ln.st.pick.pending + sum(dTasks(ln, "open").map((t) => t.qty));
  const free = gFree(d.whId, ln.sku, ln.unit);
  return { need, free, k: free <= 0 ? "out" : free < need ? "low" : "ok" };
}
const gStockPill = (s) => '<span class="pill ' + G_STOCK[s.k][1] + '">' + G_STOCK[s.k][0] + "</span>";
function gStockRow(d, ln) {
  const s = gStockState(d, ln);
  return '<div class="g-stock"><span>موجودی آزاد انبار <b>' + fa(s.free) + "</b> " + esc(ln.unit) + "</span>" + gStockPill(s) +
    '<button class="linkbtn" type="button" data-act="g-stock" data-l="' + ln.id + '">سایر انبارها</button></div>';
}
function gLocList(L) {
  const m = {};
  L.forEach((p) => { m[p.loc] = (m[p.loc] || 0) + p.qty; });
  return '<ul class="g-locs">' + Object.entries(m).map(([l, q]) => '<li><span class="code" dir="ltr">' + esc(l) + "</span><b>" + fa(q) + "</b></li>").join("") + "</ul>";
}
const gSideTags = (d) => ["purchase", "expert"].map((k) => { const n = d.lines.filter((l) => dSideOpen(l, k)).length; return n ? '<span class="sub ' + (k === "purchase" ? "t-warn" : "t-info") + '">' + fa(n) + " سطر " + D_SIDE[k].name + "</span>" : ""; }).join("");

function renderDeliveries() {
  if (isTankWh(whById(+ui.g.wh))) return tkDelWhView();
  const f = ui.g, q = f.q.trim().toLowerCase();
  const all = state.deliveries.slice().sort((x, y) => y.createdAt - x.createdAt);
  const inWh = all.filter((d) => (f.wh === "all" || d.whId === +f.wh) && (f.src === "all" || d.source === f.src));
  const list = inWh.filter((d) => (f.tab === "all" || (f.tab === "active" ? dActive(d) : !dActive(d))) &&
    (!q || (d.no + " " + d.ref + " " + d.requester + " " + d.useLoc + " " + d.lines.map((l) => l.item + " " + l.sku).join(" ")).toLowerCase().includes(q)));
  const cnt = (st) => inWh.filter((d) => dStatus(d) === st).length;
  const wh = f.wh !== "all" ? whById(+f.wh) : null;
  const srcs = [...new Set(state.deliveries.map((d) => d.source).concat(MANUAL_DEL))];
  const shown = list.slice(0, f.limit);

const gEmpty = (f) => "حواله‌ای با این فیلترها پیدا نشد." + (f.tab === "active" ? ' <button class="linkbtn" type="button" data-act="g-tab" data-v="all">نمایش همه</button>' : "");
const gItems = (d) => { const L = d.lines.filter((l) => !l.grp); return esc(L[0].item) + (L.length > 1 ? '<span class="sub">و ' + fa(L.length - 1) + " قلم دیگر</span>" : '<span class="sub">' + fa(L[0].doc) + " " + esc(L[0].unit) + "</span>"); };
function gTable(list, f) {
  return '<div class="table-wrap"><table><thead><tr><th>شمارهٔ حواله</th><th>تاریخ حواله</th><th>منبع / سند مرجع</th><th>انبار</th><th>درخواست‌کننده / محل مصرف</th><th>اقلام</th><th>پیشرفت</th><th>وضعیت</th><th>مسئول حواله</th></tr></thead><tbody>' +
    (list.length ? list.map((d) => {
      const w = whById(d.whId), p = dProgress(d), pct = p.total ? Math.round(p.done * 100 / p.total) : 0;
      return '<tr data-gid="' + d.id + '" tabindex="0">' +
        '<td><span class="code">' + d.no + "</span></td>" +
        '<td class="num">' + faDate(d.createdAt) + "</td>" +

        "<td>" + esc(w.name) + '<span class="sub">' + esc(w.site) + "</span></td>" +
        "<td>" + esc(d.requester) + '<span class="sub">' + esc(d.useLoc || "—") + "</span></td>" +
        "<td>" + gItems(d) + "</td>" +
        '<td><div class="prog"><div class="bar"><i style="width:' + pct + '%"></i></div>' + fa(p.done) + " از " + fa(p.total) + "</div></td>" +
        "<td>" + gPill(d) + gSideTags(d) + "</td>" +
        "<td>" + d.owners.map(esc).join("، ") + "</td></tr>";

function gCards(list, f) {
  if (!list.length) return '<div class="box empty">' + ico("truck") + gEmpty(f) + "</div>";
  return '<div class="rcards">' + list.map((d) => {
    const w = whById(d.whId), p = dProgress(d), pct = p.total ? Math.round(p.done * 100 / p.total) : 0, st = dStatus(d);
    const stages = D_KEYS.map((s) => {
      const q = sum(d.lines.map((l) => dStageQty(l, s)));
      return '<span class="rc-stage' + (q ? " on" : "") + '" title="' + DSTAGE[s].name + ": " + fa(q) + '">' + DSTAGE[s].name + (q ? "<b>" + fa(q) + "</b>" : "") + "</span>";
    }).join('<i class="rc-ar">←</i>');
    const ready = sum(d.lines.map((l) => dTasks(l, "ready").length));
    return '<article class="rcard s-' + st + '" data-gid="' + d.id + '" tabindex="0" role="button" aria-label="حوالهٔ تحویل ' + d.no + '">' +
      '<header><div><span class="code">' + d.no + "</span><small>" + faDate(d.createdAt) + " · " + faTime(d.createdAt) + "</small></div>" + gPill(d) + "</header>" +
      '<div class="rc-main"><b>' + esc(d.requester) + (d.useLoc ? " · " + esc(d.useLoc) : "") + "</b><span>" + esc(d.source) + (d.ref ? ' · <span class="code">' + esc(d.ref) + "</span>" : "") + "</span></div>" +
      '<div class="rc-wh">' + ico("wh", "sm") + "<span>" + esc(w.name) + "</span><small>" + esc(w.site) + "</small></div>" +
      '<div class="rc-stages">' + stages + "</div>" +
      (ready ? '<div class="rc-held">' + ico("alert", "sm") + fa(ready) + " برداشت آمادهٔ بررسی</div>" : "") +
      (gSideTags(d) ? '<div class="side-tags">' + gSideTags(d) + "</div>" : "") +
      '<div class="rc-prog"><div class="bar"><i style="width:' + pct + '%"></i></div><span>' + fa(pct) + "٪ · " + fa(p.done) + " از " + fa(p.total) + "</span></div>" +
      '<footer><div class="rc-owners">' + d.owners.map((o) => '<span class="avatar" title="' + esc(o) + '">' + esc(o.trim().charAt(0)) + "</span>").join("") +
        "<small>" + d.owners.map(esc).join("، ") + "</small></div>" + ico("left", "sm") + "</footer></article>";
  }).join("") + "</div>";
}

/* ---------- delivery detail ---------- */
function renderDelivery() {
  const d = gCur();
  if (!d) { ui.g.openId = null; renderDeliveries(); return; }
  const w = whById(d.whId), live = !d.cancelled, p = dProgress(d);
  const kv = (k, v) => '<div class="kv"><span>' + k + "</span><b>" + (v || "—") + "</b></div>";
  const inStage = (s) => sum(d.lines.map((l) => dStageQty(l, s)));
  const steps = D_FLOW.map((s, i) => {
    if (s === "done") {
      const ok = p.total && p.done === p.total && dStatus(d) === "done";
      return '<li class="' + (ok ? "clear" : "") + '"><span class="dot">' + (ok ? ico("check", "sm") : fa(i + 1)) + "</span><b>" + DSTAGE[s].name + "</b><small>" + fa(p.done) + " از " + fa(p.total) + "</small></li>";
    }
    const q = inStage(s), ready = s === "pick" ? sum(d.lines.map((l) => dTasks(l, "ready").length)) : 0;
    const fz = d.lines.some((l) => dFrozen(l) && dStageQty(l, s) > 0);
    const waiting = D_KEYS.slice(0, i).some((x) => inStage(x) > 0);
    const cls = ready || fz ? "held" : q ? "cur" : waiting || d.cancelled ? "" : "clear";
    return '<li class="' + cls + '"><span class="dot">' + (cls === "clear" ? ico("check", "sm") : cls === "held" ? "!" : fa(i + 1)) + "</span><b>" + DSTAGE[s].name + "</b><small>" +
      (q ? fa(q) + " در این مرحله" + (ready ? " · " + fa(ready) + " برداشت آمادهٔ بررسی" : "") : "خالی") + "</small></li>";
  }).join("");
  $("#view").innerHTML =
    '<div class="view-stack">' +
    '<div class="head"><div><div class="crumbs"><button class="linkbtn" type="button" data-act="g-back">' + ico("right", "sm") + "تحویل کالا</button> " + ico("left", "sm") + ' <span class="code">' + d.no + "</span></div>" +
      '<h1>حوالهٔ تحویل <span class="code">' + d.no + "</span> " + gPill(d) + "</h1>" +
      "<p>" + esc(w.name) + " · " + esc(w.site) + " · " + fa(p.done) + " از " + fa(p.total) + " واحد تعیین وضعیت شده</p></div>" +
      '<div class="head-actions">' +
        (canCancelDoc(d) ? '<button class="btn danger" type="button" data-act="g-cancel">لغو حواله</button>' : "") +
        (d.cancelled && d.snap ? '<button class="btn" type="button" data-act="g-restore">' + ico("reset", "sm") + "بازگرداندن لغو</button>" : "") +
      "</div></div>" +
    (d.cancelled ? '<div class="notice bad"><strong>این حواله لغو شده است.</strong>دلیل: ' + esc(d.cancelReason) + (d.snap ? ". با «بازگرداندن لغو» آیتم‌ها به همان مراحل و تسک‌های قبل از لغو برمی‌گردند." : "") + "</div>" : "") +
    '<div class="box"><div class="info-grid">' +
      kv("منبع درخواست", esc(d.source)) + kv("شمارهٔ درخواست (سند مرجع)", d.ref ? '<span class="code">' + esc(d.ref) + "</span>" : "") +
      kv("تاریخ حواله", faDate(d.createdAt) + " · " + faTime(d.createdAt)) + kv("ایجادشده توسط", esc(d.createdBy)) +
      kv("انبار", esc(w.name) + " · " + esc(w.site)) + kv("مسئول حواله", d.owners.map(esc).join("، ")) +
      kv("نام درخواست‌کننده", esc(d.requester)) + kv("محل مصرف", esc(d.useLoc)) +
      (d.source === "درخواست کالا" ? kv("کارشناس تأیید درخواست", esc(d.approver)) : "") +
      (d.desc ? '<div class="kv" style="grid-column:1/-1"><span>توضیحات</span><b>' + esc(d.desc) + "</b></div>" : "") +
    "</div></div>" +
    '<ol class="stepper" aria-label="پیشرفت مراحل حواله">' + steps + "</ol>" +
    (live && dStatus(d) !== "done" ? '<div class="notice demo"><strong>حالت نمایشی</strong>دکمه‌های بنفش نقش اپلیکیشن PDA انباردار، سیستم خرید و کارشناس درخواست را بازی می‌کنند. پاسخ PDA مستقیم جلو نمی‌رود: مسئول حواله با «بررسی و ارسال» آن را تأیید می‌کند. موجودی فقط با «تأیید تحویل» از مکان برداشت کسر می‌شود.</div>' : "") +
    '<div class="board" aria-label="مراحل حواله">' + D_FLOW.map((s) => gColumn(d, s, live)).join("") + "</div>" +

    '<div class="box"><p class="section-title">رویدادهای حواله</p><ul class="log">' +
      d.log.map((l) => '<li><time datetime="' + l.at + '">' + faDate(l.at) + "<br>" + faTime(l.at) + "</time><div>" + esc(l.text) + '<div class="who">' + esc(l.who) + "</div></div></li>").join("") +
    "</ul></div></div>";
}

function gColumn(d, s, live) {
  const S = DSTAGE[s];
  if (s === "done") {
    const touched = (l) => l.out.delivered.length || l.out.cancel.length || dSettled(l);
    const groups = [...new Set(d.lines.map(grpOf))].filter((g) => d.lines.some((l) => grpOf(l) === g && touched(l)));
    const tot = sum(d.lines.map((l) => dOutQ(l, "delivered") + dOutQ(l, "cancel") + dSettled(l)));
    return '<div class="col fixed" data-col="done"><div class="col-head"><div><b>' + S.name + "</b><small>تحویل‌شده یا لغو تحویل</small></div><span class=\"cnt\">" + fa(tot) + "</span></div>" +
      (groups.map((g) => gDoneCard(d, g)).join("") || '<div class="col-empty">هنوز آیتمی تعیین وضعیت نشده است.</div>') + "</div>";
  }
  const lines = d.lines.filter((ln) => dStageQty(ln, s) > 0);
  const cards = [...new Set(lines.map(grpOf))].map((g) => {
    const fam = d.lines.filter((l) => grpOf(l) === g);
    if (fam.length === 1) return gBlock(d, fam[0], s, live);
    return '<div class="card ucard"><div class="card-t"><b>' + esc(fam[0].item) + '</b><span class="code">' + fam[0].sku + "</span> · <span>" + fa(fam.length) + " واحد</span></div>" +
      lines.filter((l) => grpOf(l) === g).map((l) => gBlock(d, l, s, live, true)).join("") + "</div>";
  }).join("");
  return '<div class="col" data-col="' + s + '"><div class="col-head"><div><b>' + S.name + "</b><small>" + S.hint + '</small></div><span class="cnt">' + fa(sum(lines.map((l) => dStageQty(l, s)))) + "</span></div>" +
    (cards || '<div class="col-empty">آیتمی در این مرحله نیست.</div>') + "</div>";
}

/* one item (or one unit of a split item) in a stage column; sub = a unit block inside a multi-unit card */
function gBlock(d, ln, s, live, sub) {
  const q = dStageQty(ln, s), fz = dFrozen(ln), act = live && !fz;
  const da = ' data-l="' + ln.id + '" data-s="' + s + '"';
  const btn = (a, t, cls, x) => '<button class="btn sm' + (cls ? " " + cls : "") + '" type="button" data-act="' + a + '"' + da + (x || "") + ">" + t + "</button>";
  const lk = (a, t, k) => '<button class="linkbtn" type="button" data-act="' + a + '"' + (k ? ' data-k="' + k + '"' : "") + da + ">" + t + "</button>";
  const hands = (s === "deliver" ? [] : [["purchase", "ارسال به خرید"]].concat(dIsManual(d) ? [] : [["expert", "برگشت به کارشناس"]])).concat([["cancel", "لغو تحویل"]]);
  const mini = (extra) => '<div class="mini-acts">' + hands.map(([k, t]) => lk("g-hand", t, k)).join("") + (extra || "") + "</div>";
  const split = canGSplit(d, ln, s) ? btn("g-split", ico("split", "sm") + "تقسیم واحد") : "";
  let h = sub ? '<div class="ublock"><div class="ub-h"><span class="uchip">' + esc(ln.unit) + "</span><b>" + fa(q) + "</b></div>"
    : '<div class="card"><div class="card-t"><b>' + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>";
  if (fz) h += '<div class="task held"><div class="task-top"><span>برگشت به کارشناس · ' + fa(dSideOpen(ln, "expert")) + '</span><span class="pill warn">قفل تا پاسخ کارشناس</span></div>' +
    '<div class="muted">تا تصمیم کارشناس دربارهٔ این آیتم، هیچ اقدامی روی آن ممکن نیست.</div></div>';
  if (s === "draft") {
    if (!sub) h += '<div class="qrow"><span>مقدار درخواست در این مرحله</span><b>' + fa(q) + "</b></div>";
    h += gStockRow(d, ln);
    if (act) h += '<div class="btns">' + btn("g-send", "ارسال به برداشت", "primary") + split + "</div>" +
      mini(canGEdit(d, ln) ? lk("g-edit", "ویرایش مقدار") + (canGDel(d, ln) ? lk("g-del", "حذف آیتم") : "") : "");
  }
  if (s === "pick") {
    const x = ln.st.pick;
    if (x.pending) h += '<div class="qrow"><span>در انتظار ارسال به PDA</span><b>' + fa(x.pending) + "</b></div>";
    dTasks(ln, "open").forEach((t) => {
      h += '<div class="task"><div class="task-top"><span>' + esc(t.person) + " · " + fa(t.qty) + '</span><span class="pill info">در PDA انباردار</span></div>' + (t.note ? '<div class="muted">' + esc(t.note) + "</div>" : "");
      if (act) h += '<div class="btns">' + btn("g-pda", ico("pda", "sm") + "ثبت پاسخ PDA", "demo", ' data-t="' + t.id + '"') + btn("g-ctask", "لغو تسک", "ghost", ' data-t="' + t.id + '"') + "</div>";
      h += "</div>";
    });
    dTasks(ln, "ready").forEach((t) => {
      const got = sum(t.picks.map((p) => p.qty)), short = t.qty - got;
      h += '<div class="task ready"><div class="task-top"><span>' + esc(t.person) + " · برداشت " + fa(got) + " از " + fa(t.qty) + '</span><span class="pill warn">آمادهٔ بررسی</span></div>' +
        (t.picks.length ? gLocList(t.picks) : "") +
        (short ? '<div class="g-short">' + ico("alert", "sm") + fa(short) + " برداشت نشد · نیاز به تعیین تکلیف</div>" : "") +
        (t.pdaNote ? '<div class="muted">توضیح انباردار: ' + esc(t.pdaNote) + "</div>" : "");
      if (act) h += '<div class="btns">' + btn("g-review", "بررسی و ارسال", "primary", ' data-t="' + t.id + '"') + "</div>";
      h += "</div>";
    });
    if (act && x.pending) h += '<div class="btns">' + btn("g-assign", "ارسال به PDA", "primary") + split + "</div>" + mini();
  }
  if (s === "deliver") {
    h += '<div class="qrow"><span>برداشت‌شده · آمادهٔ تحویل</span><b>' + fa(dLots(ln)) + "</b></div>" + gLocList(ln.st.deliver.lots) +
      '<div class="qrow muted"><span>درخواست‌کننده</span><span>' + esc(d.requester) + "</span></div>";
    if (act) h += '<div class="btns">' + btn("g-deliver", ico("check", "sm") + "تأیید تحویل", "primary") + "</div>" + mini();
  }
  return h + "</div>";
}

/* "done" card: delivered (to whom, from which cells) and cancelled (why); a split item shows a unit × outcome matrix */
function gDoneCard(d, g) {
  const fam = d.lines.filter((l) => grpOf(l) === g && (l.qty > 0 || l.out.delivered.length || l.out.cancel.length)), root = d.lines.find((l) => l.id === g) || fam[0];
  const uniq = (a) => [...new Set(a)].join("، ");
  const det = (ln, mu) => ln.out.delivered.map((o) => "<li>" + ico("check", "sm") + "<span>" + (mu ? "<b>" + esc(ln.unit) + ":</b> " : "") + fa(o.qty) + " به " + esc(o.to) +
    " · از " + uniq(o.locs.map((p) => '<span class="code" dir="ltr">' + esc(p.loc) + "</span>")) + "<small>" + faDate(o.at) + " · " + faTime(o.at) + "</small></span></li>").join("");
  if (fam.length === 1) {
    const ln = fam[0], rows = [], left = dLineIn(ln) + dSideOpen(ln);
    if (dOutQ(ln, "delivered")) rows.push('<div class="o-put"><span>تحویل‌شده <span class="muted">(' + esc(uniq(ln.out.delivered.map((o) => o.to))) + ")</span></span><b>" + fa(dOutQ(ln, "delivered")) + "</b></div>");
    if (dOutQ(ln, "cancel")) rows.push('<div class="o-cancel"><span>لغو تحویل <span class="muted">(' + esc(uniq(ln.out.cancel.map((o) => o.reason))) + ")</span></span><b>" + fa(dOutQ(ln, "cancel")) + "</b></div>");
    ["purchase", "expert"].forEach((k) => { const n = dSettled(ln, k); if (n) rows.push('<div class="o-side"><span>' + D_SIDE[k].act + ' <span class="muted">(بسته‌شده)</span></span><b>' + fa(n) + "</b></div>"); });
    return '<div class="card"><div class="card-t"><b>' + esc(ln.item) + '</b><span class="code">' + ln.sku + "</span> · <span>" + esc(ln.unit) + "</span></div>" +
      '<div class="outs">' + rows.join("") + "</div>" + (ln.out.delivered.length ? '<ul class="g-det">' + det(ln) + "</ul>" : "") +

    '</tbody><tfoot><tr><th scope="row">جمع</th>' + fam.map((ln) => "<td>" + fa(ln.qty) + "</td>").join("") + "</tr></tfoot></table></div>" +
    (fam.some((l) => l.out.delivered.length) ? '<ul class="g-det">' + fam.map((ln) => det(ln, true)).join("") + "</ul>" : "") +

/* keep what was typed before a dialog re-renders */
function gReadForm() {
  const m = ui.modal, v = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
  if (!m) return;
  if (v("m-q") != null) m.qv = v("m-q");

  if (v("g-rn") != null) m.rn = v("g-rn");

  if (v("g-to") != null) m.to = v("g-to");

  if (v("g-pn") != null) m.pn = v("g-pn");
  if (m.kind === "g-pda") m.rows = m.rows.map((r, i) => ({ loc: v("g-loc-" + i), qty: v("g-pq-" + i) }));

}

function gModalOk(m) {
  const bad = (msg) => { m.err = msg; renderModal(); };
  if (m.kind === "g-new") return gNewOk(m);
  gReadForm();
  const d = gCur(), ln = m.l ? d.lines.find((l) => l.id === m.l) : null;
  const q = toNum(m.qv), x = m.x ? ln.side.find((y) => y.id === m.x) : null;
  const qBad = (max) => (!(q > 0) || !Number.isInteger(q) ? "مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد." : q > max ? "مقدار نمی‌تواند بیشتر از " + fa(max) + " " + ln.unit + " باشد." : "");
  let msg = "", e = "";
  if (m.kind === "g-send") { if ((e = qBad(ln.st.draft.pending))) return bad(e); gOps.send(d, ln, q); msg = fa(q) + " " + ln.unit + " به مرحلهٔ «برداشت» رفت."; }
  if (m.kind === "g-assign") { if ((e = qBad(ln.st.pick.pending))) return bad(e); const p = $("#m-p").value; gOps.assign(d, ln, q, p, $("#m-n").value.trim()); msg = "تسک برداشت به PDA " + p + " ارسال شد."; }
  if (m.kind === "g-ctask") { gOps.cancelTask(d, ln, m.t); msg = "تسک برداشت لغو شد."; }
  if (m.kind === "g-pda") {
    const t = ln.st.pick.tasks.find((y) => y.id === m.t), free = gLocFree(d.whId, ln.sku, ln.unit, t.id), picks = [];
    for (const r of m.rows) {
      const n = toNum(r.qty);
      if (!(n >= 0) || !Number.isInteger(n)) return bad("تعداد برداشت‌شده باید عدد صحیح باشد.");
      if (!n) continue;
      const have = (free.find((y) => y.loc === r.loc) || { qty: 0 }).qty, prev = picks.find((p) => p.loc === r.loc);
      if ((prev ? prev.qty : 0) + n > have) return bad(have ? "موجودی مکان " + r.loc + " کمتر از مقدار برداشت‌شده است (موجودی آزاد: " + fa(have) + ")." : "در مکان " + r.loc + " موجودی از این کالا وجود ندارد.");
      if (prev) prev.qty += n; else picks.push({ loc: r.loc, qty: n });
    }
    const got = sum(picks.map((p) => p.qty));
    if (!got) return bad("حداقل یک برداشت با تعداد بیشتر از صفر ثبت کنید.");
    if (got > t.qty) return bad("تعداد کالای برداشت‌شده بیشتر از تعداد مشخص‌شده است (" + fa(t.qty) + ").");
    gOps.pda(d, ln, m.t, picks, m.pn);
    msg = "نتیجهٔ برداشت ثبت شد و منتظر «بررسی و ارسال» است" + (got < t.qty ? "؛ " + fa(t.qty - got) + " برداشت نشد." : ".");
  }
  if (m.kind === "g-review") {
    const t = ln.st.pick.tasks.find((y) => y.id === m.t), short = t.qty - sum(t.picks.map((p) => p.qty));
    if (short > 0 && !m.rest) return bad("ابتدا تکلیف مقدار برداشت‌نشده را مشخص کنید.");
    if (short > 0 && ["purchase", "expert"].includes(m.rest) && !(m.rn || "").trim()) return bad("توضیحات را وارد کنید.");
    const acc = sum(t.picks.filter((p, i) => m.ok[i]).map((p) => p.qty));
    gOps.review(d, ln, m.t, m.ok, short > 0 ? { kind: m.rest, note: m.rest === "cancel" ? m.rr : (m.rn || "").trim() } : null);
    msg = fa(acc) + " " + ln.unit + " به مرحلهٔ «تحویل» رفت.";
  }
  if (m.kind === "g-hand") {
    const max = m.s === "draft" ? ln.st.draft.pending : m.s === "pick" ? ln.st.pick.pending : dLots(ln);
    if ((e = qBad(max))) return bad(e);
    const n = m.k === "cancel" ? m.rr : (m.rn || "").trim();
    if (!n) return bad("توضیحات را وارد کنید.");
    gOps.hand(d, ln, m.s, m.k, q, n);
    msg = fa(q) + " " + ln.unit + " " + D_ROUTE_TXT[m.k] + ".";
  }
  if (m.kind === "g-deliver") { if ((e = qBad(dLots(ln)))) return bad(e); gOps.deliver(d, ln, q, m.to); msg = fa(q) + " " + ln.unit + " به " + m.to + " تحویل و از موجودی کسر شد."; }
  if (m.kind === "g-split") {
    m.to = $("#m-unit").value;
    if ((e = qBad(ln.st[m.s].pending))) return bad(e);
    const o = gOps.split(d, ln, m.s, q, m.to);
    msg = fa(q) + " " + ln.unit + " به " + fa(o.n) + " " + m.to + " تقسیم شد.";
  }
  if (m.kind === "g-edit") { if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد."); gOps.edit(d, ln, q); msg = "مقدار " + ln.item + " ویرایش شد."; }
  if (m.kind === "g-del") { gOps.del(d, ln); msg = ln.item + " از حواله حذف شد."; }
  if (m.kind === "g-cancel") { gOps.cancelDoc(d, m.rr); msg = "حوالهٔ " + d.no + " لغو شد."; }
  if (m.kind === "g-restore") { gOps.restore(d); msg = "لغو حوالهٔ " + d.no + " برگشت داده شد."; }
  if (m.kind === "g-buy") { gOps.supplied(d, ln, m.x); msg = fa(x.qty) + " " + ln.unit + " تأمین شد و به «" + DSTAGE[x.stage].name + "» برگشت."; }
  if (m.kind === "g-side-cancel") { gOps.sideCancel(d, ln, m.x, m.rr); msg = fa(x.qty) + " " + ln.unit + " لغو تحویل شد."; }
  if (m.kind === "g-expert") {
    const keep = m.ans === "rej" ? 0 : q;
    if (m.ans === "ok" && (!(q > 0) || !Number.isInteger(q) || q > x.qty)) return bad("مقدار تأییدشده باید عددی صحیح بین ۱ و " + fa(x.qty) + " باشد.");
    gOps.answer(d, ln, m.x, keep, d.approver || "کارشناس درخواست");
    msg = keep ? "پاسخ کارشناس ثبت شد و قفل کارت باز شد." : "سطر توسط کارشناس رد و لغو تحویل شد.";
  }
  save(); ui.modal = null; render();
  if (msg) toast(msg);
}

/* a target is busy while an open count covers it, of either kind: a location holding an item under an item count, or an item in a location under a location count */
function kBusy(whId, kind, target, held, stock) {
  if (kind === "loc") return held.has(whId + "|L|" + target) || stock.some((it) => it.whId === whId && held.has(whId + "|I|" + it.sku) && it.locs.some((x) => x.loc === target && x.qty > 0));
  return held.has(whId + "|I|" + target) || stock.some((it) => it.whId === whId && it.sku === target && it.locs.some((x) => x.qty > 0 && held.has(whId + "|L|" + x.loc)));
}

function kModalOk(m, b) {

    kOps.recount(s, e, m.who, (m.rn || "").trim()); msg = "تسک شمارش دوباره به PDA " + m.who.join("، ") + " ارسال شد.";
  }
  if (m.kind === "k-add") { kOps.addCounter(s, e, m.p, (m.rn || "").trim()); msg = m.p + " به شمارشگرها اضافه شد و تسک به PDA او رفت."; }
  if (m.kind === "k-ecancel") { kOps.cancelEntry(s, e, m.rr); msg = "شمارش " + kName(s, e) + " لغو شد."; }
  if (m.kind === "k-cancel") { kOps.cancelSession(s, m.rr); msg = "انبارگردانی " + s.no + " لغو شد."; }
  if (m.kind === "k-fin") {
    const act = b && b.dataset.v, n = (m.fn || "").trim();
    if (act !== "ok" && !n) return bad("برای " + (act === "back" ? "برگشت" : "لغو") + " توضیحات مالی را وارد کنید.");

  }
  save(); ui.modal = null; render();
  if (msg) toast(msg);
}

function openKNew(kind) { openModal({ kind: "k-new", form: { title: "", kind, whId: ui.k.wh, crew: {}, sel: [], panel: false, who: [] } }); }
function kTree(whId) {
  const cells = (state.locs[whId] || []).filter((l) => !isQ(l.code)).map((l) => l.code), out = [];
  [...new Set(cells.map((c) => c.split("/")[0]))].forEach((z) => {
    const zc = cells.filter((c) => c.split("/")[0] === z);
    out.push({ lv: 0, code: z, name: "زون " + z, cells: zc });
    [...new Set(zc.map((c) => c.split("/").slice(0, 2).join("/")))].forEach((r) => {
      const rc = zc.filter((c) => c.startsWith(r + "/"));
      out.push({ lv: 1, code: r, name: "قفسهٔ " + r, cells: rc });
      rc.forEach((c) => out.push({ lv: 2, code: c, name: c, cells: [c] }));

  });

}

/* attachments of a QC task: certificates, test reports and photos. Added any time unless cancelled;
   removable only until the result is recorded, so the evidence behind a result stays with it */
function qcFilesBox(q, st) {
  const files = q.files || [], canAdd = st !== "cancel" && files.length < QC_FILE_COUNT, canDel = !q.result;
  const rows = files.map((f) => {
    const data = getFile(f.id), img = /^image\//.test(f.type) && data;
    return '<li class="qc-file">' +
      (img ? '<img src="' + data + '" alt="">' : '<span class="fi">' + ico(/pdf/.test(f.type) ? "report" : "attach") + "</span>") +
      '<div><b>' + (data ? '<a href="' + data + '" download="' + esc(f.name) + '" target="_blank" rel="noopener">' + esc(f.name) + "</a>" : esc(f.name)) + "</b>" +
      "<small>" + esc(f.kind) + " · " + sizeTxt(f.size) + " · " + esc(f.by) + " · " + faDate(f.at) + "</small></div>" +
      (canDel ? '<button class="btn ghost sm icon" type="button" data-act="q-fdel" data-f="' + f.id + '" aria-label="حذف ' + esc(f.name) + '">' + ico("x", "sm") + "</button>" : "") + "</li>";
  }).join("");
  return '<div class="box"><div class="box-head"><p class="section-title">' + ico("attach", "sm") + " پیوست‌ها</p>" +
      '<span class="sub">' + fa(files.length) + " از " + fa(QC_FILE_COUNT) + " فایل</span></div>" +
    (rows ? '<ul class="qc-files">' + rows + "</ul>" : '<span class="muted" style="font-size:var(--fs-sm)">هنوز فایلی پیوست نشده است.</span>') +
    (canAdd ? '<div class="qc-up"><select class="select" id="q-fkind" aria-label="نوع پیوست">' + QC_FILE_KINDS.map((k) => "<option>" + k + "</option>").join("") + "</select>" +
      '<label class="qc-drop" for="q-file">' + ico("attach", "sm") + "<span>فایل را اینجا رها کنید یا <b>انتخاب کنید</b></span>" +
      '<input type="file" id="q-file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"></label></div>' +
      '<span class="hint muted" style="font-size:var(--fs-xs)">تصویر، PDF، Word، Excel یا متن؛ هر فایل حداکثر ۱٫۵ مگابایت.' + (q.result ? " بعد از ثبت نتیجه، پیوست‌ها قابل حذف نیستند." : "") + "</span>" : "") +
    "</div>";
}
function qcAddFiles(list) {
  const q = qcById(ui.q.openId); if (!q || !list || !list.length) return;
  readQcForm();
  const kind = ($("#q-fkind") || {}).value || QC_FILE_KINDS[3];
  const room = QC_FILE_COUNT - (q.files || []).length;
  const files = [...list].slice(0, Math.max(0, room));
  if (list.length > files.length) toast("حداکثر " + fa(QC_FILE_COUNT) + " فایل برای هر تسک.", true);
  let left = files.length, added = 0, big = [];
  if (!left) return;
  files.forEach((file) => {
    if (file.size > QC_FILE_MAX) { big.push(file.name); if (!--left) done(); return; }
    const rd = new FileReader();
    rd.onload = () => { const id = uid(); putFile(id, rd.result); qcOps.attach(q, { id, name: file.name, size: file.size, type: file.type, kind }); added++; if (!--left) done(); };
    rd.onerror = () => { if (!--left) done(); };
    rd.readAsDataURL(file);
  });
  function done() {
    save(); renderQcDetail();
    if (big.length) toast("حجم «" + big.join("، ") + "» بیشتر از ۱٫۵ مگابایت است.", true);
    else if (added) toast(fa(added) + " فایل پیوست شد.");
  }
}

/* what the sampling plan says about the defects entered so far */
function qcSuggest(F, plan) {
  const g = (k) => { const n = toNum(F.vals[k]); return isNaN(n) ? 0 : n; };
  const dc = g("q-dc"), dm = g("q-dm");
  const rej = dc > 0 || dm > plan.ac;
  return ico(rej ? "alert" : "check", "sm") + "<span>پیشنهاد طرح نمونه‌برداری: <b>" + (rej ? "رد" : "پذیرش") + "</b> · " +
    (dc > 0 ? "نقص بحرانی دیده شده است" : "نقص عمده " + fa(dm) + " از حداکثر مجاز " + fa(plan.ac)) + ". تصمیم نهایی با مسئول کنترل کیفی است.</span>";
}
function readQcForm() {
  const F = ui.q.form; if (!F) return;
  document.querySelectorAll("#view input[id^='q-'], #view select[id^='q-'], #view textarea[id^='q-']").forEach((el) => {
    if (el.type === "file") return;
    if (el.type === "checkbox") F.vals[el.id] = el.checked; else if (!["q-wh", "q-q", "q-src", "q-owner", "q-fkind"].includes(el.id)) F.vals[el.id] = el.value; });
  const t = document.querySelector("input[name='q-type']:checked"); if (t) F.type = t.value;
  const vd = document.querySelector("input[name='q-verdict']:checked"); if (vd) F.verdict = vd.value;
}
function qcSubmit() {
  const q = qcById(ui.q.openId), F = ui.q.form; readQcForm();
  const n = (k) => toNum(F.vals[k]), int = (x) => x >= 0 && Number.isInteger(x);
  const lot = qcLot(q), plan = samplePlan(lot);
  const dc = n("q-dc"), dm = n("q-dm"), dn = n("q-dn");
  if (![dc, dm, dn].every(int)) return toast("تعداد نقص‌ها باید عدد صحیح باشد.", true);
  const reason = (F.vals["q-reason"] || "").trim(), note = (F.vals["q-note"] || "").trim();
  /* the checklist is copied into the result, so later edits in configuration never change a recorded result */
  const cl = qcChecklist(q), items = cl.items.map((it, i) => ({ t: it.t, req: !!it.req, ok: !!F.vals["q-ck-" + i] }));
  let R;
  if (q.type === "sample") {
    const sn = n("q-n");
    if (!int(sn) || sn < 1 || sn > lot) return toast("تعداد نمونه باید بین ۱ و " + fa(lot) + " باشد.", true);
    if (dc + dm + dn > sn) return toast("تعداد معیوب نمی‌تواند بیشتر از تعداد نمونه باشد.", true);
    R = { verdict: F.verdict, n: sn, dc, dm, dn, approver: F.verdict === "con" ? F.vals["q-appr"] || QC_APPROVERS[0] : "" };
  } else {
    const ok = n("q-ok"), rej = n("q-rej"), con = n("q-con");
    if (![ok, rej, con].every(int)) return toast("پذیرفته، مردود و ارفاقی باید عدد صحیح باشند.", true);
    if (ok + rej + con !== lot) return toast("مجموع پذیرفته، مردود و ارفاقی باید برابر " + fa(lot) + " باشد.", true);
    if (con > 0 && !F.vals["q-appr"]) return toast("برای مقدار ارفاقی، تأییدکننده را انتخاب کنید.", true);
    R = { n: lot, ok, rej, con, dc, dm, dn, approver: con > 0 ? F.vals["q-appr"] : "" };
    R.verdict = qcVerdictOf(R);
  }
  const failReq = items.filter((it) => it.req && !it.ok);
  if (R.verdict === "ok" && failReq.length) return toast("مورد الزامی «" + failReq[0].t + "» مطابق علامت نخورده؛ «پذیرش» ممکن نیست.", true);
  if (R.verdict !== "ok" && !reason) return toast("دلیل رد یا مجوز ارفاقی را بنویسید.", true);
  if (!note) return toast("شرح نتایج بررسی را بنویسید.", true);
  qcOps.result(q, Object.assign(R, { reason: R.verdict === "ok" ? "" : reason, note, checklist: cl.name, items }));
  save(); ui.q.form = null; render();
  toast("نتیجهٔ " + q.no + " ثبت شد" + (qcLine(q) ? " و به رسید ارسال شد." : "."));
}

/* Each tab is a spec builder: (ctx) -> { kpis, blocks }. The page, the Excel workbook and the
   printable report are all rendered from the same specs, so they never disagree. */
const HOUR = 36e5, DAYMS = 864e5;
const ms = (v) => (typeof v === "number" ? v : new Date(v).getTime());
const avg = (a) => (a.length ? sum(a) / a.length : null);
const nf = (n, d) => (n == null || isNaN(n) ? "—" : Number(n).toLocaleString("fa-IR", { maximumFractionDigits: d == null ? 0 : d }));
const pctTxt = (x, d) => (x == null || isNaN(x) ? "—" : nf(x * 100, d == null ? 0 : d) + "٪");
const jd = (t, o) => new Date(t).toLocaleDateString("fa-IR", o || { month: "short", day: "numeric" });
function durTxt(h) {
  if (h == null || isNaN(h)) return "—";
  if (h < 1) return nf(Math.max(1, Math.round(h * 60))) + " دقیقه";
