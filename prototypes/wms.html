/* ---------- tab: stocktaking ---------- */
function tabCounting(c) {
  const eIn = c.entries.filter((x) => c.inP(x.t)), ePrev = c.entries.filter((x) => c.inPrev(x.t));
  const rows = c.rowsOf(eIn), rowsPrev = c.rowsOf(ePrev);

  const misLocs = new Set(diffRows.map((r) => r.x.whId + "|" + r.loc)), countedLocs = new Set(rows.map((r) => r.x.whId + "|" + r.loc));
  eIn.filter((x) => x.s.kind === "loc").forEach((x) => countedLocs.add(x.whId + "|" + x.e.target));
  const misItems = new Set(diffRows.map((r) => r.x.whId + "|" + r.sku)), countedItems = new Set(rows.map((r) => r.x.whId + "|" + r.sku));
  const mgr = eIn.filter((x) => x.e.managerAt).map((x) => (x.e.managerAt - x.e.countedAt) / HOUR);
  const fin = eIn.filter((x) => x.e.financeAt).map((x) => (x.e.financeAt - x.e.managerAt) / HOUR);
  /* accuracy per warehouse per month */
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(c.NOW); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d.getTime()); }
  const mEnd = (j) => (j + 1 < months.length ? months[j + 1] : c.NOW + 1);
  const accSeries = c.whs.map((w, k) => ({ name: w.name, c: k, data: months.map((m, j) => { const a = accuracy(c.rowsOf(c.entries.filter((x) => x.whId === w.id && x.t >= m && x.t < mEnd(j)))); return a == null ? null : +(a * 100).toFixed(1); }) }))
    .filter((s) => s.data.some((v) => v != null));
  const last = lastCountByLoc(c), lastDiff = {};
  c.entries.slice().sort((a, b) => a.t - b.t).forEach((x) => {
    const locs = x.s.kind === "loc" ? [x.e.target] : [...new Set(x.e.rows.map((r) => r.loc))];
    locs.forEach((l) => { lastDiff[x.whId + "|" + l] = x.e.rows.some((r) => r.loc === l && r.counted !== r.sys); });
  });
  const pLocs = c.locs.filter((l) => !isQ(l.code));
  const locState = pLocs.map((l) => { const k = l.whId + "|" + l.code, t = last[k]; return { l, t, st: !t ? "never" : t < c.NOW - 90 * DAYMS ? "stale" : lastDiff[k] ? "diff" : "ok" }; });
  const LS = { ok: "بدون مغایرت", diff: "دارای مغایرت", stale: "معوق (بیش از ۹۰ روز)", never: "شمارش‌نشده" };
  const whMis = c.whs.map((w) => {
    const r = rows.filter((x) => x.x.whId === w.id), cl = [...countedLocs].filter((k) => k.startsWith(w.id + "|")), ci = [...countedItems].filter((k) => k.startsWith(w.id + "|"));
    return { w, l: cl.length ? cl.filter((k) => misLocs.has(k)).length / cl.length * 100 : null, i: ci.length ? ci.filter((k) => misItems.has(k)).length / ci.length * 100 : null, has: r.length };
  }).filter((x) => x.has);
  const vol = months.map((m, j) => { const e = c.entries.filter((x) => x.t >= m && x.t < mEnd(j)); return { loc: e.filter((x) => x.s.kind === "loc").length, item: e.filter((x) => x.s.kind === "item").length }; });
  const heat = { rows: c.whs.map((w) => w.name), cols: months.map((m) => jd(m, { month: "short" })),
    v: c.whs.map((w) => months.map((m, j) => c.entries.filter((x) => x.whId === w.id && x.t >= m && x.t < mEnd(j)).length)) };
  const stageWh = c.whs.map((w) => { const e = eIn.filter((x) => x.whId === w.id); return { w, m: avg(e.filter((x) => x.e.managerAt).map((x) => (x.e.managerAt - x.e.countedAt) / HOUR)), f: avg(e.filter((x) => x.e.financeAt).map((x) => (x.e.financeAt - x.e.managerAt) / HOUR)) }; }).filter((x) => x.m != null);
  const staleItems = c.stock.filter((i) => i.sys > 0).map((i) => {
    const t = Math.max(0, ...c.entries.filter((x) => x.whId === i.whId && x.e.rows.some((r) => r.sku === i.sku && unitOf(r) === i.unit)).map((x) => x.t));
    return { ...i, wh: whName(i.whId), t: t || null, _item: i.key };
  }).filter((i) => !i.t || i.t < c.NOW - 60 * DAYMS);
  const open = c.counts.filter((s) => !["done", "cancel"].includes(countStatus(s)));
  /* counters: one submission = one person's count of one target in one round; dated by when it was sent from the PDA */
  const inCat = (x) => !x.e.rows.length || x.e.rows.some((r) => c.catOk(r.sku));
  const subsOf = (f) => c.entries.filter(inCat).flatMap((x) => (x.e.subs || []).filter((sb) => f(sb.at)).map((sb) => ({ ...sb, x })));
  const evOf = (f) => c.entries.filter(inCat).flatMap((x) => (x.e.events || []).filter((v) => f(v.t)).map((v) => ({ ...v, x })));
  const subs = subsOf(c.inP), subsPrev = subsOf(c.inPrev), evIn = evOf(c.inP), evPrev = evOf(c.inPrev);

      rc: l.filter((x) => x.kind === "recount").length, fin: evIn.filter((v) => v.type === "fin" && v.x.e.subs.some((sb) => sb.by === u)).length };
  }).sort((a, b) => b.n - a.n);
  const evMonth = months.map((m, j) => { const l = evOf((t) => t >= m && t < mEnd(j)); return { recount: evN(l, "recount"), added: evN(l, "added"), fin: evN(l, "fin") }; });
  const retTargets = c.entries.filter(inCat).filter((x) => (x.e.events || []).some((v) => c.inP(v.t)));
  return {

/* ---------- tab: receipts ---------- */
function tabReceipts(c) {
  const per = c.receipts.filter((r) => c.inP(ms(r.createdAt))), prev = c.receipts.filter((r) => c.inPrev(ms(r.createdAt)));
  const done = per.filter((r) => rStatus(r) === "done"), active = c.receipts.filter(isActive);
  const answers = per.flatMap(pdaAnswers), clean = answers.filter((a) => !a.miss).length;
  const disp = per.flatMap(disposals);
  const cyc = avg(done.map(cycleH)), cycPrev = avg(prev.filter((r) => rStatus(r) === "done").map(cycleH));
  const held = [];
  active.forEach((r) => r.lines.forEach((ln) => Object.entries(ln.st).forEach(([s, x]) => { if (x.held) held.push({ r, ln, s, x }); })));
  const stCount = ["wait", "review", "done", "cancel"].map((k) => per.filter((r) => rStatus(r) === k).length);
  const srcs = [...AUTO_SOURCES, ...MANUAL_SOURCES].map((s) => ({ s, n: per.filter((r) => r.source === s).length })).filter((x) => x.n);
  const byFlow = [1, 2, 3].map((fl) => { const rs = done.filter((r) => r.flow === fl); return { fl, n: rs.length, h: avg(rs.map(cycleH)) }; });
  const byStage = ["qty", "qc", "put"].map((s) => { const a = answers.filter((x) => x.s === s); return { s, n: a.length, h: avg(a.map((x) => x.h)), miss: a.filter((x) => x.miss).length }; });
  const whRows = c.whs.map((w) => { const p = per.filter((r) => r.whId === w.id), dn = p.filter((r) => rStatus(r) === "done"), an = p.flatMap(pdaAnswers);
    return { wh: w.name, flow: FLOWS[w.flow].name, n: p.length, done: dn.length, act: c.receipts.filter((r) => r.whId === w.id && isActive(r)).length, held: held.filter((x) => x.r.whId === w.id).length, cyc: avg(dn.map(cycleH)), fp: an.length ? an.filter((a) => !a.miss).length / an.length : null, _wh: w.id }; });
  const ops = PDA_USERS.map((u) => { const a = answers.filter((x) => x.t.person === u); return { u, n: a.length, h: avg(a.map((x) => x.h)), miss: a.length ? a.filter((x) => x.miss).length / a.length : null, open: active.reduce((n, r) => n + r.lines.reduce((m, ln) => m + Object.values(ln.st).reduce((k, x) => k + openTasks(x).filter((t) => t.person === u).length, 0), 0), 0) }; });
  const itemCount = {};
  per.forEach((r) => r.lines.forEach((ln) => { if (!c.catOk(ln.sku)) return; const k = r.whId + "|" + ln.sku + "|" + ln.unit; const o = itemCount[k] || (itemCount[k] = { item: ln.item, unit: ln.unit, wh: whName(r.whId), n: 0, qty: 0, put: 0, loss: 0 }); o.n++; o.qty += ln.qty; o.put += sum(ln.out.put.map((x) => x.qty));
    if (!r.cancelled) o.loss += sum(["scrap", "ret", "cancel"].map((x) => sum(ln.out[x].map((e) => e.qty)))); }));
  Object.values(itemCount).forEach((o) => { o.lp = o.qty ? o.loss / o.qty : null; });
  /* scrap / return / cancel against the whole receipt. Like receipt progress, quantities are counted in the
     document unit (a split unit is converted back); a receipt cancelled as a whole is left out */
  const eqQ = (ln, q) => q / unitF(ln.sku, ln.unit), K4 = ["put", "scrap", "ret", "cancel"];
  const lossOf = (r) => {
    const o = { tot: 0, put: 0, scrap: 0, ret: 0, cancel: 0 };
    r.lines.forEach((ln) => { if (!c.catOk(ln.sku)) return; o.tot += eqQ(ln, ln.qty); K4.forEach((k) => { o[k] += eqQ(ln, sum(ln.out[k].map((x) => x.qty))); }); });
    o.loss = o.scrap + o.ret + o.cancel;
    return o;
  };
  const LS = per.filter((r) => !r.cancelled).map((r) => ({ r, o: lossOf(r) }));
  const S = ["tot", "put", "scrap", "ret", "cancel", "loss"].reduce((a, k) => { a[k] = sum(LS.map((x) => x.o[k])); return a; }, {});
  const sShare = (v) => (S.tot ? v / S.tot : null);
  const parts = [["جایگذاری‌شده", S.put, "ok"], ["ضایعات", S.scrap, "bad"], ["برگشت", S.ret, "warn"], ["لغو", S.cancel, "neutral"], ["هنوز در مسیر", Math.max(0, S.tot - S.put - S.loss), 0]];
  const lossTrend = (k) => c.B.list.map((b) => { const L = LS.filter((x) => { const t = ms(x.r.createdAt); return t > b.from && t <= b.to; }), tot = sum(L.map((x) => x.o.tot)); return tot ? +(sum(L.map((x) => x.o[k])) * 100 / tot).toFixed(1) : null; });
  const docUnit = (r) => { const u = [...new Set(r.lines.filter((l) => !l.grp).map((l) => l.unit))]; return u.length === 1 ? u[0] : "چند کالا"; };
  const pctTone = (v) => (v == null ? "—" : '<span class="' + (v >= .05 ? "t-bad" : v >= .02 ? "t-warn" : "") + '">' + pctTxt(v, 1) + "</span>");
  const lossRows = LS.filter((x) => x.o.loss > 0).map(({ r, o }) => ({ no: r.no, src: r.supplier || r.source, wh: whName(r.whId), tot: o.tot, unit: docUnit(r),
    scrap: o.scrap, ps: o.scrap / o.tot, ret: o.ret, pr: o.ret / o.tot, cancel: o.cancel, pcn: o.cancel / o.tot, lp: o.loss / o.tot, _receipt: r.id }));
  return {
    kpis: [
      { l: "رسیدهای بازه", v: nf(per.length), u: "رسید", d: delta(per.length, prev.length), good: "up", spark: c.B.count(c.receipts.map((r) => ms(r.createdAt))), note: nf(per.filter((r) => !isManual(r)).length) + " خودکار · " + nf(per.filter(isManual).length) + " دستی" },
      { l: "در جریان", v: nf(active.length), u: "رسید", note: nf(active.filter((r) => rStatus(r) === "wait").length) + " در انتظار بررسی · " + nf(active.filter((r) => rStatus(r) === "review").length) + " در حال بررسی" },
      { l: "تکمیل‌شده", v: nf(done.length), u: "رسید", note: pctTxt(per.length ? done.length / per.length : null) + " رسیدهای بازه" },
      { l: "میانگین زمان چرخه", v: durTxt(cyc), note: "از ایجاد تا تعیین وضعیت همهٔ ردیف‌ها", d: delta(cyc, cycPrev), good: "down" },
      { l: "پاسخ PDA بدون مغایرت", hint: HINT_PDA_CLEAN, v: pctTxt(answers.length ? clean / answers.length : null), note: nf(clean) + " از " + nf(answers.length) + " پاسخ" },
      { l: "مغایرت منتظر تصمیم", v: nf(held.length), u: "ردیف", note: "تنها جایی که کارشناس لازم است", tone: held.length ? "warn" : "" }
    ],
    blocks: [
      { kind: "chart", span: 8, title: "روند رسیدها", sub: "ایجادشده در برابر تکمیل‌شده · " + c.B.unit,
        chart: { kind: "bar", labels: c.B.labels, series: [{ name: "ایجادشده", data: c.B.count(c.receipts.map((r) => ms(r.createdAt))), c: 0 }, { name: "تکمیل‌شده", data: c.B.count(c.receipts.filter((r) => rStatus(r) === "done").map(finishedAt)), c: 1 }], unit: "رسید" } },
      { kind: "chart", span: 4, title: "وضعیت رسیدهای بازه", sub: "",
        chart: { kind: "donut", labels: ["در انتظار بررسی", "در حال بررسی", "تکمیل", "لغو رسید"], series: [{ data: stCount }], colors: ["warn", 0, "ok", "neutral"], unit: "رسید", center: "رسید" } },
      { kind: "chart", span: 4, title: "ضایعات، برگشت و لغو نسبت به کل رسید", sub: "سهم هر نتیجه از کل مقدار رسیدهای بازه · " + pctTxt(sShare(S.loss), 1) + " اتلاف",
        chart: { kind: "donut", labels: parts.map(([n, v]) => n + " · " + pctTxt(sShare(v), 1)), series: [{ data: parts.map((p) => +p[1].toFixed(1)) }], colors: parts.map((p) => p[2]), unit: "واحد", center: "واحد رسید" } },

function reportModalHtml(m) {

    (m.busy ? '<div class="notice demo"><strong>در حال ساخت گزارش…</strong></div>' : ""),
    '<button class="btn primary" type="button" data-act="m-ok"' + (m.busy ? " disabled" : "") + ">ساخت و دریافت</button>");
}
async function runReport() {
  const m = ui.modal;
  m.tabs = [...document.querySelectorAll('input[name="r-tab"]:checked')].map((x) => x.value);
  m.fmt = (document.querySelector('input[name="r-fmt"]:checked') || {}).value || "xlsx";
  if (!m.tabs.length) { m.err = "حداقل یک بخش انتخاب کنید."; return renderModal(); }
  m.err = ""; m.busy = true; renderModal();
  try {
    if (m.fmt === "xlsx") {
      if (!window.XLSX) throw new Error("xlsx");
      await saveFile("wms-report-" + stamp() + ".xlsx", new Blob([buildXlsx(m.tabs)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    } else {
      await saveFile("wms-report-" + stamp() + ".html", new Blob([await buildHtmlReport(m.tabs)], { type: "text/html" }));
    }
    ui.modal = null; renderModal();
  } catch (e) {
    m.busy = false; m.err = e && e.message === "xlsx" ? "کتابخانهٔ Excel بارگذاری نشد؛ اتصال اینترنت را بررسی کنید." : "ساخت گزارش انجام نشد.";
    renderModal();
  }
}

function curLine(m) { return curReceipt().lines.find((l) => l.id === m.l); }

function reasonSelect(id, kind, sel) {

        '<ul class="rv-list">' + P.map((x) => "<li><span>" + esc(x.item) + '</span><b class="num">' + qtyTxt(x.st[m.s].pending, x) + "</b></li>").join("") + "</ul>" +
        '<div class="form-grid"><div class="f"><label for="m-p">انباردار <span class="req">*</span></label><select class="select" id="m-p">' + PDA_USERS.map((u) => "<option>" + u + "</option>").join("") + "</select></div>" +
        '<div class="f"><label for="m-n">توضیحات برای انباردار</label><input class="input" id="m-n" placeholder="اختیاری"></div></div>' +
        '<span class="hint muted" style="font-size:var(--fs-xs)">برای هر قلم یک تسک جدا به PDA همین انباردار می‌رود. برای تقسیم یک قلم بین چند نفر، از «ارسال به PDA» روی کارت همان قلم استفاده کنید.</span>',

/* manual move dialog, opened by dropping a card on a column or from the card's move button */
function moveModal(r, ln, m, sub) {
  const x = ln.st[m.s], i = r.stages.indexOf(m.s);
  const srcs = [["pending", "در انتظار ارسال به PDA", x.pending], ["held", "مغایرت", x.held], ["rej", "مردود کنترل کیفی", x.rej || 0]].filter((v) => v[2] > 0);
  if (!srcs.some((v) => v[0] === m.src)) m.src = srcs[0][0];
  const max = x[m.src];
  /* QC-rejected quantity may only leave as a return to procurement or scrap */
  const rej = m.src === "rej";
  const targets = rej ? ["done"] : r.stages.filter((t) => canMoveTo(r, m.s, t));
  if (!targets.includes(m.to)) m.to = targets.find((t) => r.stages.indexOf(t) === i + 1) || targets[0];
  const toDone = m.to === "done", back = r.stages.indexOf(m.to) < i;
  const kinds = rej ? [["ret", "برگشت به تدارکات"], ["scrap", "ضایعات"]]
    : (m.s === "put" ? [["put", "جایگذاری دستی"]] : []).concat([["ret", "برگشت"], ["scrap", "ضایعات"], ["cancel", "لغو"]]);
  if (toDone && !kinds.some((k) => k[0] === m.k)) m.k = kinds[0][0];
  const reasons = toDone ? (m.k === "put" ? MOVE_REASONS.fwd : REASONS[m.k]) : back ? MOVE_REASONS.back : MOVE_REASONS.fwd;
  const tName = (t) => t === "done" ? "تعیین وضعیت (پایان مسیر)" : (r.stages.indexOf(t) < i ? "برگشت به «" : "انتقال به «") + STAGE[t].name + "»";
  const pipe = '<div class="move-path"><span class="from">' + STAGE[m.s].name + "</span>" + ico("left", "sm") + '<span class="to' + (back ? " back" : toDone ? " done" : "") + '">' + STAGE[m.to].name + "</span></div>";
  const body = pipe +
    '<div class="form-grid">' +
      '<div class="f"><label for="m-to">مقصد</label><select class="select" id="m-to">' + targets.map((t) => '<option value="' + t + '"' + (t === m.to ? " selected" : "") + ">" + tName(t) + "</option>").join("") + "</select></div>" +
      (srcs.length > 1 ? '<div class="f"><label for="m-src">از کدام مقدار</label><select class="select" id="m-src">' + srcs.map(([v, t, q]) => '<option value="' + v + '"' + (v === m.src ? " selected" : "") + ">" + t + " (" + fa(q) + ")</option>").join("") + "</select></div>"
        : '<div class="f"><span class="lbl">از کدام مقدار</span><span class="hint" style="font-size:var(--fs-sm)">' + srcs[0][1] + " (" + fa(srcs[0][2]) + ")</span></div>") +
      '<div class="f"><label for="m-q">مقدار <span class="req">*</span></label><input class="input" id="m-q" inputmode="numeric" value="' + esc(m.qv != null ? m.qv : fa(max)) + '"><span class="hint">حداکثر ' + fa(max) + " " + esc(ln.unit) + "</span></div>" +
      (toDone ? '<div class="f"><label for="m-kind">نوع تعیین وضعیت</label><select class="select" id="m-kind">' + kinds.map(([v, t]) => '<option value="' + v + '"' + (v === m.k ? " selected" : "") + ">" + t + "</option>").join("") + "</select></div>" : "") +
      (toDone && m.k === "put" ? '<div class="f"><label for="m-loc">مکان جایگذاری</label><select class="select" id="m-loc">' + (state.locs[r.whId] || []).filter((l) => !isQ(l.code)).map((l) => '<option dir="ltr">' + l.code + "</option>").join("") + "</select></div>" : "") +
      '<div class="f' + (toDone && m.k === "put" ? "" : " wide") + '"><label for="m-reason">دلیل <span class="req">*</span></label><select class="select" id="m-reason">' + reasons.map((v) => "<option>" + v + "</option>").join("") + "</select></div>" +
    "</div>" +
    (rej ? '<div class="notice bad"><strong>این مقدار در کنترل کیفی رد شده است.</strong>فقط «برگشت به تدارکات» یا «ضایعات» برای آن ممکن است. آیا مطمئن هستید که این مقدار ' + (m.k === "ret" ? "به تدارکات برگشت داده شود" : "ضایعات ثبت شود") + "؟</div>" : "") +
    '<span class="hint muted" style="font-size:var(--fs-xs)">' + (toDone ? (m.k === "put" ? "مقدار بدون PDA به‌عنوان جایگذاری‌شده ثبت می‌شود." : "مقدار مستقیم به ستون «تعیین وضعیت‌شده» می‌رود.")
      : back ? "مقدار در «" + STAGE[m.to].name + "» منتظر ارسال دوباره به PDA می‌ماند." : "مقدار بدون پاسخ PDA تأیید و در «" + STAGE[m.to].name + "» منتظر ارسال به PDA می‌شود.") +
    " این جابجایی با نام شما در رویدادهای رسید ثبت می‌شود.</span>";
  if (rej) return dlg("تعیین تکلیف مردودی " + esc(ln.item), sub, body, '<button class="btn danger solid" type="button" data-act="m-ok">بله، ' + (m.k === "ret" ? "برگشت به تدارکات" : "ضایعات") + " ثبت شود</button>");
  return dlg("جابجایی دستی " + esc(ln.item), sub, body, '<button class="btn primary" type="button" data-act="m-ok">' + ico("move", "sm") + "ثبت جابجایی</button>");
}
/* unit split dialog: part of the quantity waiting in this stage turns into a smaller unit of the same item */
function splitModal(r, ln, m, sub) {
  const max = ln.st[m.s].pending, T = splitTargets(ln.sku, ln.unit);
  if (!T.some((u) => u.unit === m.to)) m.to = T[0].unit;
  return dlg("تقسیم واحد " + esc(ln.item), sub,
    '<div class="form-grid">' +

function modalOk(btn) {
  const m = ui.modal;
  if (m.kind.startsWith("k-")) return kModalOk(m, btn);
  const bad = (msg) => { m.err = msg; renderModal(); };
  const num = (id) => toNum(document.getElementById(id).value);

  if (m.kind === "report") return runReport();
  if (m.kind.startsWith("g-")) return gModalOk(m);
  if (m.kind === "qc-new") {
    readQcNew();
    const d = m.form;
    if (!d.wh || !d.item || !d.loc) return bad("انبار، کالا و مکان را انتخاب کنید.");
    const c = qcCandidates(+d.wh).find((x) => x.it.sku + "|" + x.it.unit === d.item), l = c && c.locs.find((x) => x.loc === d.loc);
    const q = toNum(d.qty);
    if (!l) return bad("این مکان دیگر موجودی آزاد ندارد.");
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > l.free) return bad("مقدار نمی‌تواند بیشتر از " + fa(l.free) + " باشد.");
    const nq = qcOps.manual({ whId: +d.wh, sku: c.it.sku, unit: c.it.unit, item: c.it.item, loc: d.loc, qty: q, reason: d.reason, owner: d.owner, desc: d.desc });
    save(); ui.modal = null; ui.view = "qc"; ui.q.openId = nq.id; ui.q.form = null; render(); window.scrollTo(0, 0);
    return toast("کنترل کیفی " + nq.no + " ایجاد شد و " + fa(q) + " " + c.it.unit + " قرنطینه شد.");
  }
  if (m.kind === "cl") return saveCl();
  if (m.kind === "qc-decide") {
    const q = qcById(m.qid), n = num("m-q"), max = qcUndecided(q);
    if (!(n > 0) || !Number.isInteger(n)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (n > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    const p = $("#m-p").value;
    qcOps.decide(q, m.k, n, $("#m-reason").value, p);
    save(); ui.modal = null; render();
    return toast("تسک برداشت " + fa(n) + " " + q.unit + " مردود به PDA " + p + " ارسال شد.");
  }
  if (m.kind === "qc-pick") {
    const q = qcById(m.qid), p = q.picks.find((y) => y.id === m.p), c = num("m-c");
    if (!(c >= 0) || !Number.isInteger(c)) return bad("تعداد معتبر وارد کنید.");
    if (c > p.qty) return bad("تعداد برداشت‌شده نمی‌تواند بیشتر از مقدار تسک باشد.");
    qcOps.pickDone(q, m.p, c);
    save(); ui.modal = null; render();
    return toast(fa(c) + " " + q.unit + " برداشت و " + (p.kind === "ret" ? "برگشت به تدارکات" : "ضایعات") + " ثبت شد.");
  }
  if (m.kind === "qc-dispose") {
    const q = qcById(m.qid), n = num("m-q"), max = qcHeld(q);
    if (!(n > 0) || !Number.isInteger(n)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (n > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    qcOps.dispose(q, m.k, n, $("#m-reason").value);
    save(); ui.modal = null; render();
    return toast(fa(n) + " " + q.unit + " مردود " + OUT_NAME[m.k] + " ثبت شد.");
  }
  if (m.kind === "new") {
    readNewForm();
    const d = m.form, errs = {};
    if (!d.site) errs.site = 1;
    if (!d.whId) errs.wh = 1;
    if (!d.owners.length) errs.owners = "حداقل یک مسئول حواله انتخاب کنید.";
    const items = d.items.filter((it) => it.sku && toNum(it.qty) > 0);
    if (!items.length || d.items.some((it) => (it.sku && !(toNum(it.qty) > 0)) || (!it.sku && String(it.qty).trim()))) errs.items = "وارد کردن اطلاعات حداقل یک آیتمِ رسیدشده با تعداد معتبر الزامی است.";
    m.errs = errs;
    if (Object.keys(errs).length) return bad("وارد کردن سایت / انبار / مسئول حواله / منبع ایجاد حواله الزامی است.");
    const r = makeReceipt({ id: Math.max(0, ...state.receipts.map((x) => x.id)) + 1, no: nextReceiptNo(), whId: +d.whId, source: d.source,
      ref: d.ref, supplier: d.supplier, lead: d.lead, desc: d.desc, owners: d.owners, by: ME,
      lines: items.map((it) => ({ sku: it.sku, qty: toNum(it.qty) })) });
    state.receipts.push(r); save();
    ui.modal = null; ui.r.openId = r.id; ui.view = "receipts";
    render(); toast("حوالهٔ رسید " + r.no + " با موفقیت ایجاد شد.");
    return;
  }

  const r = curReceipt(), ln = m.l ? curLine(m) : null;
  if (m.kind === "assign" || m.kind === "dispose") {
    const q = num("m-q"), max = ln.st[m.s][m.kind === "dispose" ? m.f : "pending"];
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    if (m.kind === "assign") { const p = $("#m-p").value; ops.assign(r, ln, m.s, q, p, $("#m-n").value.trim()); toast("تسک به PDA " + p + " ارسال شد."); }
    if (m.kind === "dispose") { ops.dispose(r, ln, m.s, m.f, m.k, q, $("#m-reason").value); toast(fa(q) + " " + ln.unit + " " + OUT_NAME[m.k] + " ثبت شد."); }
  }
  if (m.kind === "move") {
    readMoveForm();
    const q = num("m-q"), max = ln.st[m.s][m.src], reason = $("#m-reason").value;
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " باشد.");
    if (m.to !== "done") { ops.move(r, ln, m.s, m.src, m.to, q, reason); toast(fa(q) + " " + ln.unit + " به «" + STAGE[m.to].name + "» منتقل شد."); }
    else if (m.k === "put") { const loc = $("#m-loc").value; ops.manualPut(r, ln, m.src, q, loc, reason); toast(fa(q) + " " + ln.unit + " دستی در " + loc + " جایگذاری شد."); }
    else { ops.dispose(r, ln, m.s, m.src, m.k, q, reason); toast(fa(q) + " " + ln.unit + " " + OUT_NAME[m.k] + " ثبت شد."); }
  }
  if (m.kind === "split") {
    const q = num("m-q"), max = ln.st[m.s].pending, to = $("#m-unit").value;
    m.qv = $("#m-q").value; m.to = to;
    if (!(q > 0) || !Number.isInteger(q)) return bad("مقدار باید عددی صحیح و بزرگ‌تر از صفر باشد.");
    if (q > max) return bad("مقدار نمی‌تواند بیشتر از " + fa(max) + " " + ln.unit + " در انتظار این مرحله باشد.");
    const o = ops.split(r, ln, m.s, q, to);
    toast(fa(q) + " " + ln.unit + " به " + fa(o.n) + " " + to + " تقسیم شد.");
  }
  if (m.kind === "assign-all") {
    const p = $("#m-p").value, note = $("#m-n").value.trim(), P = r.lines.filter((x) => x.st[m.s].pending > 0);
    P.forEach((x) => ops.assign(r, x, m.s, x.st[m.s].pending, p, note));
    toast(fa(P.length) + " تسک " + STAGE[m.s].name + " به PDA " + p + " ارسال شد.");
  }
  if (m.kind === "cancel-task") { ops.cancelTask(r, ln, m.s, m.t); toast("تسک لغو شد."); }
  if (m.kind === "pda") {
    const t = curTask(m);
    let res;
    if (m.s === "qty") { const c = num("m-c"); if (!(c >= 0) || !Number.isInteger(c)) return bad("تعداد معتبر وارد کنید."); if (c > t.qty) return bad("تعداد شمارش‌شده نمی‌تواند بیشتر از مقدار منتسب‌شده باشد."); res = { count: c }; }
    if (m.s === "qc") { const a = num("m-ok"), b = num("m-pa"), c = num("m-rj");
      if ([a, b, c].some((x) => !(x >= 0) || !Number.isInteger(x))) return bad("هر سه مقدار باید عدد صحیح باشند.");
      if (a + b + c === 0) return bad("حداقل یک مقدار وارد کنید.");
      if (a + b + c > t.qty) return bad("مجموع نتایج نمی‌تواند بیشتر از " + fa(t.qty) + " باشد.");
      res = { ok: a, partial: b, rej: c }; }
    if (m.s === "put") { const c = num("m-c"); if (!(c >= 0) || !Number.isInteger(c)) return bad("تعداد معتبر وارد کنید."); if (c > t.qty) return bad("تعداد کالای جایگذاری‌شده بیشتر است."); res = { placed: c, loc: $("#m-loc").value }; }
    const o = ops.pda(r, ln, m.s, m.t, res);
    toast("پاسخ PDA ثبت شد؛ " + fa(o.ok) + " " + ln.unit + " به «" + STAGE[o.n].name + "» رفت" + (o.rest ? " و " + fa(o.rest) + " مغایرت منتظر تعیین تکلیف است." : "."));
  }
  if (m.kind === "cancel-receipt") { ops.cancelReceipt(r, $("#m-reason").value); toast("رسید " + r.no + " لغو شد."); }
  save(); ui.modal = null; render();
}

/* drag and drop on the receipt board: drop targets light up by the same rule the move dialog enforces */
let dragInfo = null;
function endDrag() {
  dragInfo = null;
  document.querySelectorAll(".dragging, .is-dragging, .drop-ok, .drop-no, .over").forEach((el) => el.classList.remove("dragging", "is-dragging", "drop-ok", "drop-no", "over"));
}
document.addEventListener("dragstart", (e) => {
  const c = e.target.closest && e.target.closest("[data-drag]");
  if (!c) return;
  const [l, s] = c.dataset.drag.split("|"), r = curReceipt();
  const x = r.lines.find((y) => y.id === l).st[s];
  /* a card holding only QC-rejected quantity can go nowhere but "done" */
  const onlyRej = (x.rej || 0) > 0 && !x.pending && !x.held;
  dragInfo = { l, s, rej: onlyRej };
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", c.dataset.drag); } catch (err) {}
  c.classList.add("dragging");
  $(".board").classList.add("is-dragging");
  document.querySelectorAll(".board .col[data-col]").forEach((col) => {
    const to = col.dataset.col;
    if (to === s) return;
    if (!canMoveTo(r, s, to) || (onlyRej && to !== "done")) { col.classList.add("drop-no"); return; }
    col.classList.add("drop-ok");
    col.dataset.hint = to === "done" ? (onlyRej ? "رها کنید: برگشت به تدارکات یا ضایعات" : "رها کنید: تعیین وضعیت") : r.stages.indexOf(to) < r.stages.indexOf(s) ? "رها کنید: برگشت به این مرحله" : "رها کنید: انتقال به این مرحله";
  });
});
document.addEventListener("dragover", (e) => {
  if (!dragInfo) return;
  const col = e.target.closest && e.target.closest(".col.drop-ok");
  document.querySelectorAll(".col.over").forEach((x) => { if (x !== col) x.classList.remove("over"); });
  if (!col) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over");
});
document.addEventListener("drop", (e) => {
  if (!dragInfo) return;
  const col = e.target.closest && e.target.closest(".col.drop-ok"), d = dragInfo;
  endDrag();
  if (!col) return;
  e.preventDefault();
  openModal(Object.assign({ kind: "move", l: d.l, s: d.s, to: col.dataset.col }, d.rej ? { src: "rej", k: "ret" } : {}));
});
document.addEventListener("dragend", endDrag);
/* dropping files on the QC attachment zone */
document.addEventListener("dragover", (e) => {
  const z = e.target.closest && e.target.closest(".qc-drop");
  document.querySelectorAll(".qc-drop.over").forEach((x) => { if (x !== z) x.classList.remove("over"); });
  if (!z || dragInfo) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy"; z.classList.add("over");
});
document.addEventListener("drop", (e) => {

  qcAddFiles(e.dataTransfer.files);
});

/* live readings: every tick each connected tank loses a little level; the screen patches numbers in place
   (so focus and clicks are not disturbed) and re-renders only when a tank's alarm state changes */
function tkTick() {
  if (!TK) return;
  const n = Date.now(), hr = new Date(n).getHours();
  TK.forEach((t) => {
    if (t.stale || tk.busy) return;
    /* an empty, out-of-service tank is not used by production */
    if (!t.oos) t.pct = Math.max(0, t.pct - (hr >= 6 && hr < 22 ? t.rate : t.rate * 0.08) * TK_TICK / 3600000 * (0.6 + Math.random() * 0.8));
    t.seen = n;
    const h = t.hist, last = h[h.length - 1];
    /* a point that closes a transfer or a manual reading keeps its value; later readings start a new point */
    if (last.x || last.m || n - h[h.length - 2].t >= 3600000) h.push({ t: n, v: t.pct }); else { last.t = n; last.v = t.pct; }
  });
  tkBadge();
  if ((ui.view === "tanks" || (ui.view === "receipts" && tk.trOpen)) && !ui.modal && !document.hidden) tkPatch();
}
function tkPatch() {
  let changed = false;
  document.querySelectorAll("#view [data-tkid]").forEach((el) => {
    const t = tkById(el.dataset.tkid);
    if (!t) return;
    if (el.dataset.tks !== tkSig(t)) { changed = true; return; }
    const d = tkD(t), f = {
      t: nf(d.kg / 1000, 1), pct: nf(t.pct, 1) + "٪", vol: nf(d.vol) + " لیتر", vol2: nf(d.vol), free: nf(d.freeKg / 1000, 1) + " تن", free2: nf(d.freeKg),
      fit: "کیلوگرم · " + tkFitTxt(d), cm: "ارتفاع مایع " + nf(d.cm) + " سانتی‌متر", kg: nf(d.kg), kg2: nf(d.kg), book: nf(d.book), book2: nf(d.book), eta2: d.etaTxt, seen: tkSeen(t) };
    el.querySelectorAll("[data-tkf]").forEach((x) => {
      const k = x.dataset.tkf;
      if (k === "eta") { x.textContent = d.etaTxt; x.className = "tk-eta " + d.etaCls; } else if (k in f) x.textContent = f[k];
    });
    el.querySelectorAll("[data-tkliq]").forEach((x) => { x.style.transform = "scaleY(" + (t.pct / 100).toFixed(4) + ")"; });
  });
  if (changed) { const a = document.activeElement; if (!a || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) render(); }
}
/* demo: a tanker unloads into the open tank; refused when it would pass the overflow level */
function tkSimFill(t) {
  const p = TK_PRODUCTS[t.sku], kg = p.tanker, add = kg / t.rho / t.cap * 100;
  if (t.pct + add > t.th.hh) {
    toast("ظرفیت کافی نیست: با تخلیهٔ " + nf(kg / 1000) + " تن سطح به " + nf(t.pct + add) + "٪ می‌رسد و از حد «خیلی بالا» (" + nf(t.th.hh) + "٪) می‌گذرد.", true);
    return;
  }
  tk.busy = true; render();
  const from = t.pct, steps = 8;
  let k = 0;
  const iv = setInterval(() => {
    k++; t.pct = from + add * k / steps; t.seen = Date.now();
    if (ui.view === "tanks" || ui.view === "receipts") tkPatch();
    if (k < steps) return;
    clearInterval(iv);
    const no = tkNextNo();
    t.hist.push({ t: Date.now(), v: t.pct });
    t.fills.push({ at: Date.now(), kg, scale: Math.round(kg * 1.002), idx: t.hist.length - 1, no });
    tk.busy = false;
    render();
    toast("تخلیهٔ تانکر ثبت شد: " + nf(kg) + " کیلوگرم " + p.name + " به " + t.name + " اضافه شد (رسید " + no + ").");
  }, 350);
}

function tkManSave(t) {

/* ---------- alarm notifications ---------- */
function tkNtfSync() {
  if (!TK || !tkStore || !tkStore.notif) return;
  const N = tkStore.notif, now = Date.now(), A = tkAllAlarms();
  A.forEach((a) => {
    const key = a.id + "@" + Math.round(a.at / 60000);
    if (!tk.ntfSeen[key]) {
      tk.ntfSeen[key] = 1;
      const R = N.rules[a.k] || {};
      Object.keys(R).forEach((g) => (R[g] || []).forEach((ch) => {
        const G = N.groups.find((x) => x.id === g);
        if (G) tk.ntf.push({ key, aid: a.id, tid: a.t.id, k: a.k, at: a.at + 15000, g: G.name, who: g === "owner" ? tkOwner(a.t) : G.who, ch, st: ch === "sms" ? "تحویل شد" : "ارسال شد" });
      }));
    }
    /* a critical alarm that nobody acknowledges in time goes to the factory manager */
    if (a.tone === "bad" && !tk.ack[a.id] && now - a.at > N.esc * 60000 && !tk.ntf.some((x) => x.key === key && x.esc))
      tk.ntf.push({ key, aid: a.id, tid: a.t.id, k: a.k, at: a.at + N.esc * 60000, g: N.escTo.name, who: N.escTo.who, ch: "sms", st: "تحویل شد", esc: true });
  });
  const open = new Set(A.filter((a) => !tk.ack[a.id]).map((a) => a.id));
  tk.ntf.forEach((x) => { if (x.esc && !x.closed && !open.has(x.aid)) x.closed = true; });
}
function tkNtfLine(a) {
  const L = tk.ntf.filter((x) => x.aid === a.id && Math.abs(x.at - a.at) < 86400000 * 8);
  if (!L.length) return "";
  return '<p class="tk-ntl">' + L.slice(0, 5).map((x) => '<span class="' + (x.esc ? "esc" : "") + '">' + (x.esc ? "ارجاع به " : "") + TK_CH[x.ch] + " · " + esc(x.g) + "</span>").join("") +
    (L.length > 5 ? "<span>+" + fa(L.length - 5) + "</span>" : "") + "</p>";
}

      '<div class="sample-note">' + ico("info", "sm") + "ارسال در نمونه شبیه‌سازی می‌شود</div></div>" +
    '<div class="table-wrap"><table><thead><tr><th>زمان</th><th>مخزن</th><th>هشدار</th><th>گیرنده</th><th>کانال</th><th>وضعیت</th></tr></thead><tbody>' +

/* ---------- tank cardex: book movements of one liquid item, all tanks or one ---------- */
const TK_MV = { rec: "رسید تانکر", use: "مصرف تولید", xf: "انتقال بین مخازن", adj: "تعدیل" };
function tkKdxRows(sku, tid) {
  const tanks = TK.filter((t) => t.sku === sku && (tid === "all" || t.id === tid)), ids = new Set(tanks.map((t) => t.id)), from = Date.now() - 7 * 86400000, mv = [];
  const nm = (id) => { const t = tkById(id); return t ? t.name : id; };
  tk.trs.filter((r) => r.status === "done" && ids.has(r.tankId) && r.doneAt >= from).forEach((r) => mv.push({ at: r.doneAt, kind: "rec", tid: r.tankId, ref: r.no, q: trNet(r), det: r.supplier, go: "tr:" + r.id }));
  tkUseRows().filter((u) => ids.has(u.t.id) && u.at >= from && u.kg > 0.5).forEach((u) => mv.push({ at: u.at, kind: "use", tid: u.t.id, ref: tk.prd[u.k] || "", q: -u.kg,
    det: u.st === "run" ? "امروز · در حال ثبت" : u.st === "gap" ? "ناقص · منتظر قرائت دستی" : u.st === "wait" ? "منتظر تأیید مسئول مخزن" : "تأییدشده" + (u.est ? " · شامل برآورد قرائت دستی" : "") }));
  tk.xfs.filter((x) => x.at >= from).forEach((x) => {
    if (ids.has(x.from)) mv.push({ at: x.at, kind: "xf", tid: x.from, ref: x.id, q: -x.kg, det: "به " + nm(x.to) });
    if (ids.has(x.to)) mv.push({ at: x.at, kind: "xf", tid: x.to, ref: x.id, q: x.kg, det: "از " + nm(x.from) });
  });
  tk.adj.filter((a) => a.status === "done" && ids.has(a.tid) && (a.apprAt || a.at) >= from).forEach((a) => mv.push({ at: a.apprAt || a.at, kind: "adj", tid: a.tid, ref: a.id, q: a.qty, det: "تأیید " + (a.appr || "") }));
  mv.sort((a, b) => a.at - b.at);
  const book = sum(tanks.map((t) => tkD(t).book)), open = book - sum(mv.map((m) => m.q));
  let run = open; mv.forEach((m) => { run += m.q; m.bal = run; });
  return { tanks, mv, open, book, from };
}

    "</div>" +
    '<div class="summary">' + [
      ["موجودی ابتدای دوره", nf(R.open) + '<small class="tk-u">کیلوگرم · ۷ روز پیش</small>', "clock", ""],
      ["ورودی", nf(inQ) + '<small class="tk-u">کیلوگرم</small>', "in", "ok"],

      (p.alt ? " " + p.name + " در انبارها هم " + fa(whBar) + " " + p.alt.unit + " موجودی دارد که در کاردکس همان انبار است (یک کالا، دو واحد)." : "") + "</p>" +

      L.map((m) => "<tr" + (m.go ? ' data-tkgo="' + m.go + '" tabindex="0"' : "") + "><td>" + faDate(iso(m.at)) + '<span class="sub">' + (m.kind === "use" ? "جمع روز" : faTime(iso(m.at))) + "</span></td><td>" + TK_MV[m.kind] + "</td>" +
        "<td>" + esc((tkById(m.tid) || {}).name || m.tid) + "</td><td>" + (m.ref ? '<span class="code">' + esc(m.ref) + "</span>" : "—") + "</td><td>" + esc(m.det) + "</td>" +

   A tank is equipment (sensor, calibration, density, alarms) and stays defined in «تعریف مخازن»;
   its stock is booked on one leaf location of the site's tank warehouse (warehouse kind "tank").
   So receipts, consumption, cardex, stock reports and item details all read the one stock ledger. */
const TK_WH_ID = 901;
const TK_AREA_LOC = [["شمالی", "ROW-N"], ["جنوبی", "ROW-S"], ["سکوی", "DOCK"]];
/* a warehouse is a tank warehouse when its type's storage mode is «مخزنی» («انواع انبار») */
function isTankWh(w) { return !!w && isTankType(w.type); }
function tkLocFor(area, id) { const m = TK_AREA_LOC.find(([k]) => String(area || "").includes(k)); return (m ? m[1] : "ROW-A") + "/" + id; }
function tkTankWhs() { return state && state.warehouses ? state.warehouses.filter(isTankWh) : []; }
function tkAtLoc(whId, code) { return (TK || []).find((t) => t.whId === whId && t.loc === code) || null; }
function tkWhLocHtml(tid) { const d = tkDef(tid); return d && d.whId ? esc(whName(d.whId)) + ' · مکان <span class="code">' + esc(d.loc) + "</span>" : esc((d && d.site) || ""); }
/* the tank warehouse of each site that has tanks; its locations are exactly the tanks' locations */
function tkEnsureWh(force) {
  if (!state || !state.warehouses || !tkStore) return;
  let changed = whTypesEnsure();
  tkStore.tanks.forEach((d) => {
    if (d.whId && isTankWh(whById(d.whId))) return;
    let w = state.warehouses.find((x) => isTankWh(x) && x.site === d.site);
    if (!w) {
      const id = state.warehouses.some((x) => x.id === TK_WH_ID) ? Math.max(...state.warehouses.map((x) => x.id)) + 1 : TK_WH_ID;
      w = { id, code: "WH-" + id, name: "انبار مخازن " + d.site.replace(/ ۱$/, ""), type: whTankTypeName(), site: d.site, active: true, flow: 1,
        address: "", desc: "مایعات فله در مخازن", log: [{ at: new Date(Date.now() - 90 * 86400000).toISOString(), text: "انبار مخزنی تعریف شد", who: ME }] };
      state.warehouses.push(w); changed = true;
    }
    d.whId = w.id; tkSave();
    const run = tkById(d.id); if (run) run.whId = w.id;
  });
  tkTankWhs().forEach((w) => {
    const want = tkStore.tanks.filter((d) => d.whId === w.id).map((d) => ({ code: d.loc, cap: 0 }));
    if (JSON.stringify(want) !== JSON.stringify(state.locs[w.id] || [])) { state.locs[w.id] = want; changed = true; }
  });
  if (changed || force) { gStockCache = null; save(); }
}
/* stock ledger of the tank warehouse: the same book movements as the tank cardex, on each tank's location */
function tkLedger(mv) {
  if (!TK || !tkStore) return;
  const KIND = { rec: "rec", use: "use", xf: "xfer", adj: "adj" };
  TK.forEach((t) => {
    const d = tkDef(t.id);
    if (!d || !d.whId || !d.loc || !whById(d.whId)) return;
    const R = tkKdxRows(t.sku, t.id), qs = R.mv.map((m) => Math.round(m.q));
    const base = { wh: d.whId, loc: d.loc, sku: t.sku, unit: "کیلوگرم" };
    /* the sample has 7 days of tank history; the balance before that is booked as an opening long enough ago for the stock charts */
    mv.push(Object.assign({ t: R.from - 150 * 86400000, q: Math.round(R.book) - sum(qs), kind: "open", ref: "موجودی اول دوره · " + t.id }, base));
    R.mv.forEach((m, i) => { if (qs[i]) mv.push(Object.assign({ t: m.at, q: qs[i], kind: KIND[m.kind], ref: m.ref || (m.kind === "use" ? "مصرف خودکار · " + t.id : t.id) }, base)); });
  });
}

/* ================= view: locations (مکان‌ها) =================
   A warehouse's locations form a tree of any depth (each code segment is one level: A → A/01 → A/01/1 …).
   Stock is kept only in the last layer (leaf locations); a parent shows the sum of its leaves.
   Locations have no capacity. Tanks are not locations: each tank is its own entity («تعریف مخازن»). */
const lc = { wh: 1, q: "", sel: null, open: {}, stocked: false };
const lcKey = (code) => lc.wh + "|" + code;
const lcIsQ = (code) => (code + "/").startsWith("Q/");
function lcTree(whId) {
  const held = {};
  gStock().filter((i) => i.whId === whId).forEach((it) => it.locs.forEach((l) => {
    if (l.qty > 0) (held[l.loc] = held[l.loc] || []).push({ item: it.item, sku: it.sku, unit: it.unit, qty: l.qty, qc: l.qc || 0, cnt: l.cnt || 0 });
  }));
  const root = { code: "", name: whById(whId).name, kids: [], depth: 0, parent: null }, byCode = { "": root };
  (state.locs[whId] || []).forEach((l) => {
    const seg = l.code.split("/");
    let parent = root;
    seg.forEach((s, i) => {
      const code = seg.slice(0, i + 1).join("/");
      let n = byCode[code];
      if (!n) { n = byCode[code] = { code, name: s, kids: [], depth: i + 1, parent }; parent.kids.push(n); }
      parent = n;
    });
  });
  const walk = (n) => {
    if (!n.kids.length) { n.leaf = true; n.items = held[n.code] || []; n.leaves = [n]; }
    else { n.kids.forEach(walk); n.leaves = n.kids.flatMap((k) => k.leaves); }
  };
  walk(root);
  return { root, byCode, all: Object.values(byCode).filter((n) => n !== root) };

/* stock of a node: its own items for a leaf, the sum over its leaf locations for a parent */
function lcStock(n) {
  if (n.leaf) return n.items.map((x) => Object.assign({ locs: 1 }, x));
  const m = {};
  n.leaves.forEach((lf) => lf.items.forEach((x) => {
    const k = x.sku + "|" + x.unit, o = m[k] || (m[k] = { item: x.item, sku: x.sku, unit: x.unit, qty: 0, qc: 0, cnt: 0, locs: 0 });
    o.qty += x.qty; o.qc += x.qc; o.cnt += x.cnt; o.locs++;

  return Object.values(m).sort((a, b) => a.item.localeCompare(b.item, "fa"));
}
const lcPath = (n) => { const p = []; for (let x = n; x; x = x.parent) p.unshift(x); return p; };
function lcMatch(n, q) {
  if (!q) return true;
  if (n.code.toLowerCase().includes(q)) return true;
  return n.leaves.some((lf) => lf.code.toLowerCase().includes(q) || lf.items.some((x) => x.item.toLowerCase().includes(q)));
}
function lcNodeHtml(n, q) {
  if (!lcMatch(n, q)) return "";
  if (lc.stocked && !n.leaves.some((lf) => lf.items.length)) return "";
  const open = !n.leaf && (q || lc.stocked || lc.open[lcKey(n.code)]), st = lcStock(n), hold = st.some((x) => x.cnt);
  const withStock = n.leaves.filter((lf) => lf.items.length).length;
  const sub = n.leaf
    ? (n.items.length ? fa(n.items.length) + " کالا" : "خالی")
    : fa(n.kids.length) + " زیرمکان · " + fa(n.leaves.length) + " مکان انتهایی" + (withStock ? " · " + fa(st.length) + " کالا" : "");
  return '<li class="lc-li">' +
    '<div class="lc-node' + (lc.sel === n.code ? " on" : "") + (n.leaf ? " leaf" : "") + '" style="--d:' + (n.depth - 1) + '">' +
      (n.leaf ? '<span class="lc-tog leaf" aria-hidden="true"></span>'
        : '<button type="button" class="lc-tog" data-lctog="' + esc(n.code) + '" aria-expanded="' + !!open + '" aria-label="' + (open ? "بستن " : "باز کردن ") + esc(n.code) + '">' + ico(open ? "left" : "left", "sm") + "</button>") +
      '<button type="button" class="lc-name" data-lcsel="' + esc(n.code) + '">' +
        '<span class="code">' + esc(n.leaf ? n.code : n.name) + "</span>" +
        (n.leaf ? '<span class="lc-kind leaf">انتهایی</span>' : "") +
        (n.leaf && tkAtLoc(lc.wh, n.code) ? '<span class="lc-kind tank">' + ico("tank", "sm") + esc(tkAtLoc(lc.wh, n.code).name) + "</span>" : "") +
        (lcIsQ(n.code) && n.depth === 1 ? '<span class="lc-kind quar">قرنطینه</span>' : "") +
        (hold ? '<span class="lc-kind cnt">در انبارگردانی</span>' : "") +
        '<small>' + sub + "</small></button></div>" +

  const st = lcStock(n), kv = (k, v) => '<div class="kv"><span>' + k + "</span><b>" + v + "</b></div>";
  const path = lcPath(n).map((x, i) => i === 0 ? '<span>' + esc(x.name) + "</span>" : '<button class="linkbtn" type="button" data-lcsel="' + esc(x.code) + '" dir="ltr">' + esc(x.name) + "</button>").join(ico("left", "sm"));
  return '<aside class="box lc-side"><div class="box-head"><h2 class="section-title"><span class="code">' + esc(n.code) + "</span></h2>" +
      (n.leaf ? '<span class="lc-kind leaf">مکان انتهایی</span>' : '<span class="lc-kind mid">مکان میانی</span>') + "</div>" +
    '<div class="lc-path">' + path + "</div>" +
    (n.leaf && tkAtLoc(lc.wh, n.code) ? tkLocTankHtml(tkAtLoc(lc.wh, n.code)) : "") + lcActsHtml(n, st) +
    '<p class="lc-what">' + (n.leaf && isTankWh(whById(lc.wh)) ? "موجودی این مکان موجودی دفتری مخزن است: با رسید تانکر زیاد و با مصرف تولید (از کاهش سطح)، انتقال و تعدیل کم یا زیاد می‌شود؛ اسکن PDA ندارد."
      : n.leaf ? "موجودی در همین مکان نگهداری می‌شود و با اسکن PDA در جایگذاری، برداشت و انبارگردانی تغییر می‌کند."
      : "این مکان موجودی ندارد؛ موجودی زیر، جمع " + fa(n.leaves.length) + " مکان انتهایی زیرمجموعهٔ آن است.") + "</p>" +
    '<div class="tk-kvs">' + kv("سطح در درخت", fa(n.depth)) + kv("زیرمکان مستقیم", n.leaf ? "ندارد" : fa(n.kids.length)) +
      kv("مکان انتهایی", fa(n.leaves.length)) + kv("کالا", st.length ? fa(st.length) : "—") + "</div>" +
    (n.leaf ? "" : '<div class="lc-kids"><span>زیرمکان‌ها</span><div>' + n.kids.map((k) => '<button type="button" class="lc-chip" data-lcsel="' + esc(k.code) + '"><span class="code">' + esc(k.name) + "</span>" +
      (k.leaf ? "" : "<small>" + fa(k.leaves.length) + "</small>") + "</button>").join("") + "</div></div>") +
    (st.length ? '<div class="tk-tbl"><table><thead><tr><th>کالا</th><th class="num">مقدار</th>' + (n.leaf ? "" : '<th class="num">در مکان</th>') + "</tr></thead><tbody>" + st.map((x) =>
        "<tr><td>" + esc(x.item) + (x.qc ? '<span class="sub t-warn">' + fa(x.qc) + " در قرنطینهٔ کنترل کیفی</span>" : "") + (x.cnt ? '<span class="sub t-warn">نگه‌داشته برای انبارگردانی</span>' : "") +
        '</td><td class="num">' + fa(x.qty) + " " + esc(x.unit) + "</td>" + (n.leaf ? "" : '<td class="num">' + fa(x.locs) + "</td>") + "</tr>").join("") + "</tbody></table></div>"
      : '<div class="col-empty">' + (n.leaf ? "این مکان خالی است." : "هیچ‌کدام از مکان‌های انتهایی زیرمجموعه موجودی ندارند.") + "</div>") +
  "</aside>";
}
function lcRule() {
  return '<div class="lc-diff"><b>منطق مکان‌ها</b><ul>' +
    "<li>مکان‌ها درختی و تو در تو هستند و تعداد سطح‌ها محدودیت ندارد.</li>" +
    "<li>موجودی فقط در آخرین لایه (مکان انتهایی) نگهداری می‌شود؛ مکان‌های بالاتر جمع زیرمجموعه را نشان می‌دهند.</li>" +
    "<li>مکان‌ها ظرفیت ندارند.</li>" +
    "<li>در «انبار مخزنی» هر مکان انتهایی یک مخزن است و موجودی‌اش همان‌جا ثبت می‌شود. فرم مکان در این انبار بخش «مشخصات مخزن» (سطح‌سنج، کالیبراسیون، چگالی، حدها) را هم دارد؛ مکان‌های انبار عادی همچنان ساده و بدون ظرفیت می‌مانند.</li></ul></div>";
}
function renderLocations() {
  if (!whById(lc.wh)) lc.wh = state.warehouses[0].id;
  const T = lcTree(lc.wh), q = lc.q.trim().toLowerCase();
  if (lc.sel && !T.byCode[lc.sel]) lc.sel = null;
  /* first level open by default */
  T.root.kids.forEach((k) => { if (!(lcKey(k.code) in lc.open)) lc.open[lcKey(k.code)] = true; });
  const leaves = T.root.leaves, depth = Math.max(0, ...leaves.map((x) => x.depth)), tree = T.root.kids.map((k) => lcNodeHtml(k, q)).join("");
  $("#view").innerHTML =
    '<div class="view-stack">' +
    '<div class="head"><div><div class="crumbs">پیکربندی ' + ico("left", "sm") + " مکان‌ها</div><h1>مکان‌ها</h1>" +
      "<p>مکان‌های هر انبار به‌صورت درختی و تو در تو تعریف می‌شوند و موجودی فقط در آخرین لایه نگهداری می‌شود. مکان‌ها ظرفیت ندارند. در انبار مخزنی هر مکان انتهایی یک مخزن است و مشخصات مخزن همین‌جا، روی همان مکان، تعریف می‌شود.</p></div>" +
      '<div class="head-actions">' + (isTankWh(whById(lc.wh))
        ? '<button class="btn primary" type="button" data-tkd="tank-new">' + ico("plus", "sm") + "تعریف مخزن (مکان جدید)</button>"
        : '<button class="btn primary" type="button" data-lca="loc-new">' + ico("plus", "sm") + "تعریف مکان</button>") + "</div></div>" +
    '<div class="summary">' + [
      ["کل مکان‌ها", fa(T.all.length), "pin", ""],
      ["مکان انتهایی", fa(leaves.length) + '<small class="tk-u">نگهدارندهٔ موجودی</small>', "box", ""],
      ["دارای موجودی", fa(leaves.filter((x) => x.items.length).length) + '<small class="tk-u">از ' + fa(leaves.length) + "</small>", "check", "ok"],
      ["عمق درخت", fa(depth) + '<small class="tk-u">سطح</small>', "layers", ""]
    ].map(([k, v, ic, tone]) => '<div class="sum"><span>' + k + "</span><b>" + v + '</b><i class="ic ' + tone + '">' + ico(ic) + "</i></div>").join("") + "</div>" +
    (tkF.form && tkF.ctx === "loc" ? '<section class="box tk-cfgform" id="lc-form">' + tkTankForm() + "</section>" : lcF.form ? lcFormHtml() : "") +
    '<div class="toolbar">' +
      '<select class="select" id="lc-wh" aria-label="انبار">' + state.warehouses.map((w) => '<option value="' + w.id + '"' + (w.id === lc.wh ? " selected" : "") + ">" + esc(w.name) + " · " + esc(w.code) + "</option>").join("") + "</select>" +
      '<div class="field-inline">' + ico("search", "sm") + '<input class="input" id="lc-q" type="search" placeholder="جست‌وجو در کد مکان یا نام کالا" aria-label="جست‌وجوی مکان" value="' + esc(lc.q) + '"></div>' +
      '<label class="tk-chk"><input type="checkbox" id="lc-stocked"' + (lc.stocked ? " checked" : "") + ">فقط مکان‌های دارای موجودی</label>" +
      '<div class="lc-tools"><button class="btn sm ghost" type="button" data-lca="open-all">باز کردن همه</button><button class="btn sm ghost" type="button" data-lca="close-all">بستن همه</button></div>' +
    "</div>" +
    '<div class="lc-layout"><section class="box lc-treebox"><div class="box-head"><h2 class="section-title">' + ico("layers", "sm") + esc(whById(lc.wh).name) + "</h2>" +
        '<span class="tk-u">' + ico("info", "sm") + " موجودی فقط در مکان‌های انتهایی</span></div>" +
      (tree ? '<ul class="lc-ul lc-root">' + tree + "</ul>" : '<div class="empty">' + ico(T.all.length ? "search" : "pin") + (T.all.length ? "مکانی با این فیلترها پیدا نشد." : isTankWh(whById(lc.wh)) ? "هنوز مخزنی در این انبار تعریف نشده است." : "هنوز مکانی تعریف نشده است.") + "</div>") +
    "</section>" + lcDetail(T) + "</div></div>";
}
document.addEventListener("click", (e) => {
  if (ui.view !== "locations") return;
  const tg = e.target.closest("[data-lctog]");
  if (tg) { const k = lcKey(tg.dataset.lctog); lc.open[k] = !lc.open[k]; renderLocations(); return; }
  const s = e.target.closest("[data-lcsel]");
  if (s) {
    const code = s.dataset.lcsel, T = lcTree(lc.wh);
    lc.sel = code;
    for (let x = T.byCode[code] && T.byCode[code].parent; x && x.code; x = x.parent) lc.open[lcKey(x.code)] = true;   /* reveal it in the tree */
    renderLocations();
    if (innerWidth < 1180) { const a = document.querySelector(".lc-side"); if (a) a.scrollIntoView({ block: "start", behavior: "smooth" }); }
    return;
  }
  const b = e.target.closest("[data-lca]");
  if (!b) return;
  if (b.dataset.lca === "open-all" || b.dataset.lca === "close-all") {
    const on = b.dataset.lca === "open-all";
    lcTree(lc.wh).all.forEach((n) => { if (!n.leaf) lc.open[lcKey(n.code)] = on; });
    renderLocations();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "lc-q") return;
  lc.q = e.target.value; renderLocations();
  const el = $("#lc-q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "lc-wh") { lc.wh = +e.target.value; lc.sel = null; lcF.form = null; if (tkF.ctx === "loc") { tkF.form = null; tkF.err = {}; } renderLocations(); }
  if (e.target.id === "lc-stocked") { lc.stocked = e.target.checked; renderLocations(); }
});

load();
if (["#receipts", "#deliveries", "#counts", "#dashboard", "#warehouses", "#system", "#qc", "#qccfg", "#tanks", "#devices", "#locations", "#tankcfg", "#whtypes", "#invstock", "#invrules"].includes(location.hash)) ui.view = location.hash.slice(1);
$("#me-name").textContent = ME;
$("#me-av").textContent = ME.trim().charAt(0);
render();
</script>
