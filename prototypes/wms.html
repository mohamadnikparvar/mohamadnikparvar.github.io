<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سیستم مدیریت انبار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Design system "انبار": Fluent 2 structure and icons, with Ant Design 5 / Material 3 softness —
   rounded controls, soft elevation, light glass surfaces and restrained gradients.
   Every color is a token so light, dark and the in-app theme switch stay in sync. */
:root {
  /* neutrals */
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;   /* table header, subtle fills */
  --surface-3: #F1F4F9;   /* tracks, columns, segmented track */
  --hover: #F5F8FF;       /* row / item hover (tinted toward brand) */
  --pressed: #EBF1FF;
  --selected: #EEF4FF;
  --line: #EEF1F6;        /* split lines inside cards & tables */
  --line-strong: #DDE2EA; /* control borders */
  --line-access: #B8C0CC;
  --fg: #1D2433;
  --fg-2: #3D4656;
  --muted: #667085;
  --disabled: #B6BDC8;
  --focus: #1677FF;
  /* brand (Ant Design blue) */
  --accent: #1677FF;
  --accent-hover: #4096FF;
  --accent-pressed: #0958D9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6F4FF;
  --accent-line: #91CAFF;
  --accent-bg: #1677FF; --accent-bg-hover: #4096FF; --accent-bg-pressed: #0958D9;
  --grad: linear-gradient(135deg, #1677FF 0%, #4F6BFF 100%);
  --grad-hover: linear-gradient(135deg, #4096FF 0%, #6B82FF 100%);
  --grad-soft: linear-gradient(135deg, rgba(22, 119, 255, .10), rgba(124, 92, 255, .08));
  --ring: 0 0 0 3px rgba(22, 119, 255, .14);
  /* status (Ant Design) */
  --ok: #389E0D;   --ok-soft: #F6FFED;   --ok-line: #B7EB8F;
  --warn: #D46B08; --warn-soft: #FFF7E6; --warn-line: #FFD591;
  --bad: #CF1322;  --bad-soft: #FFF1F0;  --bad-line: #FFA39E;
  --info: #722ED1; --info-soft: #F9F0FF; --info-line: #D3ADF7;
  --bad-bg: #FF4D4F;
  /* glass */
  --glass: rgba(255, 255, 255, .72);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-line: rgba(255, 255, 255, .7);
  --page-glow: radial-gradient(1100px 560px at 100% -8%, rgba(22, 119, 255, .14), transparent 60%),
               radial-gradient(900px 520px at -5% 4%, rgba(124, 92, 255, .11), transparent 60%),
               radial-gradient(700px 500px at 60% 45%, rgba(64, 150, 255, .05), transparent 65%),
               radial-gradient(900px 640px at 35% 108%, rgba(19, 194, 194, .10), transparent 60%);
  /* elevation */
  --scrim: rgba(15, 23, 42, .35);
  --e1: 0 1px 2px rgba(16, 24, 40, .05);
  --e4: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .05);
  --e2: 0 6px 20px rgba(16, 24, 40, .08), 0 2px 6px rgba(16, 24, 40, .05);
  --e16: 0 12px 32px rgba(16, 24, 40, .12), 0 2px 8px rgba(16, 24, 40, .06);
  --e3: 0 24px 64px rgba(16, 24, 40, .18), 0 4px 16px rgba(16, 24, 40, .08);
  --e-btn: 0 2px 0 rgba(5, 145, 255, .10), 0 4px 12px rgba(22, 119, 255, .22);
  --shadow: var(--e3);
  /* charts — Fluent data-viz colors, order checked for colour-blind separation */
  --s1: #637CEF; --s2: #E3008C; --mark-neutral: #C9D0DA;
  --c1: #637CEF; --c2: #E3008C; --c3: #3A96DD; --c4: #13A10E; --c5: #9373C0; --c6: #CA5010; --c7: #2AA0A4;

  /* type — Vazirmatn, the standard open Persian UI face */
  --font-display: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  --font-body: var(--font-display);
  --font-code: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --fs-2xs: .6875rem; --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .875rem; --fs-lg: 1rem; --fs-xl: 1.25rem; --fs-2xl: 1.5rem; --fs-3xl: 1.75rem;
  --fw-regular: 400; --fw-semibold: 600; --fw-bold: 700;
  /* 4-pt spacing */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  /* radius: xs 6 · sm 10 (controls) · md 14 (cards) · lg 18 (blocks, dialogs) */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-pill: 999px;
  --h-ctl: 38px; --h-ctl-sm: 30px;
  --ease: cubic-bezier(.2, .7, .2, 1); --decel: cubic-bezier(0, 0, .2, 1); --t-fast: .15s; --t-med: .25s;
  --nav-w: 264px; --topbar-h: 64px; --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117; --surface: #171B23; --surface-2: #1B2029; --surface-3: #212733; --hover: #1E2738; --pressed: #22304A; --selected: #1C2A44;
    --line: #232A35; --line-strong: #333B49; --line-access: #4A5363; --fg: #E8EBF0; --fg-2: #C5CBD5; --muted: #98A2B3; --disabled: #4E5665; --focus: #4096FF;
    --accent: #4096FF; --accent-hover: #69B1FF; --accent-pressed: #1677FF; --accent-ink: #FFFFFF; --accent-soft: #111D33; --accent-line: #15417E;
    --accent-bg: #1668DC; --accent-bg-hover: #3C89E8; --accent-bg-pressed: #1554AD;
    --grad: linear-gradient(135deg, #1668DC 0%, #5465E8 100%); --grad-hover: linear-gradient(135deg, #3C89E8 0%, #6E7EF0 100%);
    --grad-soft: linear-gradient(135deg, rgba(64, 150, 255, .14), rgba(124, 92, 255, .10)); --ring: 0 0 0 3px rgba(64, 150, 255, .22);
    --ok: #6ABE39; --ok-soft: #162312; --ok-line: #274916; --warn: #E89A3C; --warn-soft: #2B1D11; --warn-line: #593815;
    --bad: #E86E6B; --bad-soft: #2C1618; --bad-line: #5B2526; --info: #AB7AE0; --info-soft: #1A1325; --info-line: #3E2069; --bad-bg: #D32029;
    --glass: rgba(23, 27, 35, .66); --glass-strong: rgba(23, 27, 35, .84); --glass-line: rgba(255, 255, 255, .06);
    --page-glow: radial-gradient(1100px 520px at 100% -8%, rgba(64, 150, 255, .12), transparent 60%), radial-gradient(900px 480px at -5% 4%, rgba(124, 92, 255, .10), transparent 60%), radial-gradient(900px 640px at 35% 108%, rgba(19, 194, 194, .06), transparent 60%);
    --scrim: rgba(0, 0, 0, .55);
    --e1: 0 1px 2px rgba(0, 0, 0, .3); --e4: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    --e2: 0 8px 24px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3); --e16: 0 12px 32px rgba(0, 0, 0, .5);
    --e3: 0 24px 64px rgba(0, 0, 0, .6); --e-btn: 0 4px 14px rgba(22, 104, 220, .35);
    --mark-neutral: #4E5665;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #171B23; --surface-2: #1B2029; --surface-3: #212733; --hover: #1E2738; --pressed: #22304A; --selected: #1C2A44;
  --line: #232A35; --line-strong: #333B49; --line-access: #4A5363; --fg: #E8EBF0; --fg-2: #C5CBD5; --muted: #98A2B3; --disabled: #4E5665; --focus: #4096FF;
  --accent: #4096FF; --accent-hover: #69B1FF; --accent-pressed: #1677FF; --accent-ink: #FFFFFF; --accent-soft: #111D33; --accent-line: #15417E;
  --accent-bg: #1668DC; --accent-bg-hover: #3C89E8; --accent-bg-pressed: #1554AD;
  --grad: linear-gradient(135deg, #1668DC 0%, #5465E8 100%); --grad-hover: linear-gradient(135deg, #3C89E8 0%, #6E7EF0 100%);
  --grad-soft: linear-gradient(135deg, rgba(64, 150, 255, .14), rgba(124, 92, 255, .10)); --ring: 0 0 0 3px rgba(64, 150, 255, .22);
  --ok: #6ABE39; --ok-soft: #162312; --ok-line: #274916; --warn: #E89A3C; --warn-soft: #2B1D11; --warn-line: #593815;
  --bad: #E86E6B; --bad-soft: #2C1618; --bad-line: #5B2526; --info: #AB7AE0; --info-soft: #1A1325; --info-line: #3E2069; --bad-bg: #D32029;
  --glass: rgba(23, 27, 35, .66); --glass-strong: rgba(23, 27, 35, .84); --glass-line: rgba(255, 255, 255, .06);
  --page-glow: radial-gradient(1100px 520px at 100% -8%, rgba(64, 150, 255, .12), transparent 60%), radial-gradient(900px 480px at -5% 4%, rgba(124, 92, 255, .10), transparent 60%), radial-gradient(900px 640px at 35% 108%, rgba(19, 194, 194, .06), transparent 60%);
  --scrim: rgba(0, 0, 0, .55);
  --e1: 0 1px 2px rgba(0, 0, 0, .3); --e4: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  --e2: 0 8px 24px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .3); --e16: 0 12px 32px rgba(0, 0, 0, .5);
  --e3: 0 24px 64px rgba(0, 0, 0, .6); --e-btn: 0 4px 14px rgba(22, 104, 220, .35);
  --mark-neutral: #4E5665;
  color-scheme: dark;
}
@media (pointer: coarse) { :root { --h-ctl: 44px; --h-ctl-sm: 36px; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--page-glow), var(--bg); background-attachment: fixed; color: var(--fg);
  font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.7;
  direction: rtl; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring), 0 0 0 1px var(--accent); border-radius: var(--r-sm); }
::selection { background: var(--accent-soft); }
.code { font-family: var(--font-code); font-size: .82em; direction: ltr; unicode-bidi: isolate; white-space: nowrap; letter-spacing: .01em; }
.muted { color: var(--muted); }
.i { width: 20px; height: 20px; flex: none; fill: currentColor; }
.i.sm { width: 16px; height: 16px; }
.i.lg { width: 24px; height: 24px; }
kbd { font-family: var(--font-code); font-size: var(--fs-2xs); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; padding: 0 5px; color: var(--muted); background: var(--surface); line-height: 1.6; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }

/* glass sidebar */
.nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border-inline-end: 1px solid var(--line);
  padding-block: max(18px, env(safe-area-inset-top, 0px)) 14px; padding-inline: 14px;
  display: flex; flex-direction: column; gap: var(--sp-5);
}
.brand { display: flex; align-items: center; gap: 12px; padding-inline: 6px; min-height: 44px; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  background: var(--grad); color: #FFFFFF; display: grid; place-items: center; box-shadow: var(--e-btn);
}
.brand b { font-size: var(--fs-lg); font-weight: var(--fw-bold); display: block; line-height: 1.4; }
.brand small { color: var(--muted); font-size: var(--fs-xs); }
.nav-groups { display: flex; flex-direction: column; gap: var(--sp-4); flex: 1; }
.nav-group { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: var(--fs-xs); color: var(--muted); padding-inline: 12px; margin-bottom: 2px; font-weight: var(--fw-semibold); }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px;
  padding: 0 12px; border-radius: var(--r-sm); color: var(--fg-2); font-size: var(--fs-md); font-weight: 500;
  border: 0; background: none; text-align: start; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.nav-item .lbl { flex: 1; }
.nav-item .i { color: var(--muted); transition: color var(--t-fast) var(--ease); }
button.nav-item { cursor: pointer; }
button.nav-item:hover { background: var(--hover); color: var(--fg); }
button.nav-item:hover .i { color: var(--accent); }
.nav-item.on { background: var(--grad-soft); color: var(--accent); font-weight: var(--fw-semibold); box-shadow: inset 0 0 0 1px rgba(22, 119, 255, .10); }
.nav-item.on .i { color: var(--accent); }
.nav-item.on::before { content: ""; position: absolute; inset-inline-start: -14px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--grad); }
.nav-item.dis { color: var(--disabled); }
.nav-item.dis .i { color: var(--disabled); }
.nav-item .soon { font-size: var(--fs-2xs); color: var(--muted); background: var(--surface-3); border-radius: var(--r-pill); padding: 0 8px; line-height: 20px; }
.nav-item .count { font-size: var(--fs-2xs); background: var(--grad); color: #FFFFFF; border-radius: var(--r-pill); padding: 0 7px; min-width: 22px; height: 22px; line-height: 22px; text-align: center; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; box-shadow: var(--e-btn); }
.nav-item .count:empty { display: none; }
.nav-foot { padding: 12px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--e4); }
.user { display: flex; gap: 10px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--grad); color: #FFFFFF; display: grid; place-items: center; font-weight: var(--fw-bold); flex: none; }
.user b { display: block; font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: 1.5; }
.user small { color: var(--muted); font-size: var(--fs-xs); }

.main-col { min-width: 0; display: flex; flex-direction: column; }
/* glass app header */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; min-height: var(--topbar-h);
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border-bottom: 1px solid var(--line);
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 12px;
}
.tb-brand { display: none; align-items: center; gap: 8px; }
.tb-brand .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
.searchbtn {
  display: flex; align-items: center; gap: 10px; width: min(460px, 100%); height: 40px;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-pill);
  padding: 0 16px; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; box-shadow: var(--e1);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.searchbtn:hover { border-color: var(--accent-line); box-shadow: var(--e2); }
.searchbtn span { flex: 1; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-end { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-2); }
.iconbtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--fg-2); cursor: pointer; }
.iconbtn:hover { background: var(--hover); color: var(--accent); }
.theme-seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: var(--r-pill); background: var(--surface-3); }
.theme-seg button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.theme-seg button:hover { color: var(--fg); }
.theme-seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--e4); }

.main {
  flex: 1; padding-block: var(--sp-6) 56px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.main-inner { max-width: 1600px; margin-inline: auto; display: flex; flex-direction: column; gap: var(--sp-6); }
.view-stack { display: flex; flex-direction: column; gap: var(--sp-6); }

.tabbar { display: none; }
.mnav { display: none !important; }

/* ---------- page header ---------- */
.crumbs { font-size: var(--fs-xs); color: var(--muted); display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.crumbs .linkbtn { font-size: inherit; display: inline-flex; align-items: center; gap: 2px; }
.head, .dash-head { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: flex-end; justify-content: space-between; }
.head h1, .dash-head h1 { font-size: var(--fs-3xl); font-weight: var(--fw-bold); margin: 6px 0 0; line-height: 1.35; text-wrap: balance; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.head p, .dash-head p { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-sm); max-width: 72ch; }
.head-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--h-ctl);
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); color: var(--fg);
  padding: 0 18px; cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-semibold); white-space: nowrap;
  box-shadow: var(--e1);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:hover { border-color: var(--accent-line); color: var(--accent); box-shadow: var(--e2); transform: translateY(-1px); }
.btn:active { transform: none; box-shadow: var(--e1); background: var(--pressed); }
.btn.primary { background: var(--grad); border-color: transparent; color: #FFFFFF; box-shadow: var(--e-btn); }
.btn.primary:hover { background: var(--grad-hover); color: #FFFFFF; box-shadow: 0 8px 22px rgba(22, 119, 255, .32); }
.btn.primary:active { background: var(--accent-bg-pressed); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.btn.danger.solid { background: var(--bad-bg); border-color: transparent; color: #FFFFFF; box-shadow: 0 4px 12px rgba(255, 77, 79, .28); }
.btn.danger.solid:hover { filter: brightness(1.06); color: #FFFFFF; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); transform: none; box-shadow: none; }
.btn.sm { min-height: var(--h-ctl-sm); padding: 0 12px; font-size: var(--fs-xs); border-radius: 8px; gap: 6px; }
.btn.demo { border-style: dashed; border-color: var(--info-line); color: var(--info); background: var(--info-soft); box-shadow: none; }
.btn.demo:hover { border-color: var(--info); color: var(--info); }
.btn:disabled { background: var(--surface-3); border-color: var(--line); color: var(--disabled); cursor: not-allowed; box-shadow: none; transform: none; }
.btn.icon { padding: 0; width: var(--h-ctl); border-radius: 50%; }
.btn.sm.icon { width: var(--h-ctl-sm); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: inherit; font-weight: 500; transition: color var(--t-fast) var(--ease); }
.linkbtn:hover { color: var(--accent-hover); }

/* ---------- stat cards ---------- */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); }
.sum {
  position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e4);
  padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 14px;
  transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease);
}
.sum:hover { box-shadow: var(--e2); transform: translateY(-2px); }
.sum span { color: var(--muted); font-size: var(--fs-xs); font-weight: 500; grid-column: 1; }
.sum b { font-size: var(--fs-2xl); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; grid-column: 1; line-height: 1.3; }
.sum .ic { grid-column: 2; grid-row: 1 / span 2; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--grad-soft); color: var(--accent); }
.sum .ic.ok { background: var(--ok-soft); color: var(--ok); } .sum .ic.warn { background: var(--warn-soft); color: var(--warn); }
.sum .ic.bad { background: var(--bad-soft); color: var(--bad); } .sum .ic.off { background: var(--surface-3); color: var(--muted); }

/* ---------- inputs (Ant style: soft border, brand ring on focus) ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e4); }

/* Segmented (Ant Design): soft track, raised selected thumb */

.seg button.on { background: var(--surface); color: var(--accent); font-weight: var(--fw-semibold); box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 2px 6px rgba(16, 24, 40, .06); }
.sample-note { margin-inline-start: auto; font-size: var(--fs-xs); color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* ---------- tables: airy rows, soft header, no heavy rules ---------- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-x: auto; box-shadow: var(--e4); }

tbody tr:hover { background: var(--hover); }

/* ---------- badges (soft, no border) ---------- */

/* ---------- side sheet ---------- */

/* tabs: rounded ink bar, brand text when selected */

.tab {
  position: relative; border: 0; background: none; padding: 10px 14px 12px; cursor: pointer; font-size: var(--fs-sm); font-weight: 500;
  color: var(--muted); border-radius: var(--r-sm) var(--r-sm) 0 0; transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);

.notice::before { content: ""; position: absolute; inset-inline-start: 14px; top: 14px; width: 20px; height: 20px; background: currentColor; color: var(--accent); -webkit-mask: var(--mi-info) center / contain no-repeat; mask: var(--mi-info) center / contain no-repeat; }

.board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; scroll-snap-type: x proximity; }

}

}

.att { display: inline-flex; align-items: center; gap: 2px; }

.qc-files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.qc-file { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.qc-file img, .qc-file .fi { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }

.qc-pick { margin-top: 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); font-size: var(--fs-xs); white-space: normal; }
.task-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; flex-wrap: wrap; }

.outs div { display: flex; justify-content: space-between; gap: 8px; }
.outs .o-put b { color: var(--ok); }
.outs .o-ret b, .outs .o-scrap b, .outs .o-cancel b { color: var(--bad); }

/* unit split: one item card holds a block per unit; the "done" card shows a unit × outcome matrix */
.ublock { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.ub-h { position: relative; display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); }
.ub-h > b { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-size: var(--fs-sm); font-weight: var(--fw-bold); }
.uchip { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-semibold); white-space: nowrap; }
.ublock.drag { cursor: grab; }
.ublock.drag:active { cursor: grabbing; }
.ublock.drag .ub-h { padding-inline-end: 22px; }
.ublock.drag:hover { border-color: var(--accent-line); box-shadow: var(--e1); }
.ublock.drag:hover .grip { color: var(--accent); }
.ublock.dragging { opacity: .45; box-shadow: var(--e16); }
.u-split { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-xs); padding: 8px 10px; border-radius: var(--r-sm); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.u-split > .i { flex: none; color: var(--accent); margin-top: 2px; }
.u-split b { display: block; color: var(--accent); font-weight: var(--fw-semibold); }
.u-split span { display: block; }
.u-split small { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.umx-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
.umx { width: 100%; min-width: 0; border-collapse: collapse; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.umx th, .umx td { position: static; padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); font-size: var(--fs-xs); background: none; }
.umx tbody tr:hover { background: none; }
.umx thead th { background: var(--surface-2); color: var(--fg-2); font-weight: var(--fw-semibold); line-height: 1.4; vertical-align: bottom; white-space: normal; }
.umx tbody th, .umx tfoot th { text-align: start; font-weight: var(--fw-regular); color: var(--muted); white-space: nowrap; }
.umx tbody tr:last-child td, .umx tbody tr:last-child th { border-bottom: 1px solid var(--line); }
.umx td.o-put { color: var(--ok); font-weight: var(--fw-bold); }
.umx td.o-ret, .umx td.o-scrap, .umx td.o-cancel { color: var(--bad); font-weight: var(--fw-bold); }
.umx td.z { color: var(--disabled); }
.umx tr.route td { color: var(--info); font-weight: var(--fw-semibold); }
.umx tfoot th, .umx tfoot td { border-bottom: 0; color: var(--fg); font-weight: var(--fw-bold); background: var(--surface-2); }
.umx-det { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-xs); color: var(--muted); }
.umx-det b { color: var(--fg-2); font-weight: var(--fw-semibold); }
.split-prev { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); }
.split-prev .move-path { padding: 0; background: none; }
.split-prev small { color: var(--muted); font-size: var(--fs-xs); text-align: center; }

/* delivery (تحویل کالا): pick results wait for review, picked lots list their cells */
.task.ready { border-color: var(--accent-line); background: var(--accent-soft); }
.g-stock { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--fs-xs); color: var(--muted); }
.g-stock b { color: var(--fg); font-variant-numeric: tabular-nums; }
.g-stock .linkbtn { margin-inline-start: auto; font-size: var(--fs-xs); }
.g-locs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.g-locs li { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-xs); }
.g-locs b { font-variant-numeric: tabular-nums; font-weight: var(--fw-semibold); }
.g-short { display: flex; align-items: center; gap: 4px; color: var(--warn); font-weight: var(--fw-semibold); }
.g-det { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); }
.g-det li { display: flex; gap: 6px; align-items: flex-start; }
.g-det .i { flex: none; color: var(--ok); margin-top: 2px; }
.g-det small { display: block; color: var(--muted); }
.outs .o-side b { color: var(--warn); }
.umx tr.side td { color: var(--warn); font-weight: var(--fw-semibold); }
.g-avail { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); }
.g-avail .lbl, .dlg-body > .lbl { font-size: var(--fs-xs); color: var(--muted); }
.pick-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 32px; gap: 10px; align-items: end; }
.rv-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rv-sum div { padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.rv-sum span { font-size: var(--fs-xs); color: var(--muted); }
.rv-sum b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
.rv-sum .short { background: var(--warn-soft); }
.rv-sum .short b { color: var(--warn); }
.rv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rv-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: var(--fs-sm); }
.rv-list label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.rv-rest { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--warn-line); background: var(--warn-soft); }
.rv-rest > b { color: var(--warn); font-size: var(--fs-sm); }
.side-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sub.t-warn { color: var(--warn); }
.sub.t-info { color: var(--accent); }
.more-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
/* receipt redesign (رسید کالا): every rule is rx- prefixed, so the other sections keep their look */
.rx-sum { font: inherit; color: inherit; text-align: start; cursor: pointer; }
.rx-sum.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--e4); }
.rx-chip { display: inline-flex; align-items: center; gap: 8px; min-height: var(--h-ctl); padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface); font: inherit; font-size: var(--fs-sm); cursor: pointer; color: var(--fg-2); transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.rx-chip:hover { border-color: var(--warn-line); }
.rx-chip b { font-variant-numeric: tabular-nums; background: var(--warn-soft); color: var(--warn); border-radius: var(--r-pill); padding: 0 8px; font-size: var(--fs-xs); }
.rx-chip[aria-pressed="true"] { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: var(--fw-semibold); }
.rx-chip[aria-pressed="true"] b { background: var(--surface); }
.rx-track { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.rx-st { display: inline-flex; gap: 5px; align-items: center; font-size: var(--fs-2xs); padding: 1px 8px; border-radius: var(--r-pill); background: var(--surface-3); color: var(--muted); }
.rx-st.on { background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-semibold); }
.rx-st.held { background: var(--warn-soft); color: var(--warn); font-weight: var(--fw-semibold); }
.rx-st.past { background: var(--ok-soft); color: var(--ok); }
.rx-st.side { background: transparent; border: 1px dashed var(--accent-line); color: var(--accent); }
.rx-st b { font-variant-numeric: tabular-nums; }
.rx-st .i { width: 12px; height: 12px; }
.rx-ar { color: var(--disabled); font-size: .7rem; font-style: normal; }
.rx-next { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap; }
.rx-next.decide { color: var(--warn); }
.rx-next.send { color: var(--accent); }
.rx-next.pda, .rx-next.qc, .rx-next.none { color: var(--muted); font-weight: 500; }
.rx-next + .sub { white-space: nowrap; }
tr.rx-att > td:first-child { box-shadow: inset -3px 0 0 var(--warn); }
.rcard .rx-next { white-space: normal; padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.rcard .rx-next.decide { background: var(--warn-soft); }
.rcard .rx-next.send { background: var(--accent-soft); }
.rcard .rx-next + .sub { display: block; margin-top: 4px; font-size: var(--fs-xs); color: var(--muted); }
.rx-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 36px; }
.rx-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; align-content: start; }
.rx-more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; }
.rx-more summary { cursor: pointer; font-size: var(--fs-xs); color: var(--accent); font-weight: var(--fw-semibold); list-style: none; display: inline-flex; gap: 4px; align-items: center; }
.rx-more summary::-webkit-details-marker { display: none; }
.rx-more summary .i { transition: transform var(--t-fast) var(--ease); }
.rx-more[open] summary .i { transform: rotate(-90deg); }
.rx-more[open] summary { margin-bottom: 14px; }
.rx-items { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rx-items-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.rx-items-h b { font-size: var(--fs-sm); color: var(--fg); }
.rx-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: var(--fs-xs); color: var(--muted); }
.rx-item b { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--fg); }
.rx-item span { font-variant-numeric: tabular-nums; white-space: nowrap; }
.rx-bar { grid-column: 1 / -1; display: flex; gap: 2px; height: 8px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-3); }
.rx-bar i { display: block; height: 100%; min-width: 3px; }
.rx-bar .b-put, .rx-legend .b-put { background: var(--ok); }
.rx-bar .b-in, .rx-legend .b-in { background: var(--accent); }
.rx-bar .b-held, .rx-legend .b-held { background: var(--warn); }
.rx-bar .b-out, .rx-legend .b-out { background: var(--disabled); }
.rx-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-2xs); color: var(--muted); }
.rx-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-inline-end: 5px; }
.rx-total { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
.rx-total span { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.rx-todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rx-todo li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-size: var(--fs-sm); }
.rx-todo li.decide { border-color: var(--warn-line); background: var(--warn-soft); }
.rx-todo li.send { border-color: var(--accent-line); background: var(--accent-soft); }
.rx-todo li > .i { flex: none; color: var(--muted); }
.rx-todo li.decide > .i { color: var(--warn); }
.rx-todo li.send > .i { color: var(--accent); }
.rx-todo li > span { flex: 1 1 260px; min-width: 0; }
.rx-todo small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.rx-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rx-acts > span { font-size: var(--fs-xs); color: var(--muted); }
.rx-acts .btn.sm { min-height: 28px; padding: 0 10px; font-size: var(--fs-xs); border: 1px solid var(--line-strong); background: var(--surface); box-shadow: none; }
.rx-acts .btn.sm:hover { border-color: var(--accent-line); color: var(--accent); }
.rx-tbl th, .rx-tbl td { padding-inline: 10px; }
.rx-tbl td:first-child .sub { white-space: nowrap; }
.rx-tbl td.w { min-width: 124px; }
.rx-tbl .rx-next { white-space: normal; min-width: 132px; }
.rx-tbl .rx-next + .sub { white-space: normal; }
.rx-tbl .prog { min-width: 96px; align-items: flex-start; }
.rx-tbl .prog .bar { align-self: stretch; }
.rx-tbl .rc-owners .avatar { width: 30px; height: 30px; }
.rx-menu summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r-pill); padding: 2px 12px; transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.rx-menu summary::-webkit-details-marker { display: none; }
.rx-menu summary:hover, .rx-menu[open] summary { color: var(--accent); border-color: var(--accent-line); }
.rx-menu summary .i { transition: transform var(--t-fast) var(--ease); }
.rx-menu[open] summary .i { transform: rotate(-90deg); }
.rx-menu[open] summary { margin-bottom: 8px; }
.rx-step { cursor: pointer; }
.rx-step:hover b { color: var(--accent); }
.rx-colbtn { align-self: stretch; justify-content: center; }
.col.rx-flash, .box.rx-flash { animation: rx-flash 1.2s var(--ease); }
@keyframes rx-flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent-line); } 100% { box-shadow: 0 0 0 0 transparent; } }
.rx-logmore { align-self: flex-start; }
@media (max-width: 900px) { .rx-top { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .rx-facts { grid-template-columns: minmax(0, 1fr); } }

/* stocktaking (انبارگردانی) */
tr[data-kid], tr[data-kwh] { cursor: pointer; }
.k-crew { display: inline-flex; align-items: center; min-width: 0; }
.k-crew .avatar { width: 26px; height: 26px; font-size: var(--fs-xs); color: #FFFFFF; border: 2px solid var(--surface); margin-inline-start: -8px; }
.k-crew .avatar:first-child { margin-inline-start: 0; }
.k-crew small { margin-inline-start: 8px; font-size: var(--fs-xs); min-width: 0; overflow-wrap: anywhere; }
.k-tasks { display: flex; flex-direction: column; gap: 4px; }
.k-tasks span { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); white-space: nowrap; }
.k-tasks .i { color: var(--ok); }
.k-tasks .open { color: var(--muted); }
.k-tasks .open .i { color: var(--accent); }
.k-stages { display: flex; flex-wrap: wrap; gap: 4px; }
.k-stages span { font-size: var(--fs-xs); padding: 1px 8px; border-radius: var(--r-pill); background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.k-stages span.on { background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-semibold); }
.k-tree { max-height: 340px; overflow: auto; }
.k-tree td:first-child label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.k-tree tr.lv0 td:first-child { font-weight: var(--fw-bold); }
.k-tree tr.lv1 td:first-child { padding-inline-start: 34px; font-weight: var(--fw-semibold); }
.k-tree tr.lv2 td:first-child { padding-inline-start: 58px; }
.k-tree tr.busy { opacity: .55; }
.k-tree tr.sel { background: var(--accent-soft); }
.k-panel { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--accent-line); background: var(--accent-soft); }
.k-panel > b { font-size: var(--fs-sm); color: var(--accent); }
.dt tr.k-diff td { background: var(--warn-soft); }
.dt td.k-old { color: var(--muted); }
.dt .k-sel { min-width: 150px; max-width: 220px; }
.dt th .sub { display: block; font-weight: 400; }
.dt tfoot td, .dt tfoot th { background: var(--surface-2); font-weight: var(--fw-bold); }
.k-notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.k-notes li { padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sm); }
.k-notes li small { display: block; color: var(--muted); font-size: var(--fs-xs); }
.k-empty { display: inline-flex; gap: 8px; align-items: center; font-size: var(--fs-sm); cursor: pointer; }
.k-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, .8fr) 32px; gap: 10px; align-items: end; }
@media (max-width: 640px) { .k-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

/* drag and drop between receipt stages */
.card.drag { cursor: grab; }
.card.drag:active { cursor: grabbing; }
.card-t { position: relative; }
.card.drag .card-t { padding-inline-end: 22px; }
.grip { position: absolute; inset-inline-end: -4px; top: 0; color: var(--disabled); transition: color var(--t-fast) var(--ease); }
.card.drag:hover .grip { color: var(--accent); }
.card.dragging { opacity: .45; transform: rotate(-1.5deg) scale(.98); box-shadow: var(--e16); }
.movebtn { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: var(--r-pill); padding: 2px 12px; font-size: var(--fs-xs); cursor: pointer; transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.movebtn:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.board.is-dragging .col { transition: opacity var(--t-med) var(--ease), background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.col.drop-ok { position: relative; box-shadow: inset 0 0 0 2px var(--accent-line); border-style: dashed; padding-bottom: 52px; }
.col.drop-ok::after { content: attr(data-hint); position: absolute; inset-inline: 12px; bottom: 10px; text-align: center; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--accent); background: var(--surface); border-radius: var(--r-pill); padding: 6px 10px; box-shadow: var(--e1); }
.col.over { background: var(--grad-soft); box-shadow: inset 0 0 0 2px var(--accent), var(--e2); }
.col.over::after { background: var(--grad); color: #FFFFFF; }
.col.drop-no { opacity: .4; }
.move-path { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
.move-path span { padding: 4px 14px; border-radius: var(--r-pill); font-size: var(--fs-sm); font-weight: var(--fw-semibold); background: var(--surface-3); color: var(--fg-2); }
.move-path .to { background: var(--grad); color: #FFFFFF; }
.move-path .to.back { background: linear-gradient(135deg, #FFC069, #FA8C16); }
.move-path .to.done { background: linear-gradient(135deg, #73D13D, #389E0D); }
.move-path .i { color: var(--muted); }

/* receipts: table / card switch and card view */
.view-switch button { display: inline-flex; align-items: center; gap: 6px; }
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-4); }
.rcard {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px 16px; box-shadow: var(--e4);
  transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
}
.rcard::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--line-strong); }
.rcard.s-wait::before { background: linear-gradient(90deg, #FFC069, #FA8C16); }
.rcard.s-review::before { background: var(--grad); }
.rcard.s-done::before { background: linear-gradient(90deg, #95DE64, #389E0D); }
.rcard.s-cancel { opacity: .78; }
.rcard:hover { box-shadow: var(--e2); transform: translateY(-2px); border-color: var(--accent-line); }
.rcard:active { transform: none; box-shadow: var(--e4); }
.rcard header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rcard header .code { font-size: var(--fs-sm); font-weight: var(--fw-semibold); display: block; }
.rcard header small { display: block; font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.rc-main b { display: block; font-size: var(--fs-md); font-weight: var(--fw-bold); line-height: 1.5; }
.rc-main span { font-size: var(--fs-xs); color: var(--muted); }
.rc-wh { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.rc-wh .i { color: var(--accent); }
.rc-wh small { margin-inline-start: auto; color: var(--muted); font-size: var(--fs-xs); }
.rc-stages { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rc-stage { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); padding: 2px 10px; border-radius: var(--r-pill); background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.rc-stage.on { background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-semibold); }
.rc-stage b { background: var(--grad); color: #FFFFFF; border-radius: var(--r-pill); padding: 0 6px; font-size: var(--fs-2xs); line-height: 16px; }
.rc-ar { font-style: normal; color: var(--muted); font-size: .7rem; }
.rc-held { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--warn); background: var(--warn-soft); border-radius: var(--r-sm); padding: 6px 10px; font-weight: var(--fw-semibold); }
.rc-prog { display: flex; flex-direction: column; gap: 6px; }
.rc-prog .bar { min-width: 0; }
.rc-prog span { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.rcard footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); }
.rcard footer > .i { transition: transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.rcard:hover footer > .i { color: var(--accent); transform: translateX(-3px); }
.rc-owners { display: flex; align-items: center; min-width: 0; }
.rc-owners .avatar { width: 28px; height: 28px; font-size: var(--fs-xs); border: 2px solid var(--surface); margin-inline-start: -8px; }
.rc-owners .avatar:first-child { margin-inline-start: 0; }
.rc-owners small { margin-inline-start: 8px; font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .rcards { grid-template-columns: minmax(0, 1fr); } .view-switch button span { display: none; } }

.tip {
  position: fixed; z-index: 45; pointer-events: none; background: var(--glass-strong); backdrop-filter: blur(12px); color: var(--fg); border: 1px solid var(--line);
  font-size: var(--fs-xs); padding: 8px 12px; border-radius: var(--r-sm); box-shadow: var(--e16); max-width: 260px; line-height: 1.6;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-xs); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- management dashboard ---------- */
.dash { display: flex; flex-direction: column; gap: var(--sp-5); }
/* filter bar: frosted glass card with grouped controls */
.dash-bar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h) + 8px); z-index: 5;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: var(--glass-strong); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e4);
}
.dash-bar .select { min-width: 150px; background-color: var(--surface); }
.dash-bar .filt { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: var(--fs-sm); font-weight: var(--fw-semibold); padding: 0 12px; height: var(--h-ctl); border-radius: var(--r-sm); background: var(--grad-soft); }
.dash-bar .linkbtn { margin-inline-start: auto; font-size: var(--fs-xs); display: inline-flex; gap: 6px; align-items: center; padding: 0 12px; height: var(--h-ctl); border-radius: var(--r-sm); color: var(--muted); }
.dash-bar .linkbtn:hover { background: var(--hover); color: var(--accent); }
/* dashboard tabs: pill tabs in a soft track */
.dtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--surface-3); border-radius: var(--r-md); align-self: flex-start; max-width: 100%; }
.dtabs button {
  border: 0; background: none; padding: 0 16px; min-height: 36px; font-size: var(--fs-sm); font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap;
  display: inline-flex; gap: 8px; align-items: center; border-radius: var(--r-sm); transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.dtabs button:hover { color: var(--fg); background: color-mix(in srgb, var(--surface) 55%, transparent); }
.dtabs button.on { color: var(--accent); font-weight: var(--fw-semibold); background: var(--surface); box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 2px 8px rgba(16, 24, 40, .06); }
.dtabs .badge { font-size: var(--fs-2xs); background: linear-gradient(135deg, #FFA940, #FA541C); color: #FFFFFF; border-radius: var(--r-pill); padding: 0 7px; font-weight: var(--fw-bold); line-height: 18px; }
.dkpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-4); }
.dkpi {
  position: relative; overflow: hidden; text-align: start; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px 20px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--e4);
}
button.dkpi { cursor: pointer; transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease), border-color var(--t-med) var(--ease); }
button.dkpi:hover { box-shadow: var(--e2); transform: translateY(-2px); border-color: var(--accent-line); }
.dkpi .l { font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
/* KPI hint: small info icon after the title */
.khint { display: inline-flex; vertical-align: middle; margin-inline-start: 4px; color: var(--muted); cursor: help; border-radius: var(--r-pill); position: relative; z-index: 2; transition: color var(--t-fast) var(--ease); }
.khint::before { content: ""; position: absolute; inset: -8px; }
.khint:hover, .khint:focus-visible, .khint.on { color: var(--accent); }
.khint:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.khint .i { width: 14px; height: 14px; }
.dkpi .v { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.dkpi .v b { font-size: 1.75rem; font-weight: var(--fw-bold); line-height: 1.3; font-variant-numeric: tabular-nums; }
.dkpi .v small { font-size: var(--fs-xs); color: var(--muted); }
.dkpi .n { font-size: var(--fs-2xs); color: var(--muted); position: relative; z-index: 1; }
.dkpi.warn { background: linear-gradient(160deg, var(--warn-soft), var(--surface) 55%); border-color: var(--warn-line); }
.dkpi.bad { background: linear-gradient(160deg, var(--bad-soft), var(--surface) 55%); border-color: var(--bad-line); }
.dkpi.warn .v b { color: var(--warn); } .dkpi.bad .v b { color: var(--bad); }
.delta { font-size: var(--fs-2xs); font-weight: var(--fw-semibold); border-radius: var(--r-pill); padding: 0 8px; background: var(--surface-3); color: var(--muted); white-space: nowrap; line-height: 20px; }
.delta.good { background: var(--ok-soft); color: var(--ok); } .delta.bad { background: var(--bad-soft); color: var(--bad); }
.spark { position: absolute; inset-inline: 0; bottom: 0; width: 100%; height: 30px; opacity: .45; pointer-events: none; }
.dkpi:has(.spark) { padding-bottom: 36px; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
/* "coming soon" metrics: title stays readable, figures are blurred and inert */
.soon-tag { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: var(--fs-2xs); font-weight: var(--fw-semibold); color: var(--muted); background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 8px; line-height: 20px; white-space: nowrap; }
.soon-tag .i { width: 12px; height: 12px; }
.soon-blur { filter: blur(6px) saturate(.6); opacity: .55; pointer-events: none; user-select: none; }
.dkpi.soon .l { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dkpi.soon .soon-blur { display: flex; flex-direction: column; gap: 4px; }
.soon-body { position: relative; }
.soon-note { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--muted); pointer-events: none; }
.dblock.soon:hover { box-shadow: var(--e4); }
.dkpis.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dkpi.mini { padding: 10px 14px; box-shadow: none; background: var(--surface-2); border-radius: var(--r-md); } .dkpi.mini .v b { font-size: 1.15rem; }
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--sp-4); align-items: stretch; }
.dblock {
  grid-column: span 12; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--e4);
  transition: box-shadow var(--t-med) var(--ease);
}
.dblock:hover { box-shadow: var(--e2); }
.dblock.s4 { grid-column: span 4; } .dblock.s6 { grid-column: span 6; } .dblock.s8 { grid-column: span 8; }
.dblock header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dblock h3 { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-bold); line-height: 1.5; }
.dblock header p { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--muted); }
.dblock header .linkbtn { font-size: var(--fs-xs); white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--accent-soft); }
.dblock header .linkbtn:hover { background: var(--pressed); }
.chart-box { position: relative; width: 100%; min-width: 0; }
.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alerts button {
  width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: start; font: inherit; color: var(--fg);
  border: 1px solid transparent; background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 8px; cursor: pointer; font-size: var(--fs-sm);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.alerts button:hover { background: var(--hover); border-color: var(--accent-line); transform: translateX(-2px); }
.alerts b { font-size: var(--fs-md); font-weight: var(--fw-bold); text-align: center; border-radius: 8px; font-variant-numeric: tabular-nums; line-height: 32px; }
.alerts .bad b { background: var(--bad-soft); color: var(--bad); }
.alerts .warn b { background: var(--warn-soft); color: var(--warn); }
.alerts .info b { background: var(--accent-soft); color: var(--accent); }
.alerts .zero { color: var(--muted); } .alerts .zero b { background: var(--surface-3); color: var(--muted); }
.alerts i { font-style: normal; color: var(--muted); }
.tb-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tb-tools .input.sm { max-width: 240px; min-height: var(--h-ctl-sm); padding: 2px 12px; font-size: var(--fs-xs); border-radius: var(--r-pill); }
.tb-count { font-size: var(--fs-xs); color: var(--muted); margin-inline-start: auto; }
/* in-card tables: rounded soft header row, light separators */
.dt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
.dt { width: 100%; min-width: 0; border-collapse: separate; border-spacing: 0; font-size: var(--fs-xs); }
.dt th, .dt td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
.dt th { background: var(--surface-2); color: var(--muted); font-weight: var(--fw-semibold); position: static; }
.dt th button { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; }
.dt th button:hover { color: var(--accent); }
.dt th.num, .dt td.num { text-align: end; font-variant-numeric: tabular-nums; }
.dt tbody tr:hover { background: var(--hover); }
.dt tbody tr[data-item], .dt tbody tr[data-rid], .dt tbody tr[data-dwh], .dt tbody tr[data-qid] { cursor: pointer; }
.dt .t-bad { color: var(--bad); } .dt .t-warn { color: var(--warn); }
.dt tbody tr:last-child td { border-bottom: 0; }
.box > .dt, .box > table.dt { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.tb-more { text-align: center; font-size: var(--fs-sm); }
.tb-more .linkbtn { padding: 6px 16px; border-radius: var(--r-pill); background: var(--accent-soft); }
.heat { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: var(--fs-xs); }
.heat th { font-weight: 500; color: var(--muted); text-align: start; white-space: nowrap; padding: 2px 6px; background: none; position: static; border: 0; }
.heat td { height: 32px; border-radius: 8px; text-align: center; border: 0; padding: 0; background: color-mix(in srgb, var(--c1) calc(var(--h) * 85%), var(--surface-3)); }
.heat td span { font-variant-numeric: tabular-nums; color: var(--fg); background: var(--surface); border-radius: 6px; padding: 0 5px; opacity: .92; }
.heat-scale { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(to left, var(--surface-3), var(--c1)); display: inline-block; }
.dt-wrap:has(.heat) { border: 0; }
.dfoot { font-size: var(--fs-xs); color: var(--muted); margin: 0; display: flex; gap: 6px; align-items: flex-start; }

/* ---------- dialogs ---------- */
.dlg-wrap { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: var(--scrim); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); animation: fade var(--t-med) var(--ease); }
.dlg-wrap.top { align-items: start; padding-top: max(10vh, env(safe-area-inset-top, 0px)); }
.dialog {
  width: min(600px, 100%); max-height: 100%; overflow: auto; background: var(--surface);
  border-radius: var(--r-lg); box-shadow: var(--e3); display: flex; flex-direction: column; border: 1px solid var(--line);
  animation: pop .25s var(--ease);
}
.dialog.wide { width: min(840px, 100%); }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 20px 24px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dlg-head h3 { margin: 0; font-size: var(--fs-lg); font-weight: var(--fw-bold); line-height: 1.6; }
.dlg-head p { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--muted); }
.dlg-body { padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 16px; }
.dlg-foot { position: sticky; bottom: 0; background: var(--surface-2); border-top: 1px solid var(--line); padding: 14px 24px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; font-size: var(--fs-sm); }
.checks label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-pill); padding: 4px 14px; min-height: var(--h-ctl-sm); transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.checks label:hover { border-color: var(--accent-line); }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-semibold); }
.checks input { accent-color: var(--accent); }
.result-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.items-table { width: 100%; min-width: 0; border-collapse: collapse; }
.items-table td, .items-table th { padding: 6px 4px; border: 0; background: none; position: static; }
.items-table th { font-size: var(--fs-xs); color: var(--muted); }
.items-wrap { overflow-x: auto; }
.items-wrap table { min-width: 460px; }

/* command palette */
.cmd { width: min(640px, 100%); overflow: hidden; background: var(--glass-strong); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); }
.cmd-in { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); color: var(--muted); }
.cmd-input { flex: 1; border: 0; background: transparent; min-height: 58px; font-size: var(--fs-lg); outline: none; color: var(--fg); box-shadow: none !important; }
.cmd-input::placeholder { color: var(--muted); }
.cmd-list { list-style: none; margin: 0; padding: 8px; max-height: min(58vh, 460px); overflow-y: auto; }
.cmd-group { font-size: var(--fs-2xs); color: var(--muted); font-weight: var(--fw-bold); padding: 10px 12px 4px; }
.cmd-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer; min-height: 48px; transition: background var(--t-fast) var(--ease); }
.cmd-item:hover { background: var(--hover); }
.cmd-item .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-3); color: var(--fg-2); flex: none; }
.cmd-item b { font-weight: var(--fw-semibold); font-size: var(--fs-sm); display: block; line-height: 1.5; }
.cmd-item small { color: var(--muted); font-size: var(--fs-xs); }
.cmd-item .go { margin-inline-start: auto; color: var(--muted); opacity: 0; }
.cmd-item.on { background: var(--grad-soft); }
.cmd-item.on .ic { background: var(--grad); color: #FFFFFF; }
.cmd-item.on .go { opacity: 1; color: var(--accent); }
.cmd-empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.cmd-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); flex-wrap: wrap; }
.cmd-foot span { display: inline-flex; gap: 4px; align-items: center; }

.toast {
  position: fixed; z-index: 40; right: 50%; transform: translateX(50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
  background: var(--glass-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--fg);
  border: 1px solid var(--line); padding: 12px 18px; border-radius: var(--r-md);
  font-size: var(--fs-sm); font-weight: 500; box-shadow: var(--e16); max-width: calc(100% - 32px); animation: toastIn .3s var(--ease);
}
.toast .i { color: var(--ok); }
.toast.bad .i { color: var(--bad); }
@keyframes toastIn { from { transform: translate(50%, 14px); opacity: 0; } to { transform: translateX(50%); opacity: 1; } }

/* ---------- design-system page ---------- */
.ds-sec { display: flex; flex-direction: column; gap: 12px; }
.ds-sec > h2 { font-size: var(--fs-xl); font-weight: var(--fw-bold); margin: 8px 0 0; }
.ds-sec > p { margin: 0; color: var(--muted); font-size: var(--fs-sm); max-width: 76ch; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.sw { border-radius: var(--r-md); overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--e4); }
.sw i { display: block; height: 56px; border-bottom: 1px solid var(--line); }
.sw div { padding: 8px 12px; display: flex; flex-direction: column; }
.sw b { font-size: var(--fs-xs); font-weight: var(--fw-semibold); }
.sw span { font-size: var(--fs-2xs); color: var(--muted); }
.type-row { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.type-row:last-child { border-bottom: 0; }
.type-row span { font-size: var(--fs-xs); color: var(--muted); }
.ds-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.space-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--fs-2xs); color: var(--muted); }
.space-chip i { display: block; background: var(--grad); border-radius: 3px; height: 16px; }
.radius-chip { width: 72px; height: 52px; background: var(--grad-soft); border: 1px solid var(--accent-line); display: grid; place-items: center; font-size: var(--fs-2xs); color: var(--accent); text-align: center; line-height: 1.4; }
.shadow-chip { width: 100px; height: 60px; background: var(--surface); border-radius: var(--r-md); display: grid; place-items: center; font-size: var(--fs-2xs); color: var(--muted); }
.laws { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.law { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--e4); transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease); }
.law:hover { box-shadow: var(--e2); transform: translateY(-2px); }
.law header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.law h4 { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-bold); }
.law header span { font-size: var(--fs-2xs); color: var(--muted); direction: ltr; }
.law p { margin: 0; font-size: var(--fs-sm); color: var(--fg-2); }
.law .where { font-size: var(--fs-xs); color: var(--accent); background: var(--grad-soft); border-radius: var(--r-sm); padding: 8px 12px; }
.ds-refs { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-refs a { color: var(--accent); font-weight: var(--fw-semibold); font-size: var(--fs-sm); text-decoration: none; border: 1px solid var(--accent-line); border-radius: var(--r-pill); padding: 6px 16px; background: var(--surface); transition: background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
.ds-refs a:hover { background: var(--accent-soft); box-shadow: var(--e2); }

/* ---------- responsive ---------- */
/* breakpoints count the 264px sidebar: at 1440 the content column is only ~1130px, too narrow for six KPI cards */
@media (max-width: 1440px) { .dkpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* eight cards (stocktaking tab): two even rows of four instead of 6 + 2 or 3 + 3 + 2 */
@media (min-width: 601px) { .dkpis:has(> :nth-child(8):last-child) { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1180px) { .dblock.s4 { grid-column: span 6; } .dblock.s8 { grid-column: span 12; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { display: none; }
  .tb-brand { display: flex; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px)); }
  .searchbtn { width: auto; flex: 1; min-width: 0; }
  .searchbtn kbd { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(7, 1fr); position: fixed; inset: auto 0 0; z-index: 9;
    background: var(--glass-strong); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .tabbar button { border: 0; background: none; min-height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--fs-2xs); font-weight: 500; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar button .i { width: 24px; height: 24px; padding: 0; }
  .tabbar button.on { color: var(--accent); font-weight: var(--fw-semibold); }
  .tabbar button.on .i { background: var(--accent-soft); border-radius: var(--r-pill); width: 52px; height: 28px; padding: 2px 14px; box-sizing: border-box; }
  .tabbar .count { position: absolute; top: 6px; margin-inline-start: 30px; font-size: 10px; background: var(--bad-bg); color: #FFFFFF; border-radius: var(--r-pill); padding: 0 5px; min-width: 16px; line-height: 16px; text-align: center; font-weight: var(--fw-bold); }
  .tabbar .count:empty { display: none; }
  .toast { bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px)); }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .dblock.s4, .dblock.s6, .dblock.s8 { grid-column: span 12; }
}
@media (max-width: 600px) {
  .head h1, .dash-head h1 { font-size: var(--fs-2xl); }
  .theme-seg { display: none; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .sample-note { margin-inline-start: 0; }
  .sheet { border-radius: 0; }
  .sheet-body, .sheet-head, .sheet-foot { padding-inline: 16px; }
  .result-grid { grid-template-columns: minmax(0, 1fr); }
  .dkpis, .dkpis.mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary { gap: 10px; }
  .sum { padding: 14px; }
  .sum .ic { width: 40px; height: 40px; }
  .dash-bar { position: static; }
  .dash-bar .select { flex: 1 1 140px; min-width: 0; }
  .field-inline { max-width: none; }
  .dlg-wrap { align-items: end; padding: 0; padding-top: max(24px, env(safe-area-inset-top, 0px)); }
  .dlg-wrap.top { align-items: start; padding: max(12px, env(safe-area-inset-top, 0px)) 12px 12px; }
  .dialog { border-radius: var(--r-lg) var(--r-lg) 0 0; width: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheetUp .3s var(--ease); }
  .dialog.wide { width: 100%; }
  .dlg-wrap.top .dialog { border-radius: var(--r-lg); animation: pop .25s var(--ease); }
  .dlg-head, .dlg-body, .dlg-foot { padding-inline: 16px; }
  @keyframes sheetUp { from { transform: translateY(60px); opacity: .3; } to { transform: none; opacity: 1; } }
  .stepper li { flex-basis: 96px; }
  .type-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
@media print {
  .nav, .topbar, .tabbar, .dash-bar, .head-actions, .tb-tools, .tb-more, .toast, .dtabs button:not(.on) { display: none !important; }
  .shell { display: block; } body { background: #fff; }
  .dblock, .dkpi { break-inside: avoid; box-shadow: none; }
}
/* ---------- glass layer: frosted content surfaces over the page glow (tables, forms and kanban cards stay opaque for legibility) ---------- */
:root {
  --glass-card: rgba(255, 255, 255, .52);
  --glass-dlg: rgba(255, 255, 255, .84);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .25);
  --glass-sheen: linear-gradient(155deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, .15) 45%, rgba(255, 255, 255, 0) 70%);
  --glass-shadow: 0 1px 2px rgba(31, 56, 110, .05), 0 8px 24px rgba(31, 56, 110, .08);
  --glass-shadow-hover: 0 2px 4px rgba(31, 56, 110, .06), 0 14px 36px rgba(31, 56, 110, .13);
  /* soft per-card tints: blue (brand), amber, red, green, teal */
  --tint-accent: rgba(22, 119, 255, .09); --tint-violet: rgba(124, 92, 255, .07);
  --tint-warn: rgba(250, 140, 22, .12); --tint-bad: rgba(245, 34, 45, .10); --tint-ok: rgba(82, 196, 26, .11); --tint-teal: rgba(19, 194, 194, .08);
  --blur-card: blur(20px) saturate(1.8);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass-card: rgba(30, 36, 48, .48); --glass-dlg: rgba(24, 28, 37, .86); --glass-edge: rgba(255, 255, 255, .09);
    --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .10), inset 0 0 0 1px rgba(255, 255, 255, .02);
    --glass-sheen: linear-gradient(155deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02) 45%, rgba(255, 255, 255, 0) 70%);
    --glass-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28); --glass-shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4);
    --tint-accent: rgba(64, 150, 255, .12); --tint-violet: rgba(124, 92, 255, .10);
    --tint-warn: rgba(232, 154, 60, .13); --tint-bad: rgba(232, 110, 107, .13); --tint-ok: rgba(106, 190, 57, .12); --tint-teal: rgba(19, 194, 194, .10);
  }
}
:root[data-theme="dark"] {
  --glass-card: rgba(30, 36, 48, .48); --glass-dlg: rgba(24, 28, 37, .86); --glass-edge: rgba(255, 255, 255, .09);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .10), inset 0 0 0 1px rgba(255, 255, 255, .02);
  --glass-sheen: linear-gradient(155deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02) 45%, rgba(255, 255, 255, 0) 70%);
  --glass-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28); --glass-shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4);
  --tint-accent: rgba(64, 150, 255, .12); --tint-violet: rgba(124, 92, 255, .10);
  --tint-warn: rgba(232, 154, 60, .13); --tint-bad: rgba(232, 110, 107, .13); --tint-ok: rgba(106, 190, 57, .12); --tint-teal: rgba(19, 194, 194, .10);
}
@media (prefers-reduced-transparency: reduce) {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) { --glass-card: var(--surface); --glass-dlg: var(--surface); --glass: var(--surface); --glass-strong: var(--surface); --blur-card: none; }
}
.sum, .dkpi:not(.mini), .dblock, .toolbar, .rcard {
  --tint: var(--tint-accent); --tint-2: var(--tint-violet);
  background:
    var(--glass-sheen),
    radial-gradient(120% 90% at 100% 0%, var(--tint), transparent 62%),
    radial-gradient(90% 80% at 0% 100%, var(--tint-2), transparent 65%),
    var(--glass-card);
  backdrop-filter: var(--blur-card); -webkit-backdrop-filter: var(--blur-card);
  border-color: var(--glass-edge); box-shadow: var(--glass-hi), var(--glass-shadow);
}
.dblock, .toolbar { --tint: rgba(22, 119, 255, .04); --tint-2: transparent; }
.sum:hover, .dkpi:not(.mini):hover, .dblock:hover, .rcard:hover { box-shadow: var(--glass-hi), var(--glass-shadow-hover); }
.rcard:hover { border-color: var(--accent-line); }
/* tone follows meaning: status cards get the status tint, others alternate brand hues */
.dkpi:nth-child(3n+2), .sum:nth-child(3n+2) { --tint-2: var(--tint-teal); }
.dkpi.warn, .rcard.s-wait { --tint: var(--tint-warn); --tint-2: transparent; }
.dkpi.bad { --tint: var(--tint-bad); --tint-2: transparent; }
.rcard.s-done { --tint: var(--tint-ok); --tint-2: transparent; }
.rcard.s-cancel { --tint: transparent; --tint-2: transparent; }
.dkpi.warn { border-color: color-mix(in srgb, var(--warn-line) 70%, var(--glass-edge)); }
.dkpi.bad { border-color: color-mix(in srgb, var(--bad-line) 70%, var(--glass-edge)); }
.sum .ic { background: linear-gradient(135deg, rgba(22, 119, 255, .16), rgba(124, 92, 255, .14)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
.sum .ic.ok { background: linear-gradient(135deg, var(--tint-ok), var(--ok-soft)); } .sum .ic.warn { background: linear-gradient(135deg, var(--tint-warn), var(--warn-soft)); }
.sum .ic.bad { background: linear-gradient(135deg, var(--tint-bad), var(--bad-soft)); }
.rc-wh { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.col { border-color: var(--glass-edge); box-shadow: var(--glass-hi); }
.dialog { background: var(--glass-dlg); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-color: var(--glass-edge); box-shadow: var(--glass-hi), var(--e3); }
.dlg-head { background: transparent; }
.dlg-foot { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.nav, .topbar { box-shadow: var(--glass-hi); }

<!-- ================= tank monitoring (پایش مخازن): own styles and icons, tk- prefix ================= -->
<style>
:root { --tk-glucose: #E5A23A; --tk-invert: #B9702B; --tk-oil: #B7B23A; --tk-glass: #EEF2F8; --tk-glass-line: #C3CCDA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tk-glucose: #D6952F; --tk-invert: #B06A2A; --tk-oil: #A9A436; --tk-glass: #1D232E; --tk-glass-line: #3D4656; } }
:root[data-theme="dark"] { --tk-glucose: #D6952F; --tk-invert: #B06A2A; --tk-oil: #A9A436; --tk-glass: #1D232E; --tk-glass-line: #3D4656; }
@media (max-width: 900px) { .tabbar { grid-template-columns: repeat(8, 1fr); } }
.tk-live { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-2); background: var(--ok-soft); border-radius: var(--r-pill); padding: 4px 12px; white-space: nowrap; }
.tk-live.off { background: var(--surface-3); }
.tk-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; animation: tk-pulse 2s infinite; }
.tk-dot.off { background: var(--bad); animation: none; }
@keyframes tk-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.tk-u { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); margin-inline-start: 4px; }
.tk-chk { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--fg-2); cursor: pointer; }
.tk-chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.tk-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-5); align-items: start; }
@media (max-width: 1180px) { .tk-layout { grid-template-columns: minmax(0, 1fr); } }
.tk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: var(--sp-4); }
.tk-card { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e4); cursor: pointer; min-width: 0; transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.tk-card:hover { border-color: var(--accent-line); box-shadow: var(--e2); transform: translateY(-1px); }
.tk-card:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--ring), var(--e2); }
.tk-card.s-warn { border-color: var(--warn-line); }
.tk-card.s-bad { border-color: var(--bad-line); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 9%, transparent), var(--e4); }
.tk-card.s-off { background: var(--surface-2); }
